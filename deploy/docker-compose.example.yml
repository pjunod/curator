# Monarr — compose deployment TEMPLATE.
#
#   cp docker-compose.example.yml docker-compose.yml   # once; yours to edit
#   ./bootstrap.sh                                     # host dirs, right owner
#   docker compose up -d --build                       # build/rebuild + (re)start
#
# ⚠ Run bootstrap.sh before the first `up`. Compose cannot declare a bind
# mount's ownership: if the host directory doesn't exist, Docker creates it
# as root, and Monarr — running as ${PUID}:${PGID} — then can't create its
# database and won't start. See deploy/README.md.
#
# ⚠ Your copy must STAY IN deploy/ — the build context (..) resolves
# relative to this file's location, so a copy at the repo root fails with
# "lstat …/deploy: no such file or directory". Running from elsewhere is
# fine, just point at the file:
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Your docker-compose.yml is gitignored — pulls update this example, never
# your customized copy (diff against the example after big updates).
#
# Defaults baked in: /srv/monarr (config) and /srv/pool (media +
# downloads), running as 1000:1000. Override any of them by exporting the
# variable or putting it in a .env file next to this one
# (cp .env.example .env — every variable is documented there).
#
# THE ONE RULE (see README + docs/deployment.md): your download client must
# see the pool at the SAME container path as Monarr — mount the same host
# folder at /pool in both containers. That's also what makes imports
# hardlink instead of copy. Keep /data off NFS/Gluster; the pool is fine
# on shared storage.
#
# No healthcheck: the runtime image is distroless (no shell to probe with).
# Poll http://<host>:7676/api/v1/health externally if you want one.

services:
  monarr:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: monarr
    container_name: monarr
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "7676:7676"
    volumes:
      - ${MONARR_DATA:-/srv/monarr}:/data
      - ${MONARR_POOL:-/srv/pool}:/pool
    restart: unless-stopped

  # ---- optional: a download client on the same pool ----------------------
  # Uncomment if you don't already run one. Point Monarr at
  # http://qbittorrent:8080 (same compose network) and set its save path
  # to /pool/downloads.
  #
  # qbittorrent:
  #   image: lscr.io/linuxserver/qbittorrent:latest
  #   container_name: qbittorrent
  #   environment:
  #     - PUID=${PUID:-1000}
  #     - PGID=${PGID:-1000}
  #     - WEBUI_PORT=8080
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ${QBIT_CONFIG:-/srv/qbittorrent}:/config
  #     - ${MONARR_POOL:-/srv/pool}:/pool   # same pool, same path — required
  #   restart: unless-stopped
  #
  # Already running NZBGet/qBittorrent elsewhere on the host or LAN? Skip
  # this and add it in Monarr's Settings with its host+port — just make
  # sure the paths it reports are reachable from Monarr's container (mount
  # the same storage at the same path).
