openapi: 3.0.3
info:
  title: Monarr API
  version: "1"
  description: >
    Native Monarr API (spec-first; blueprint §7). Served under /api/v1.
    This is the only API the web UI uses. Phase 0 surface: system status,
    health, scheduler tasks, and the SSE event stream.
  license:
    name: GPL-3.0

paths:
  /system/status:
    get:
      operationId: getSystemStatus
      summary: System status
      responses:
        "200":
          description: Current system status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"

  /system/tasks:
    get:
      operationId: listTasks
      summary: Scheduler task states
      responses:
        "200":
          description: All registered scheduled tasks with their run state.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskState"

  /system/tasks/{name}/run:
    post:
      operationId: runTask
      summary: Trigger an immediate run of a scheduled task
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Run requested (requests coalesce if one is pending).
        "404":
          description: No task with that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /health:
    get:
      operationId: getHealth
      summary: Run health checks and report results
      responses:
        "200":
          description: Health report; overall is the worst check status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"

  /library:
    get:
      operationId: listLibrary
      summary: List library items
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MediaKind"
      responses:
        "200":
          description: Item summaries, sorted by title.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaItemSummary"
    post:
      operationId: addLibraryItem
      summary: Add a media item (hydrates metadata from the provider)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMediaRequest"
      responses:
        "201":
          description: The newly added, fully hydrated item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItemDetail"
        "400":
          description: Unsupported kind or invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Item already in the library.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Metadata provider not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/{id}:
    get:
      operationId: getLibraryItem
      summary: Get one item with seasons, episodes, and files
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItemDetail"
        "404":
          description: No such item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateLibraryItem
      summary: Edit an item's monitoring, quality profile, or location
      description: >
        Absent fields are left as they are. Setting rootFolderId recomputes
        the item folder from the naming rules (path, when also given, wins);
        rootFolderId 0 clears the assignment. Files on disk are never moved.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMediaItemRequest"
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItemDetail"
        "400":
          description: Invalid edit (e.g. relative path).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteLibraryItem
      summary: Remove an item from the library (files on disk are untouched)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Removed.
        "404":
          description: No such item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/scan:
    post:
      operationId: scanLibrary
      summary: Trigger a disk scan / reconcile
      responses:
        "202":
          description: Scan requested (runs via the scheduler; watch SSE).

  /library/scan/report:
    get:
      operationId: getScanReport
      summary: Result of the most recent scan
      description: >
        unmatchedDirs is capped so a library of several hundred unmatched
        folders does not arrive whenever the settings page loads; the full
        list is paginated at /library/review. unmatchedTotal is always the
        true count.
      parameters:
        - name: limit
          in: query
          required: false
          description: Cap on embedded unmatchedDirs (default 25, max 200, 0 for none).
          schema:
            type: integer
      responses:
        "200":
          description: The last scan report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanReport"
        "404":
          description: No scan has run yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/review:
    get:
      operationId: getReviewQueue
      summary: One page of the adoption review queue
      description: >
        The folders adoption could not resolve on its own, paginated and
        filterable. Falls back to the last scan's unmatched folders when no
        adoption run has happened yet, so a fresh scan never looks empty.
      parameters:
        - name: kind
          in: query
          required: false
          description: >
            Restrict to one media kind. Omit for every kind, including the
            mixed-root entries whose kind was never resolved.
          schema:
            $ref: "#/components/schemas/MediaKind"
        - name: q
          in: query
          required: false
          description: Free-text filter over the folder name and parsed title.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 0 means all — honoured, not clamped.
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: One page, plus totals for the whole queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPage"

  /library/adopt:
    post:
      operationId: runAdoption
      summary: Match the unmatched folders the last scan found
      description: >
        Parses each candidate folder name, searches the provider for the
        root's kind, and adopts the ones that clear the per-kind bar. The
        first pass over a new root proposes without writing; once the root is
        confirmed, later passes apply automatically (ADR 0010).
      responses:
        "200":
          description: What was adopted and what needs review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptResult"

  /library/manual:
    post:
      operationId: addManualEntry
      summary: Create a library record no provider backs (ADR 0012)
      description: >
        For media no metadata provider has right: programmes no database
        carries, home video, anything a user wants filed their own way. The
        folder must be a direct child of a registered root folder and must
        exist. For a series the episode list is read off the disk — the files
        are the truth for a record with no provider behind it — and files
        carrying no episode number are skipped rather than guessed at. The
        entry is created unmonitored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, title, path]
              properties:
                kind:
                  $ref: "#/components/schemas/MediaKind"
                title:
                  type: string
                year:
                  type: integer
                author:
                  type: string
                  description: Books only.
                overview:
                  type: string
                path:
                  type: string
                  description: Absolute folder, a direct child of a root folder.
      responses:
        "201":
          description: The new entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItemDetail"
        "400":
          description: Missing title, unsupported kind, or a folder outside a root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another item already points at that folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/{id}/rescan:
    post:
      operationId: rescanManualEntry
      summary: Re-read a manual series' folder for episodes that have appeared
      description: >
        Adds episodes for new files and never removes any: a missing file is
        the normal state of a monitored episode. Only valid for manual
        entries — provider-backed items use metadata refresh.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The entry, with any new episodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItemDetail"
        "400":
          description: Not a manual entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/adopt/one:
    post:
      operationId: adoptOne
      summary: Adopt one reviewed folder to a chosen match
      description: >
        Applies a specific candidate to a specific folder, in place. The path
        must be one the review queue is currently offering — the endpoint
        writes a library item pointed at a directory, so arbitrary paths are
        refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                kind:
                  $ref: "#/components/schemas/MediaKind"
                tmdbId:
                  type: integer
                  format: int64
                tvdbId:
                  type: integer
                  format: int64
                olid:
                  type: string
                title:
                  type: string
                year:
                  type: integer
                force:
                  type: boolean
                  description: >
                    Re-point an existing library entry at this folder even
                    when it already points at a directory that exists. The
                    caller must have been told which other folder it is.
      responses:
        "204":
          description: Adopted; the folder leaves the review queue.
        "400":
          description: Not a folder awaiting review, or the match was rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Another folder already holds this title and also exists on disk.
            Resolvable: retry with force to move the entry here, or dismiss
            this folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/adopt/exact:
    post:
      operationId: adoptExact
      summary: Apply every confident match in the review queue
      description: >
        Adopts the proposals that clear the per-kind bar, including in roots
        whose first pass has not been confirmed — pressing this is the review.
      responses:
        "200":
          description: What was adopted and what still needs a human.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptResult"

  /library/adopt/confirm:
    post:
      operationId: confirmRootAdopted
      summary: Turn automatic adoption on or off for a root
      description: >
        Reversible on purpose. Confirming a root is a trust decision, and a
        switch that only goes one way is one users are right to hesitate
        over.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rootFolderId]
              properties:
                rootFolderId:
                  type: integer
                  format: int64
                autoAdopt:
                  type: boolean
                  description: Defaults to true.
      responses:
        "204":
          description: Confirmed.

  /library/scan/ignored:
    get:
      operationId: listIgnoredDirs
      summary: Directories dismissed as not-media
      responses:
        "200":
          description: Every dismissal, so it can be undone.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IgnoredPath"
    post:
      operationId: ignoreDir
      summary: Dismiss an adoption candidate for good
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                reason:
                  type: string
      responses:
        "204":
          description: Dismissed; scans stop offering it.
        "400":
          description: Path invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: unignoreDir
      summary: Undo a dismissal
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Restored; the next scan offers it again.

  /filesystem:
    get:
      operationId: browseFilesystem
      summary: List child directories of a path (root-folder picker and typeahead)
      description: >
        Directories only, one level, no recursion. Missing and unreadable
        paths return the same error on purpose — distinguishing them is what
        makes an enumeration primitive useful to someone probing the host.
        Requires authentication like every other settings route.
      parameters:
        - name: path
          in: query
          required: false
          description: >
            Absolute path to list. A trailing separator lists the directory;
            a partial final component filters that directory's children by
            prefix, which is what drives typeahead. Defaults to "/".
          schema:
            type: string
      responses:
        "200":
          description: The directory's child directories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowseResult"
        "400":
          description: Path not absolute, or not readable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /metadata/search:
    get:
      operationId: searchMetadata
      summary: Search the metadata provider
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MediaKind"
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Candidates from the provider.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "400":
          description: Unsupported kind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Metadata provider not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /discover/lists:
    get:
      operationId: listDiscoverLists
      summary: The Discover catalogue
      description: >
        Every browse row on offer, from every provider that is configured
        (ADR 0015). A provider missing its key contributes nothing rather
        than rows that would always fail, so an empty array means "no
        provider is set up", not "nothing is trending".
      responses:
        "200":
          description: The rows this install can serve, in display order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscoverList"

  /discover/items:
    get:
      operationId: discoverItems
      summary: One page of one Discover row
      parameters:
        - name: list
          in: query
          required: true
          description: A list id from /discover/lists.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 1-based. Past the end of a row, the array is empty.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The row's contents, marked with what is already added.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "400":
          description: No such list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The provider serving this list is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /rootfolders:
    get:
      operationId: listRootFolders
      summary: List library root folders
      responses:
        "200":
          description: Registered roots with disk info.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RootFolder"
    post:
      operationId: addRootFolder
      summary: Register a library root folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                kind:
                  $ref: "#/components/schemas/RootKind"
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootFolder"
        "400":
          description: Path invalid or not accessible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /rootfolders/{id}:
    patch:
      operationId: updateRootFolder
      summary: Retype a root folder (items already in it are untouched)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  $ref: "#/components/schemas/RootKind"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootFolder"
        "400":
          description: Unknown kind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such root folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteRootFolder
      summary: Remove a root folder registration (disk untouched)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Removed.
        "404":
          description: No such root folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /settings:
    get:
      operationId: getSettings
      summary: Read settings (secrets masked)
      responses:
        "200":
          description: Current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "204":
          description: Saved.

  /profiles:
    get:
      operationId: listProfiles
      summary: List quality profiles
      responses:
        "200":
          description: Profiles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QualityProfile"
    post:
      operationId: createProfile
      summary: Create a quality profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityProfile"
        "400":
          description: Invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: updateProfile
      summary: Replace a quality profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityProfile"
        "400":
          description: Invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteProfile
      summary: Delete a quality profile
      description: >
        Refused with 409 while any library item, copy, or import list still
        references the profile -- those rows would be left pointing at nothing.
      responses:
        "204":
          description: Deleted.
        "404":
          description: No such profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Still in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /indexers:
    get:
      operationId: listIndexers
      summary: List indexers
      responses:
        "200":
          description: Indexers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Indexer"
    post:
      operationId: addIndexer
      summary: Add an indexer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerInput"
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indexer"
        "400":
          description: Invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /indexers/test:
    post:
      operationId: testIndexer
      summary: Test an indexer config (t=caps)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerInput"
      responses:
        "200":
          description: Reachable.
        "400":
          description: Failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /indexers/{id}:
    delete:
      operationId: deleteIndexer
      summary: Remove an indexer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }
        "404":
          description: No such record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /indexers/{id}/test:
    post:
      operationId: testIndexerById
      summary: Test a saved indexer with its stored credentials
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Reachable. }
        "400":
          description: Test failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such indexer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /downloadclients:
    get:
      operationId: listDownloadClients
      summary: List download clients
      responses:
        "200":
          description: Clients.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadClientConfig"
    post:
      operationId: addDownloadClient
      summary: Add a download client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientInput"
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClientConfig"
        "400":
          description: Invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /downloadclients/test:
    post:
      operationId: testDownloadClient
      summary: Test a download client config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientInput"
      responses:
        "200": { description: Reachable. }
        "400":
          description: Failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /downloadclients/{id}:
    put:
      operationId: updateDownloadClient
      summary: Update a download client (e.g. toggle manual approval)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientInput"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadClientConfig" }
        "400":
          description: Invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteDownloadClient
      summary: Remove a download client
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }
        "404":
          description: No such record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /downloadclients/{id}/test:
    post:
      operationId: testDownloadClientById
      summary: Test a saved download client with its stored credentials
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Reachable. }
        "400":
          description: Test failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/releases:
    get:
      operationId: searchReleases
      summary: Interactive search for a movie, episode, or season pack
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: season
          in: query
          required: false
          schema: { type: integer }
        - name: episode
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Ranked candidates with rejection reasons attached.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReleaseCandidate"
        "404":
          description: Unknown item/season/episode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No enabled indexers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /grab:
    post:
      operationId: grabRelease
      summary: Send a release to a download client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrabRequest"
      responses:
        "201":
          description: Queued; returns the download row id.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: integer, format: int64 }
        "400":
          description: Invalid or no client for protocol.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /queue:
    get:
      operationId: listQueue
      summary: Recent downloads (all states)
      responses:
        "200":
          description: Queue.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueItem"

  /queue/{id}:
    delete:
      operationId: removeQueueItem
      summary: Remove a queue row (optionally from the client too)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: fromClient
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "204": { description: Removed. }
        "404":
          description: Unknown row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /queue/{id}/import:
    post:
      operationId: importQueueItem
      summary: Import a download now — approve a held one, or retry a failed one
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Imported. }
        "400":
          description: Import failed (reason in the body); the row stays retryable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /queue/{id}/blocklist:
    post:
      operationId: blocklistQueueItem
      summary: Declare the release bad — blocklist it and search a replacement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Blocklisted; a replacement search was kicked off. }
        "404":
          description: Unknown row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /import/scan:
    get:
      operationId: scanImportPath
      summary: List the media files Monarr can see under a path
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Files found (empty array means nothing importable there).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScannedFile" }
        "400":
          description: Path not accessible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /import/manual:
    post:
      operationId: manualImport
      summary: Import files from a path into a chosen item/copy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualImportRequest" }
      responses:
        "200":
          description: >
            Imported. Reports what happened to EVERY file, including the ones
            that did not land and why — a refusal without a reason is
            indistinguishable from a bug.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportOutcome" }
        "400":
          description: >
            Nothing imported. The message names each file and the reason it
            was declined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /customformats:
    get:
      operationId: listCustomFormats
      summary: Custom-format scoring rules
      responses:
        "200":
          description: Rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomFormat"
    post:
      operationId: addCustomFormat
      summary: Add a scoring rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomFormatInput"
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFormat"
        "400":
          description: Invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /customformats/{id}:
    delete:
      operationId: deleteCustomFormat
      summary: Remove a scoring rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }
        "404":
          description: No such record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /importlists:
    get:
      operationId: listImportLists
      summary: Import list sources
      responses:
        "200":
          description: Lists.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportList"
    post:
      operationId: addImportList
      summary: Add an import list source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportListInput"
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportList"
        "400":
          description: Invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /importlists/{id}:
    delete:
      operationId: deleteImportList
      summary: Remove an import list source
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }
        "404":
          description: No such record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/{id}/autosearch:
    post:
      operationId: autoSearchLibraryItem
      summary: Search for everything this item wants and grab the best releases
      description: >
        Sonarr-style automatic search: runs in the background, no candidate
        list — the decision engine picks. Series search per-season packs.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "202": { description: Search started in the background. }
        "404":
          description: No such item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/copies:
    post:
      operationId: addMediaCopy
      summary: Add an additional quality copy (e.g. a 720p copy of a 4K item)
      description: >
        Each copy has its own quality profile and its own automation
        lifecycle. rootFolderId picks a separate folder for the copy;
        omit it (or 0) to keep the copy in the item's folder — filenames
        carry the quality, so versions coexist. Movies and series only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaCopyInput" }
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItemDetail" }
        "400":
          description: Invalid copy (bad profile, folder collision, book).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/copies/{copyId}:
    patch:
      operationId: updateMediaCopy
      summary: Edit a copy's name, profile, or monitoring
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: copyId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaCopyUpdate" }
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItemDetail" }
        "404":
          description: No such item or copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteMediaCopy
      summary: Remove a copy (its files on disk are kept)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: copyId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItemDetail" }
        "404":
          description: No such item or copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/probe:
    post:
      operationId: reprobeLibraryItem
      summary: Re-measure this item's files
      description: >
        Re-reads every video file of the item, ignoring the already-probed
        cache. The cache is right for a routine scan, but it leaves no way back
        for a file whose probe failed for a reason outside the file — a
        permission that has since been fixed, a mount that was not up.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: integer
                    description: How many files were queued for measurement.
        "404":
          description: No such item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/files/{fileId}:
    delete:
      operationId: removeLibraryFile
      summary: Remove one file from an item, and optionally condemn its release
      description: >
        Deletes one file's library record, optionally the bytes on disk,
        optionally blocklists the release that produced it, and optionally
        searches for a replacement.


        The parts are separate because they are separate statements. Deleting
        says "I do not want this copy"; blocklisting says "and never take this
        release again". A file deleted to free space should not poison a
        release that was fine. A file that is a fake should do both.


        Blocklisting needs a source release, which only exists for files monarr
        itself grabbed. For an adopted file the deletion still happens and the
        response says why the blocklist did not.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: fileId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: fromDisk
          in: query
          schema: { type: boolean, default: false }
          description: Delete the bytes too, not just the library record.
        - name: blocklist
          in: query
          schema: { type: boolean, default: false }
          description: Never grab the release that produced this file again.
        - name: search
          in: query
          schema: { type: boolean, default: false }
          description: Hunt for a replacement once the file is gone.
      responses:
        "200":
          description: What actually happened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoveFileResult" }
        "404":
          description: No such item or file, or the two do not belong together.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/seasons/{season}:
    patch:
      operationId: setSeasonMonitored
      summary: Monitor or unmonitor one season (cascades to its episodes)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: season
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorRequest" }
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItemDetail" }
        "404":
          description: No such item or season.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/episodes/{episodeId}:
    patch:
      operationId: setEpisodeMonitored
      summary: Monitor or unmonitor one episode
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: episodeId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorRequest" }
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItemDetail" }
        "404":
          description: No such item or episode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/refresh:
    post:
      operationId: refreshLibraryItem
      summary: Re-hydrate this item's metadata from its provider
      description: >
        Updates the cached metadata (overview, poster, status, rating, …)
        and, for series, picks up newly announced seasons and episodes.
        Monitored flags, quality profile, and folder are untouched; nothing
        is deleted. The metadata.refresh task does this for the whole
        library on a schedule.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The refreshed item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItemDetail" }
        "404":
          description: No such item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/bulk:
    post:
      operationId: bulkEditLibrary
      summary: Apply monitoring/profile changes to many items at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
                monitored:
                  type: boolean
                qualityProfileId:
                  type: integer
                  format: int64
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: integer

  /auth/login:
    post:
      operationId: login
      summary: Session login for the UI (when auth is enabled)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "204": { description: Session cookie set. }
        "401":
          description: Bad credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      operationId: logout
      summary: Clear the session
      responses:
        "204": { description: Session cleared. }

  /notifiers:
    get:
      operationId: listNotifiers
      summary: List notification targets
      responses:
        "200":
          description: Notifiers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notifier"
    post:
      operationId: addNotifier
      summary: Add a notification target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifierInput"
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notifier"
        "400":
          description: Invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /notifiers/test:
    post:
      operationId: testNotifier
      summary: Send a test notification with an unsaved config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifierInput"
      responses:
        "200":
          description: Delivered.
        "400":
          description: Failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /notifiers/{id}:
    put:
      operationId: updateNotifier
      summary: Replace a notification target in place
      description: >
        Editing used to mean delete-and-recreate, which changed the id — and
        the id is what the delivery log hangs off. Changing a URL should not
        throw away the record of every delivery before it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotifierInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notifier" }
        "404":
          description: Unknown notifier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteNotifier
      summary: Remove a notification target
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }
        "404":
          description: Unknown notifier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /notifiers/{id}/test:
    post:
      operationId: testNotifierByID
      summary: Send a test notification using the SAVED config
      description: >
        The add form's test probes what is typed into its boxes. This probes
        what is stored, which is what actually runs after an import — and the
        two are only the same until somebody edits one of them. Download
        clients and indexers have had a per-row test since the beginning;
        without this, checking a saved notifier meant retyping its settings
        into the add form and trusting you retyped them identically, which
        tests the typing rather than the notifier.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Delivered.
        "400":
          description: Failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown notifier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /notifiers/{id}/deliveries:
    get:
      operationId: listDeliveries
      summary: This notifier's recent deliveries, newest first
      description: >
        Media-server notifications are queued and retried, so "did it
        arrive?" has an answer that outlives the log buffer. Successes carry
        what the far side said; failures carry why, and how many attempts it
        took to give up.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Deliveries (last 100).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Delivery" }

  /webhooks/plurx:
    post:
      operationId: plurxWebhook
      summary: Receive a watch-state notification from plurx
      description: >
        The one thing another application tells Monarr to record (master plan
        §11.1). Matched by external id only — never by title — so a
        notification for something Monarr does not have is accepted and
        ignored rather than guessed at. Nothing here can cause a deletion.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlurxWatchedEvent" }
      responses:
        "200":
          description: >
            Accepted. `matched` is false when Monarr does not have the item —
            not an error, and deliberately not a 404: the sender should not
            retry something that will never match.
          content:
            application/json:
              schema:
                type: object
                required: [matched]
                properties:
                  matched: { type: boolean }
                  mediaItemId: { type: integer, format: int64 }
        "400":
          description: Unusable payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /system/transfers:
    get:
      operationId: listTransfers
      summary: What is moving right now, and between which applications
      description: >
        The data plane, reported separately from the control plane on
        purpose. /system/connections answers "can Monarr still talk to these
        applications"; this answers "is anything actually moving". Conflating
        them is how a 20 GB import — which held the queue poll open for
        seventeen minutes — got reported as a degraded download client, while
        being visible nowhere else at all.
      responses:
        "200":
          description: Everything in flight, longest-running first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Transfer" }

  /system/connections:
    get:
      operationId: getConnections
      summary: The other applications Monarr talks to, and whether they are talking back
      description: >
        One row per remote application, assembled from the last health probe,
        the push supervisor's live state, and the queue poll's contact clock.
        This is the screen that answers "are the three apps actually talking
        right now". URLs are redacted.
      responses:
        "200":
          description: Connections.
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  checkedAt:
                    type: integer
                    format: int64
                    description: When the last probe ran (epoch ms); absent if none has.
                  connections:
                    type: array
                    items: { $ref: "#/components/schemas/Connection" }

  /system/backups:
    get:
      operationId: listBackups
      summary: On-disk database backups (newest first)
      responses:
        "200":
          description: Backups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BackupInfo"

  /calendar:
    get:
      operationId: getCalendar
      summary: Episodes airing and movies/books released in a date range
      parameters:
        - name: start
          in: query
          required: true
          schema: { type: string }
        - name: end
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Calendar entries, date-ordered.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEntry"

  /wanted:
    get:
      operationId: listWanted
      summary: Everything still wanted (missing or below cutoff)
      responses:
        "200":
          description: Wanted items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WantedItem"

  /blocklist:
    get:
      operationId: listBlocklist
      summary: Failed releases that will never be re-grabbed
      responses:
        "200":
          description: Blocklist entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlocklistEntry"

  /blocklist/{id}:
    delete:
      operationId: removeBlocklistEntry
      summary: Unblock a release
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }
        "404":
          description: No such record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events:
    get:
      operationId: streamEvents
      summary: Server-sent events
      description: >
        Streams every bus event as SSE `data:` lines. Each message is a JSON
        envelope `{type, ts, payload}` where `type` is the event type (e.g.
        `health.changed`, `task.completed`). Comment lines are sent
        periodically as heartbeats.
      responses:
        "200":
          description: An SSE stream (stays open).
          content:
            text/event-stream:
              schema:
                type: string

components:
  schemas:
    SystemStatus:
      type: object
      required:
        - appName
        - version
        - commit
        - goVersion
        - os
        - arch
        - startedAt
        - uptimeSeconds
        - dataDir
        - dbSchemaVersion
      properties:
        appName:
          type: string
          example: Monarr
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
        goVersion:
          type: string
        os:
          type: string
        arch:
          type: string
        startedAt:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
          format: int64
        dataDir:
          type: string
        dbSchemaVersion:
          type: integer
          format: int64

    HealthStatus:
      type: string
      enum: [ok, warning, error]

    HealthCheck:
      type: object
      required: [name, status, checkedAt]
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/HealthStatus"
        message:
          type: string
        checkedAt:
          type: string
          format: date-time

    HealthReport:
      type: object
      required: [overall, checks]
      properties:
        overall:
          $ref: "#/components/schemas/HealthStatus"
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"

    TaskState:
      type: object
      required: [name, intervalSeconds, running]
      properties:
        name:
          type: string
        intervalSeconds:
          type: integer
          format: int64
        running:
          type: boolean
        lastRunAt:
          type: string
          format: date-time
        lastDurationMs:
          type: integer
          format: int64
        lastError:
          type: string
        nextRunAt:
          type: string
          format: date-time

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    MediaKind:
      type: string
      enum: [movie, series, book]

    Rating:
      type: object
      required: [source, value, scale]
      properties:
        source:
          type: string
          description: tmdb | openlibrary | imdb | rt | metacritic
        value:
          type: number
          description: In the source's native scale.
        votes:
          type: integer
        scale:
          type: integer
          description: 10, 5, or 100 — render 94/100 as "94%".

    MediaItemSummary:
      type: object
      required:
        [id, kind, title, year, author, posterPath, monitored, path,
         rating, ratingVotes, ratings, episodeCount, episodeFileCount, fileCount,
         addedAt]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/MediaKind"
        title:
          type: string
        year:
          type: integer
        author:
          type: string
          description: Books only (ADR 0006); empty for movies/series.
        posterPath:
          type: string
        monitored:
          type: boolean
        path:
          type: string
        source:
          type: string
          description: >
            Which provider this record came from ("tmdb", "tvmaze",
            "openlibrary"), or "manual" when none did (ADR 0012).
        quality:
          type: string
          description: >
            The WEAKEST quality among the item's files, rendered for display
            ("1080p WEB-DL"); empty when nothing is on disk or no file's
            quality was recorded. Weakest rather than best because that is
            what decides whether the item is still being hunted.
        qualityTarget:
          type: string
          description: The profile's cutoff — the "good enough" point.
        upgrade:
          type: string
          enum: ["", missing, seeking, met, capped]
          description: >
            missing = nothing on disk · seeking = below the cutoff and being
            hunted · met = cutoff reached · capped = below the cutoff with
            upgrades switched off. Empty when it could not be determined.
        rating:
          type: number
          description: Provider-scale community rating (TMDB /10, Open Library /5).
        ratingVotes:
          type: integer
          description: 0 means no rating known.
        ratings:
          type: array
          items: { $ref: "#/components/schemas/Rating" }
          description: All known ratings, labeled by source.
        episodeCount:
          type: integer
          description: Monitored episodes aired to date (series; 0 otherwise).
        episodeFileCount:
          type: integer
          description: Of episodeCount, how many have a file.
        fileCount:
          type: integer
          description: Files on disk for the item (movies/books completeness).
        addedAt:
          type: string
          format: date-time
          description: When the item was added — drives the "recently added" sort.

    ExternalIds:
      type: object
      required: [tmdb]
      properties:
        tmdb:
          type: integer
          format: int64
        imdb:
          type: string
        tvdb:
          type: integer
          format: int64
        isbn13:
          type: string
        olid:
          type: string
          description: Open Library work id, e.g. OL17091839W.
        asin:
          type: string

    EpisodeInfo:
      type: object
      required: [id, seasonNumber, episodeNumber, title, airDate, monitored, hasFile]
      properties:
        id:
          type: integer
          format: int64
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        title:
          type: string
        airDate:
          type: string
        monitored:
          type: boolean
        hasFile:
          type: boolean

    SeasonInfo:
      type: object
      required: [number, monitored, episodes]
      properties:
        number:
          type: integer
        monitored:
          type: boolean
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/EpisodeInfo"

    MediaFileInfo:
      type: object
      required: [id, path, size, episodeIds]
      properties:
        id:
          type: integer
          format: int64
        copyId:
          type: integer
          format: int64
          description: Which quality copy this file belongs to; 0/absent = primary.
        path:
          type: string
        size:
          type: integer
          format: int64
        episodeIds:
          type: array
          items:
            type: integer
            format: int64
        quality:
          type: string
          description: >
            The file's recorded quality, e.g. "WEB-DL 1080p". Empty when the
            file exists but nothing could be determined about it -- which is
            not the same as the file being absent (ADR 0013).
        provenance:
          type: string
          enum: ["", probe, filename, release, manual, failed, implausible]
          description: Where `quality` came from.
        provenanceLabel:
          type: string
          description: The badge text for `provenance` ("measured", "from filename", ...).
        verified:
          type: boolean
          description: >
            Whether the SOURCE half of `quality` is trustworthy enough to
            justify replacing this file (the don't-churn rule, ADR 0013).
        facts:
          type: string
          description: >
            The measured facts as one line, e.g. "1080p · HEVC · HDR10 ·
            TrueHD · 23 Mbps". Empty when the file was never probed.
        implausible:
          type: string
          description: >
            Why this file's own measurements cannot be true, in one sentence
            ready to show. Empty for every file that adds up. When set, the
            file is not counted toward the item being satisfied, so the search
            for a real copy continues.
        sourceRelease:
          type: string
          description: >
            The release that put this file here, when monarr grabbed it.
            Empty for an adopted file -- which is also why there is nothing to
            blocklist for one.

    MediaItemDetail:
      type: object
      required:
        - id
        - kind
        - title
        - year
        - posterPath
        - backdropPath
        - overview
        - author
        - genres
        - status
        - releaseDate
        - runtime
        - rating
        - ratingVotes
        - ratings
        - monitored
        - qualityProfileId
        - copies
        - path
        - rootFolderId
        - ended
        - ids
        - seasons
        - files
        - addedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/MediaKind"
        title:
          type: string
        year:
          type: integer
        author:
          type: string
          description: Books only (ADR 0006); empty for movies/series.
        posterPath:
          type: string
        backdropPath:
          type: string
        source:
          type: string
          description: >
            Which provider this record came from, or "manual" when none did
            (ADR 0012). A manual entry has no metadata to refresh against.
        quality:
          type: string
          description: >
            The weakest quality among the primary copy's files ("1080p
            WEB-DL"); empty when nothing is on disk or no quality was
            recorded. Weakest because that is what decides whether the item
            is still being hunted.
        qualityTarget:
          type: string
          description: The profile's cutoff — the "good enough" point.
        upgrade:
          type: string
          enum: ["", missing, seeking, met, capped]
          description: >
            missing = nothing on disk · seeking = below the cutoff and being
            hunted · met = cutoff reached · capped = below the cutoff with
            upgrades switched off.
        overview:
          type: string
        genres:
          type: array
          items:
            type: string
        status:
          type: string
        releaseDate:
          type: string
        runtime:
          type: integer
        rating:
          type: number
          description: Provider-scale community rating (TMDB /10, Open Library /5).
        ratingVotes:
          type: integer
          description: 0 means no rating known.
        ratings:
          type: array
          items: { $ref: "#/components/schemas/Rating" }
          description: All known ratings, labeled by source.
        monitored:
          type: boolean
        qualityProfileId:
          type: integer
          format: int64
        copies:
          type: array
          items: { $ref: "#/components/schemas/MediaCopy" }
          description: Additional quality copies of this item.
        path:
          type: string
        rootFolderId:
          type: integer
          format: int64
        ended:
          type: boolean
        ids:
          $ref: "#/components/schemas/ExternalIds"
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/SeasonInfo"
        files:
          type: array
          items:
            $ref: "#/components/schemas/MediaFileInfo"
        addedAt:
          type: string
          format: date-time

    AddMediaRequest:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/MediaKind"
        tmdbId:
          type: integer
          format: int64
          description: Identifies movies/series.
        tvdbId:
          type: integer
          format: int64
          description: >
            Identifies a series that came from the provider chain rather than
            TMDB (ADR 0011). Exactly one of tmdbId / tvdbId / olid identifies
            the item.
        olid:
          type: string
          description: Open Library work id — identifies books (ADR 0006).
        rootFolderId:
          type: integer
          format: int64
        qualityProfileId:
          type: integer
          format: int64
          description: 0/absent = kind default (Any; Ebook for books).
        monitored:
          type: boolean
          default: true
        monitor:
          type: string
          enum: [all, latest, none]
          default: all
          description: >
            Series only — which seasons start monitored: every season,
            only the latest, or none (add a 20-season show and hunt just
            the newest). Specials always start unmonitored.
        searchNow:
          type: boolean
          default: false
          description: >
            Kick an automatic search for the item right after adding
            (Sonarr's "start search for missing" checkbox).

    MediaCopyInput:
      type: object
      required: [qualityProfileId]
      properties:
        qualityProfileId:
          type: integer
          format: int64
        rootFolderId:
          type: integer
          format: int64
          description: Separate folder for the copy; 0/absent = share the item's folder.
        name:
          type: string
          description: Display label, e.g. "720p for dad".
        monitored:
          type: boolean
          default: true

    MediaCopyUpdate:
      type: object
      properties:
        name: { type: string }
        qualityProfileId: { type: integer, format: int64 }
        monitored: { type: boolean }

    MediaCopy:
      type: object
      required: [id, name, qualityProfileId, rootFolderId, path, monitored]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        qualityProfileId: { type: integer, format: int64 }
        rootFolderId: { type: integer, format: int64 }
        path:
          type: string
          description: The copy's folder; "" = shares the item's folder.
        monitored: { type: boolean }

    MonitorRequest:
      type: object
      required: [monitored]
      properties:
        monitored:
          type: boolean

    UpdateMediaItemRequest:
      type: object
      description: Per-item edit; absent fields are left as they are.
      properties:
        monitored:
          type: boolean
        qualityProfileId:
          type: integer
          format: int64
        rootFolderId:
          type: integer
          format: int64
          description: Recomputes the item folder; 0 clears the assignment.
        path:
          type: string
          description: Explicit absolute folder; wins over rootFolderId. "" clears it.

    SearchResult:
      type: object
      required: [kind, tmdbId, title, year, overview, posterPath, inLibrary]
      properties:
        kind:
          $ref: "#/components/schemas/MediaKind"
        tmdbId:
          type: integer
          format: int64
        tvdbId:
          type: integer
          format: int64
          description: >
            Set for a series the provider chain supplied (ADR 0011); such a
            result has no tmdbId.
        source:
          type: string
          description: Which provider produced it ("tmdb", "tvmaze").
        olid:
          type: string
          description: Present for book results (ADR 0006).
        author:
          type: string
        title:
          type: string
        year:
          type: integer
        overview:
          type: string
        posterPath:
          type: string
        inLibrary:
          type: boolean

    DiscoverList:
      type: object
      description: >
        One browse row on offer. Metadata about the row, not its contents —
        the contents come from /discover/items, which is where the cost is.
      required: [id, title, blurb, kind, source]
      properties:
        id:
          type: string
          description: Stable slug, unique across providers ("tmdb-trending-movies").
        title:
          type: string
          description: The row heading, e.g. "Trending this week".
        blurb:
          type: string
          description: >
            One line saying what the row actually measures. "Trending" means
            something different at each provider - TMDB counts lookups, Trakt
            counts playback - so a row without this is a ranking nobody can
            interpret.
        kind:
          $ref: "#/components/schemas/MediaKind"
        source:
          type: string
          description: Which provider publishes it ("tmdb", "trakt").

    RootKind:
      type: string
      description: >
        What a root folder holds (ADR 0009). "mixed" means the kind is not
        known, so adoption asks instead of assuming — the behaviour every
        root had before kinds existed.
      enum: [movie, series, book, mixed]

    RootFolder:
      type: object
      required: [id, path, kind, freeBytes, accessible]
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
        kind:
          $ref: "#/components/schemas/RootKind"
        autoAdopt:
          type: boolean
          description: >
            Adoption applies matches into this root without asking. Off
            until the first pass has been reviewed and confirmed.
        freeBytes:
          type: integer
          format: int64
        accessible:
          type: boolean

    UnmatchedDir:
      type: object
      required: [rootFolderId, path, name]
      properties:
        rootFolderId:
          type: integer
          format: int64
        path:
          type: string
        name:
          type: string

    ScanReport:
      type: object
      required:
        - scannedAt
        - rootsScanned
        - itemsScanned
        - filesLinked
        - filesRemoved
        - unmatchedDirs
        - missingPaths
      properties:
        scannedAt:
          type: string
          format: date-time
        rootsScanned:
          type: integer
        itemsScanned:
          type: integer
        filesLinked:
          type: integer
        filesRemoved:
          type: integer
        skippedDirs:
          type: integer
          description: Directories excluded by a skip pattern (counted, not listed).
        ignoredDirs:
          type: integer
          description: Directories the user has dismissed (counted, not listed).
        unmatchedTotal:
          type: integer
          description: >
            True number of unmatched folders. unmatchedDirs may be a capped
            prefix of these; the full list is at /library/review.
        unmatchedDirs:
          type: array
          items:
            $ref: "#/components/schemas/UnmatchedDir"
        missingPaths:
          type: array
          items:
            type: string
        missingItems:
          type: array
          description: >
            The same set as missingPaths, with the identity needed to act on
            them — a list of paths is only ever something to read.
          items:
            $ref: "#/components/schemas/MissingItem"

    DirEntry:
      type: object
      required: [name, path, registered]
      properties:
        name:
          type: string
        path:
          type: string
        registered:
          type: boolean
          description: Already a registered root folder.

    BrowseResult:
      type: object
      required: [path, parent, dirs]
      properties:
        path:
          type: string
        parent:
          type: string
          description: Empty at the filesystem root.
        dirs:
          type: array
          items:
            $ref: "#/components/schemas/DirEntry"

    AdoptionCandidate:
      type: object
      required: [kind, tmdbId, title, year]
      properties:
        kind:
          $ref: "#/components/schemas/MediaKind"
        tmdbId:
          type: integer
          format: int64
        tvdbId:
          type: integer
          format: int64
          description: >
            Set for a series identified through the provider chain (ADR 0011)
            rather than by TMDB. Exactly one of tmdbId / tvdbId / olid
            identifies a candidate.
        source:
          type: string
          description: >
            Which provider produced this candidate ("tmdb", "tvmaze"). For
            display only — identity is the ids.
        olid:
          type: string
        author:
          type: string
        title:
          type: string
        altTitles:
          type: array
          description: >
            Other names this work is released under that the folder's name
            actually matches — usually absent. Present so a row can say why
            "Cunk on Life" is offered for a folder called "Cunk's Quest for
            Meaning": they are the same film.
          items:
            type: string
        year:
          type: integer
        overview:
          type: string
        posterPath:
          type: string

    # heldBy / sharedWith describe the umbrella case: a provider that files a
    # whole franchise under one title lists every part of it among that title's
    # alternate names, so several folders answer to one entry and only the first
    # can have it.
    Proposal:
      type: object
      required: [rootFolderId, path, name, parsedTitle, parsedYear, confidence, candidates]
      properties:
        rootFolderId:
          type: integer
          format: int64
        path:
          type: string
        name:
          type: string
        parsedTitle:
          type: string
        parsedYear:
          type: integer
        kind:
          $ref: "#/components/schemas/MediaKind"
        confidence:
          type: string
          enum: [exact, ambiguous, none]
          description: >
            exact clears the per-kind bar and may be adopted without asking;
            anything else goes to review. There is deliberately no
            "probably".
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/AdoptionCandidate"
        heldBy:
          type: string
          description: >
            The folder that already holds the leading candidate, when that
            candidate answers to this folder only through an alternate title.
            Present so the row can say so before the user clicks a chip that
            looks right and reads a conflict error afterwards.
        sharedWith:
          type: array
          description: >
            Other folders in this review batch whose leading candidate is the
            same entry by the same alternate-title route.
          items:
            type: string

    ReviewCounts:
      type: object
      required: [total, ambiguous, none, movie, series, book, unknown]
      properties:
        total:
          type: integer
        ambiguous:
          type: integer
        none:
          type: integer
        movie:
          type: integer
        series:
          type: integer
        book:
          type: integer
        unknown:
          type: integer
          description: Entries from mixed roots, where no kind was resolved.

    ReviewPage:
      type: object
      required: [items, total, offset, limit, counts]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Proposal"
        total:
          type: integer
          description: Entries matching the filter.
        offset:
          type: integer
        limit:
          type: integer
        counts:
          $ref: "#/components/schemas/ReviewCounts"

    AdoptResult:
      type: object
      required: [adopted, review, failures]
      properties:
        adopted:
          type: array
          items:
            $ref: "#/components/schemas/Proposal"
        review:
          type: array
          items:
            $ref: "#/components/schemas/Proposal"
        failures:
          type: array
          items:
            type: string

    MissingItem:
      type: object
      required: [id, kind, title, path]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/MediaKind"
        title:
          type: string
        path:
          type: string

    IgnoredPath:
      type: object
      required: [path, reason, ignoredAt]
      properties:
        path:
          type: string
        reason:
          type: string
        ignoredAt:
          type: string
          format: date-time

    Quality:
      type: object
      required: [source, resolution, display]
      properties:
        source:
          type: string
          description: webdl | bluray | remux | hdtv | ... or a book format (epub, m4b, ...).
        resolution:
          type: integer
          description: 480 | 720 | 1080 | 2160; 0 for books and unknown.
        display:
          type: string
          description: Human rendering, e.g. "WEB-DL 1080p".

    QualityProfile:
      type: object
      required: [id, name, target, upgradesAllowed, sentence]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        target:
          $ref: "#/components/schemas/Quality"
        floor:
          $ref: "#/components/schemas/Quality"
        upgradesAllowed: { type: boolean }
        sentence:
          type: string
          description: >
            The profile rendered as the one true sentence it now is -- "hunts
            the best release up to WEB-DL 1080p, then stops". Server-rendered
            so every client says exactly the same thing about a profile.
        inUse:
          type: integer
          description: >
            How many items, copies and import lists reference this profile.
            Non-zero means DELETE will be refused with 409.

    QualityInput:
      type: object
      required: [source]
      properties:
        source: { type: string }
        resolution: { type: integer, default: 0 }

    ProfileInput:
      type: object
      required: [name, target]
      properties:
        name: { type: string }
        target:
          $ref: "#/components/schemas/QualityInput"
        floor:
          $ref: "#/components/schemas/QualityInput"
        upgradesAllowed: { type: boolean, default: true }

    IndexerInput:
      type: object
      required: [name, url, protocol]
      properties:
        name: { type: string }
        url: { type: string }
        apiKey: { type: string }
        protocol: { type: string, enum: [torrent, usenet] }
        categories:
          type: array
          items: { type: integer }
        enabled: { type: boolean, default: true }

    Indexer:
      allOf:
        - $ref: "#/components/schemas/IndexerInput"
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }

    PathMapping:
      type: object
      required: [remote, local]
      properties:
        remote:
          type: string
          description: Path prefix as the download client reports it.
        local:
          type: string
          description: Same location as Monarr sees it.

    DownloadClientInput:
      type: object
      required: [type, name, url]
      properties:
        type: { type: string, enum: [qbittorrent, sabnzbd, transmission, deluge, nzbget, nzbd] }
        name: { type: string }
        url: { type: string }
        username: { type: string }
        password: { type: string }
        category: { type: string, default: monarr }
        enabled: { type: boolean, default: true }
        manualApproval:
          type: boolean
          default: false
          description: >
            Hold a completed download at 'awaiting_import' until you approve
            it, instead of importing automatically.
        removeCompleted:
          type: boolean
          description: >
            Delete the payload from this client once Monarr has imported it.


            Off means every grab leaves a second full copy behind, and when the
            client's disk and the library are different filesystems -- the
            normal arrangement -- that copy is real bytes rather than a
            hardlink. Deleting is safe either way: a hardlinked import keeps
            the library's copy, because removing one name for an inode does not
            touch the other.


            Defaults on for usenet clients, which have no obligation once the
            download is done, and off for torrent clients, which are still
            seeding and which Monarr cannot yet tell "finished seeding" from
            "seeding happily".
        mode:
          type: string
          enum: [poll, push]
          default: poll
          description: >
            How Monarr learns this client's state. 'poll' asks every 30
            seconds. 'push' additionally holds the client's event stream
            open, so a finished download is acted on when it finishes
            rather than up to a poll interval later — currently only the
            native nzbd client can stream. Push never replaces the poll,
            so a stream that dies quietly costs latency, not correctness.
        pathMappings:
          type: array
          items: { $ref: "#/components/schemas/PathMapping" }
          description: >
            Remote path mappings: when the client runs on another host or
            container, rewrite the completed-download path it reports into
            the path Monarr sees the same files at.

    DownloadClientConfig:
      allOf:
        - $ref: "#/components/schemas/DownloadClientInput"
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }

    Rejection:
      type: object
      required: [code, reason]
      properties:
        code: { type: string }
        reason: { type: string }

    ReleaseCandidate:
      type: object
      required: [title, downloadUrl, indexer, protocol, size, seeders, age, quality, score, accepted, isUpgrade, rejections]
      properties:
        title: { type: string }
        downloadUrl: { type: string }
        infoUrl: { type: string }
        indexer: { type: string }
        protocol: { type: string }
        size: { type: integer, format: int64 }
        seeders: { type: integer }
        age: { type: string }
        quality: { type: string }
        score:
          type: integer
          description: Custom-format score sum (Phase 5).
        formats:
          type: array
          items: { type: string }
          description: Names of matched custom formats.
        accepted: { type: boolean }
        isUpgrade: { type: boolean }
        rejections:
          type: array
          items: { $ref: "#/components/schemas/Rejection" }
        warning:
          type: string
          description: >
            A caution that does not decline the release: the profile would take
            it, but something does not add up. Today that means an advertised
            size too small to hold what the name claims.

    RemoveFileResult:
      type: object
      required: [path, deletedFromDisk, searched]
      properties:
        path: { type: string }
        deletedFromDisk: { type: boolean }
        blocklisted:
          type: string
          description: The release title that was blocklisted; empty if none was.
        searched: { type: boolean }
        note:
          type: string
          description: >
            The one thing that did not work out, in plain terms -- most often
            that monarr did not grab this file so there was nothing to
            blocklist. Not an error: the deletion still happened.

    GrabRequest:
      type: object
      required: [mediaItemId, title, downloadUrl, protocol]
      properties:
        mediaItemId: { type: integer, format: int64 }
        season: { type: integer }
        episode: { type: integer }
        title: { type: string }
        downloadUrl: { type: string }
        indexer: { type: string }
        protocol: { type: string }
        size: { type: integer, format: int64 }

    ScannedFile:
      type: object
      required: [path, name, size, kind, quality, season, episodes]
      properties:
        path: { type: string }
        name: { type: string }
        size: { type: integer, format: int64 }
        kind: { type: string, description: "video | book" }
        quality: { type: string }
        season: { type: integer, description: "-1 when not a series file" }
        episodes:
          type: array
          items: { type: integer }

    ImportOutcome:
      type: object
      required: [files, imported, upgrade]
      properties:
        imported:
          type: integer
          description: How many files landed in the library.
        upgrade:
          type: boolean
          description: Whether any of them replaced something already there.
        files:
          type: array
          description: Every file considered, in payload order.
          items:
            $ref: "#/components/schemas/ImportedFile"

    ImportedFile:
      type: object
      required: [name, imported]
      properties:
        name: { type: string }
        imported: { type: boolean }
        upgrade:
          type: boolean
          description: This file replaced one already in the library.
        quality:
          type: string
          description: The quality monarr judged the file by, e.g. "WEB-DL 1080p".
        reason:
          type: string
          description: Why it was not imported. Empty when it was.

    ManualImportRequest:
      type: object
      required: [path, mediaItemId]
      properties:
        path: { type: string }
        mediaItemId: { type: integer, format: int64 }
        copyId:
          type: integer
          format: int64
          description: Target copy; 0 = the primary copy.
        downloadId:
          type: integer
          format: int64
          description: >
            Tie the import to a stuck queue row so it's marked imported (or
            failed) by this attempt. 0 = a standalone import.

    CustomFormatInput:
      type: object
      required: [name, pattern]
      properties:
        name: { type: string }
        pattern:
          type: string
          description: Case-insensitive RE2 matched against release titles.
        score:
          type: integer
          default: 0

    CustomFormat:
      allOf:
        - $ref: "#/components/schemas/CustomFormatInput"
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }

    ImportListInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [tmdb-popular, tmdb-top, trakt-list]
        config:
          type: object
          additionalProperties: { type: string }
          description: "trakt-list: {user, slug, clientId}."
        kind:
          $ref: "#/components/schemas/MediaKind"
        rootFolderId: { type: integer, format: int64 }
        qualityProfileId: { type: integer, format: int64 }
        monitored: { type: boolean, default: true }
        enabled: { type: boolean, default: true }

    ImportList:
      allOf:
        - $ref: "#/components/schemas/ImportListInput"
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }

    NotifierInput:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          enum: [webhook, discord, plex, jellyfin, plurx]
        name:
          type: string
        settings:
          type: object
          additionalProperties:
            type: string
          description: "Type-specific: webhook/discord {url}; plex {url, token}; jellyfin and plurx {url, apiKey} — for plurx a scoped plx_ key with scan:trigger, never an admin token."
        onGrab:
          type: boolean
          default: true
        onImport:
          type: boolean
          default: true
        onFailed:
          type: boolean
          default: true
        onHealth:
          type: boolean
          default: false
        enabled:
          type: boolean
          default: true

    Notifier:
      allOf:
        - $ref: "#/components/schemas/NotifierInput"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64

    PlurxWatchedEvent:
      type: object
      required: [event, kind, watched_at]
      properties:
        event:
          type: string
          description: "\"watched\" today; the field exists so the route can grow others."
        kind:
          type: string
          enum: [movie, episode]
        tmdb:
          type: integer
          format: int64
          description: For an episode this is the SHOW's id, not the episode's.
        imdb: { type: string }
        season: { type: integer }
        episode: { type: integer }
        watched_at:
          type: integer
          format: int64
          description: Unix seconds.
        user:
          type: string
          description: >
            The plurx username. Per the §11.1 decision the signal is per-user;
            this is plurx's user, not a Monarr account, and Monarr does not
            create one.

    Transfer:
      type: object
      required: [downloadId, title, stage, startedAt, outbound]
      properties:
        downloadId:
          type: integer
          format: int64
          description: Monarr's download row, so a reader can reach the handoff trace.
        transfer:
          type: string
          description: >
            The id that spans all three applications (contract §3.1) — the one
            to grep with.
        title: { type: string }
        stage:
          type: string
          enum: [downloading, importing, notifying]
          description: >
            Which seam this is at. `downloading` is nzbd's work that Monarr is
            watching; `importing` is Monarr moving bytes itself; `notifying`
            is telling plurx, including the waits between retries.
        peer:
          type: string
          description: >
            The application on the other side. Absent for `importing` —
            Monarr is moving its own files, and naming a peer would invent a
            seam that does not exist.
        outbound:
          type: boolean
        startedAt: { type: string, format: date-time }
        bytes:
          type: integer
          format: int64
          description: >
            Bytes moved. Absent when the stage cannot measure itself — which a
            UI must render differently from 0%, hence the omission rather than
            a zero.
        total: { type: integer, format: int64 }
        bytesPerSecond:
          type: number
          format: double
          description: >
            Averaged over the life of the transfer, not instantaneous: an
            instantaneous rate on a network mount is mostly noise, and the
            question being asked is "will this finish tonight".
        detail: { type: string }

    Connection:
      type: object
      required: [name, kind, type, state]
      properties:
        name: { type: string }
        kind:
          type: string
          enum: [downloadclient, mediaserver, inbound]
          description: >
            downloadclient / mediaserver are things Monarr connects TO.
            inbound is another application that connects to Monarr — plurx
            pushing watch state, or a compat consumer.
        type: { type: string }
        url:
          type: string
          description: Redacted — any password is replaced before it leaves the server.
        state:
          type: string
          enum: [live, polling, degraded, unreachable, unprobed, calling, quiet]
          description: >
            live = a push stream is open; polling = answering, on the 30s poll;
            degraded = answering but not working properly; unreachable = not
            answering; unprobed = configured, but has no side-effect-free
            test. For inbound rows: calling = heard from recently; quiet =
            has called at some point since startup, but not lately.
        version: { type: string }
        lastContact:
          type: integer
          format: int64
          description: Last time something actually came through it (epoch ms).
        lastEventSeq:
          type: integer
          format: int64
          description: The last event id seen on a push stream.
        detail: { type: string }

    Delivery:
      type: object
      required: [id, notifierId, event, attempts, status, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        notifierId: { type: integer, format: int64 }
        downloadId: { type: integer, format: int64 }
        event: { type: string }
        attempts: { type: integer, format: int64 }
        lastError: { type: string }
        result:
          type: string
          description: What the far side answered on success, e.g. "scanned → plurx item 1201".
        status:
          type: string
          enum: [pending, ok, failed]
        nextAt:
          type: integer
          format: int64
          description: When a pending retry becomes due (epoch ms).
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }

    BackupInfo:
      type: object
      required: [name, sizeBytes, createdAt]
      properties:
        name:
          type: string
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    CalendarEntry:
      type: object
      required: [date, kind, mediaItemId, title, detail, hasFile]
      properties:
        date:
          type: string
        kind:
          type: string
          description: episode | movie | book
        mediaItemId:
          type: integer
          format: int64
        title:
          type: string
        detail:
          type: string
        hasFile:
          type: boolean
        tmdbId:
          type: integer
          format: int64
          description: >
            The item's TMDB id, so a consumer can resolve this entry against
            its own library by id rather than by title. For an episode this is
            the SHOW's id — an episode's own identity does not name the series
            it belongs to. Absent when unknown.
        imdbId:
          type: string
          description: The item's IMDb id (the show's, for an episode).

    WantedItem:
      type: object
      required: [wantableId, mediaItemId, title, detail, missing, current, copy]
      properties:
        wantableId:
          type: string
        mediaItemId:
          type: integer
          format: int64
        title:
          type: string
        detail:
          type: string
        missing:
          type: boolean
          description: false = on disk but below the profile cutoff.
        current:
          type: string
        copy:
          type: string
          description: Label of the quality copy this entry hunts for; "" = the primary.

    BlocklistEntry:
      type: object
      required: [id, mediaItemId, releaseTitle, indexer, reason, createdAt]
      properties:
        id:
          type: integer
          format: int64
        mediaItemId:
          type: integer
          format: int64
        releaseTitle:
          type: string
        indexer:
          type: string
        reason:
          type: string
        createdAt:
          type: string
          format: date-time

    QueueItem:
      type: object
      required: [id, mediaItemId, title, state, progress, protocol, quality, addedAt]
      properties:
        id: { type: integer, format: int64 }
        mediaItemId: { type: integer, format: int64 }
        copyId:
          type: integer
          format: int64
          description: The media copy this grab targets; 0 = the primary copy.
        title: { type: string }
        state:
          type: string
          description: >
            grabbed | downloading | downloaded | awaiting_import | importing
            | imported | failed.
        progress: { type: number }
        protocol: { type: string }
        quality: { type: string }
        clientId: { type: integer, format: int64 }
        error: { type: string }
        savePath:
          type: string
          description: The completed-download path the client reported.
        importPath:
          type: string
          description: Where Monarr looked for the files after remote path mapping.
        stage:
          type: string
          description: >
            What is happening to this job RIGHT NOW, finer-grained than
            `state` and present only while something is moving: downloading |
            par_rename | par_verify | par_repair | rar_rename | unpack |
            cleanup | move | post_unpack_rename | script | importing |
            notifying. The post-processing names are the download client's
            own spellings. Absent means nothing is in flight for this row.
        stageSince: { type: string, format: date-time }
        stagePeer:
          type: string
          description: >
            Which application is doing the current stage — the download client's
            name while it fetches and post-processes, empty while Monarr copies
            into the library, the media server's name while it is being told.

        stageDetail:
          type: string
          description: One line describing the current stage, in the client's words.
        bytes:
          type: integer
          format: int64
          description: Bytes moved at the current stage. Absent when the stage cannot measure itself.
        total:
          type: integer
          format: int64
          description: Bytes expected at the current stage. Absent when unknown — which is NOT the same as zero.
        bytesPerSecond:
          type: number
          description: Average rate over the life of the current stage.
        handoff:
          type: array
          description: The download → import handoff, step by step.
          items: { $ref: "#/components/schemas/HandoffEntry" }
        addedAt: { type: string, format: date-time }

    HandoffEntry:
      type: object
      required: [step, at]
      properties:
        step:
          type: string
          description: >
            grabbed | downloading | downloaded | awaiting_import | importing
            | imported | failed.
        at: { type: integer, format: int64, description: Unix milliseconds. }
        detail: { type: string }

    Settings:
      type: object
      required: [tmdbApiKeyConfigured, tmdbApiKeyHint]
      properties:
        tmdbApiKeyConfigured:
          type: boolean
        tmdbApiKeyHint:
          type: string
        omdbApiKeyConfigured:
          type: boolean
          description: OMDb key present — enables Rotten Tomatoes / IMDb / Metacritic ratings.
        omdbApiKeyHint:
          type: string
        traktClientIdConfigured:
          type: boolean
          description: >
            Trakt client id present - adds the Trakt rows to Discover
            (ADR 0015). Optional: without it TMDB still serves nine rows.
        traktClientIdHint:
          type: string
        apiKey:
          type: string
          description: >
            Monarr's own API key — what consumers send as X-Api-Key to the
            /sonarr and /radarr personalities (and, once auth hardening is
            on, to /api/v1).
        authRequired:
          type: boolean
          description: Whether /api/v1 requires authentication.
        scanSkipPatterns:
          type: string
          description: >
            User skip patterns, one per line, applied on top of the built-in
            defaults during the root-folder sweep. Blank lines and # comments
            are ignored.
        defaultProfiles:
          $ref: '#/components/schemas/DefaultProfiles'

    DefaultProfiles:
      type: object
      description: >
        The quality profile a newly added item gets when the add form does not
        name one, per media kind. Always fully populated on read: an unset or
        dangling setting resolves to the built-in, so this is the effective
        answer rather than only what has been saved.
      required: [movie, series, book]
      properties:
        movie:  { type: integer, format: int64 }
        series: { type: integer, format: int64 }
        book:
          type: integer
          format: int64
          description: >
            Must target a book format. Format families never compete
            (ADR 0014 §7), so a video profile here would leave every book
            wanted forever with nothing able to satisfy it.

    SettingsUpdate:
      type: object
      properties:
        tmdbApiKey:
          type: string
        omdbApiKey:
          type: string
          description: Optional — adds Rotten Tomatoes / IMDb / Metacritic ratings. "" clears it.
        traktClientId:
          type: string
          description: >
            Optional — a free Trakt app client id, which adds five rows to
            Discover (ADR 0015). "" clears it. Import lists keep their own
            per-list id and are unaffected either way.
        scanSkipPatterns:
          type: string
          description: Directory-name patterns to never offer as adoption candidates, one per line.
        authRequired:
          type: boolean
          description: Require API key or session for /api/v1 (Phase 5).
        authUsername:
          type: string
        authPassword:
          type: string
          description: Stored salted-hashed; never returned.
        defaultProfiles:
          $ref: '#/components/schemas/DefaultProfilesUpdate'

    DefaultProfilesUpdate:
      type: object
      description: >
        Partial: only the kinds present are changed. A profile that does not
        exist, or that lives on the wrong format axis for the kind, is refused
        with 400 rather than saved and discovered later.
      properties:
        movie:  { type: integer, format: int64 }
        series: { type: integer, format: int64 }
        book:   { type: integer, format: int64 }
