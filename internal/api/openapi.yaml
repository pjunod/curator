openapi: 3.0.3
info:
  title: Monarr API
  version: "1"
  description: >
    Native Monarr API (spec-first; blueprint §7). Served under /api/v1.
    This is the only API the web UI uses. Phase 0 surface: system status,
    health, scheduler tasks, and the SSE event stream.
  license:
    name: GPL-3.0

paths:
  /downloads/deliveries:
    get:
      operationId: listDeliveryLifecycle
      summary: Paginated durable Runner handoff and cleanup receipts
      parameters:
        - name: beforeId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: downloadId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: One bounded page; nextBeforeId pages older receipts without truncation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryLifecyclePage" }

  /downloads/deliveries/{receiptId}:
    get:
      operationId: getDeliveryLifecycleReceipt
      summary: Read one durable Runner handoff and cleanup receipt
      parameters:
        - { name: receiptId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Durable lifecycle detail, even after Activity is dismissed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryLifecycleReceipt" }
        "404": { description: Delivery receipt not found. }

  /downloads/deliveries/{receiptId}/import:
    post:
      operationId: resolveDeliveryImport
      summary: Import an explicitly selected subset of an accepted Runner manifest
      parameters:
        - { name: receiptId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveDeliveryImportRequest" }
      responses:
        "202": { description: Manifest-bound import queued. }
        "409": { description: Delivery association changed or work is already active. }

  /downloads/deliveries/{receiptId}/retry-handoff:
    post:
      operationId: retryDeliveryHandoff
      summary: Retry acceptance or import for one durable delivery
      parameters:
        - { name: receiptId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "202": { description: Handoff retry queued. }
        "409": { description: Delivery cannot be retried in its current state. }

  /downloads/deliveries/{receiptId}/retry-runner-cleanup:
    post:
      operationId: retryRunnerDeliveryCleanup
      summary: Retry Runner-owned processing-source cleanup
      parameters:
        - { name: receiptId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "202": { description: Runner cleanup retry requested. }
        "409": { description: Runner does not permit a cleanup retry. }

  /downloads/deliveries/{receiptId}/retry-curator-cleanup:
    post:
      operationId: retryCuratorDeliveryCleanup
      summary: Retry Curator-owned accepted-publication cleanup
      parameters:
        - { name: receiptId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "202": { description: Curator cleanup retry queued. }
        "409": { description: Cleanup is not eligible to retry. }

  /downloads/publications/{publicationId}/cleanup:
    post:
      operationId: setPublicationCleanup
      summary: Pause or resume a publication's automatic per-file cleanup
      description: >
        pause cancels a queued or running pass (each unlink is one step, so
        nothing is left half-done) and keeps the hourly sweep and the
        post-import pass off it; resume clears the pause and queues a pass.
        An operator's explicit discard still runs while paused.
      parameters:
        - { name: publicationId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [pause, resume] }
      responses:
        "204": { description: Paused, or resumed and queued. }
        "400": { description: Unknown action. }
        "404": { description: No such publication, or it is already removed. }

  /downloads/publications/approve-cleanup:
    post:
      operationId: approvePublicationCleanup
      summary: Approve a review batch of historical publications for per-file cleanup
      description: >
        The M7 approval (pipeline contract v2, section 3.4). Sets
        cleanupApprovedAt on each named historical publication; the per-file
        rule then deletes only evidenced files (placed with a matching digest,
        or discarded) and keeps everything else. Live publications need no
        approval and are left unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: integer, format: int64 }
      responses:
        "200":
          description: How many publications this call approved.
          content:
            application/json:
              schema:
                type: object
                required: [approved]
                properties:
                  approved: { type: integer, format: int64 }
        "400": { description: No ids. }

  /downloads/inventory/storage-change/preview:
    post:
      operationId: previewCompletedStorageChange
      summary: Review expected and observed storage and the exact affected custody
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StorageChangeRequest' }
      responses:
        "200":
          description: Exact root comparison and affected historical custody counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageChangeReview' }
        "409": { description: Storage comparison is stale or unavailable. }
  /downloads/inventory/storage-change/accept:
    post:
      operationId: acceptCompletedStorageChange
      summary: Accept intentionally changed storage while fencing existing custody for review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StorageChangeRequest' }
      responses:
        "204": { description: New storage accepted and old custody fenced atomically; inventory scan requested. }
        "409": { description: Review or observed storage changed, or imports are active. }

  /downloads/inventory/entry:
    delete:
      operationId: deleteCompletedEntry
      summary: Explicitly delete an unchanged entry from Curator-owned download storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, fingerprint]
              properties:
                path: { type: string }
                fingerprint: { type: string }
                reviewLegacy: { type: boolean, description: Explicitly approve deletion of only the selected current files from an entry held for storage-change review. }
                files:
                  type: array
                  description: >
                    Exact inventory files selected for deletion. For a publication-managed
                    directory each must be an unresolved file of the publication; it is
                    discarded and leaves through the per-file cleanup (digest-checked,
                    storage-checked). For an entry held for storage-change review, the
                    selected current files are deleted. No directory is removed recursively.
                  items:
                    type: object
                    required: [path, snapshotIdentity]
                    properties:
                      path: { type: string }
                      snapshotIdentity: { type: string }
      responses:
        "204":
          description: Files removed and accounting updated.
        "409":
          description: Files changed, live work overlaps, or storage is not owned by Curator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /downloads/inventory:
    get:
      operationId: getCompletedInventory
      summary: Cached disk accounting for completed download folders
      responses:
        "200":
          description: Latest inventory; errors preserve the last complete scan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletedInventory'

  /system/deployment-drain:
    get:
      operationId: getDeploymentDrain
      summary: Inspect maintenance admission and active work
      responses:
        "200":
          description: Current process drain status; contains no owner secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentDrainStatus" }
    post:
      operationId: beginDeploymentDrain
      summary: Pause new work and drain already admitted operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerToken]
              properties:
                ownerToken: { type: string, pattern: "^[a-fA-F0-9]{64}$", description: Caller-generated 256-bit random secret; retain for idempotent retry and explicit abort. }
      responses:
        "200":
          description: Idempotent drain status for this owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentDrainStatus" }
        "400": { description: Invalid owner token. }
        "409": { description: Another owner is draining or the process is stopping. }
    delete:
      operationId: abortDeploymentDrain
      summary: Resume admission for the matching drain owner and generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerToken, generation]
              properties:
                ownerToken: { type: string }
                generation: { type: string }
      responses:
        "200":
          description: Admission resumed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentDrainStatus" }
        "400": { description: Invalid request. }
        "409": { description: Stale owner/generation or terminal shutdown. }
  /system/status:
    get:
      operationId: getSystemStatus
      summary: System status
      responses:
        "200":
          description: Current system status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"

  /system/tasks:
    get:
      operationId: listTasks
      summary: Scheduler task states
      responses:
        "200":
          description: All registered scheduled tasks with their run state.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskState"

  /system/tasks/{name}/run:
    post:
      operationId: runTask
      summary: Trigger an immediate run of a scheduled task
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Run requested (requests coalesce if one is pending).
        "404":
          description: No task with that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /health:
    get:
      operationId: getHealth
      summary: Run health checks and report results
      responses:
        "200":
          description: Health report; overall is the worst check status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"

  /library:
    get:
      operationId: listLibrary
      summary: List library items
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MediaKind"
      responses:
        "200":
          description: Item summaries, sorted by title.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaItemSummary"
    post:
      operationId: addLibraryItem
      summary: Add a media item (hydrates metadata from the provider)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMediaRequest"
      responses:
        "201":
          description: The newly added, fully hydrated item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItemDetail"
        "400":
          description: Unsupported kind or invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Item already in the library.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Metadata provider not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/{id}:
    get:
      operationId: getLibraryItem
      summary: Get one item with seasons, episodes, and files
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItemDetail"
        "404":
          description: No such item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      operationId: updateLibraryItem
      summary: Edit an item's monitoring, quality profile, or location
      description: >
        Absent fields are left as they are. Setting rootFolderId recomputes
        the item folder from the naming rules (path, when also given, wins);
        rootFolderId 0 clears the assignment. Files on disk are never moved.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMediaItemRequest"
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItemDetail"
        "400":
          description: Invalid edit (e.g. relative path).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            `offloaded`: the row is offloaded (ADR 0028), so it cannot be
            monitored until Re-acquire (POST /library/{id}/reacquire).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteLibraryItem
      summary: Remove an item from the library (files on disk are untouched)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Removed.
        "404":
          description: No such item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/{id}/repair-folder:
    post:
      operationId: repairLibraryFolder
      summary: Reconnect an item to an existing media folder and scan it
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedPath, path]
              properties:
                expectedPath:
                  type: string
                  description: Current item path, to reject stale repair forms.
                path:
                  type: string
                  description: Existing media directory inside a compatible registered root.
      responses:
        "204":
          description: Folder linked and files scanned. No files moved or created.
        "400":
          description: Stale form, invalid folder, empty folder, or claimed location.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/placement-suggestion:
    get:
      operationId: getLibraryPlacementSuggestion
      summary: Suggest the default root and exact folder for an existing item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The same placement Add media would choose by default.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacementSuggestion" }
        "400":
          description: No compatible root folder is configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/aliases:
    post:
      operationId: addLibraryAlias
      summary: Add an operator-maintained title alias
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddAliasRequest" }
      responses:
        "201":
          description: The stored alias.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitleAlias" }
        "400":
          description: Invalid alias.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Duplicate alias for this item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/aliases/{aliasId}:
    delete:
      operationId: deleteLibraryAlias
      summary: Remove an operator-maintained title alias
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: aliasId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }
        "404":
          description: No such manual alias.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/scan:
    get:
      operationId: getScanStatus
      summary: Status of the latest disk scan job
      responses:
        "200":
          description: Durable scan state, including retries and failures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanStatus" }
    post:
      operationId: scanLibrary
      summary: Trigger a disk scan / reconcile
      responses:
        "202":
          description: Scan queued, or an existing active scan reused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanStatus" }

  /library/scan/report:
    get:
      operationId: getScanReport
      summary: Result of the most recent scan
      description: >
        unmatchedDirs is capped so a library of several hundred unmatched
        folders does not arrive whenever the settings page loads; the full
        list is paginated at /library/review. unmatchedTotal is always the
        true count.
      parameters:
        - name: limit
          in: query
          required: false
          description: Cap on embedded unmatchedDirs (default 25, max 200, 0 for none).
          schema:
            type: integer
      responses:
        "200":
          description: The last scan report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanReport"
        "404":
          description: No scan has run yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/review:
    get:
      operationId: getReviewQueue
      summary: One page of the adoption review queue
      description: >
        The folders adoption could not resolve on its own, paginated and
        filterable. Falls back to the last scan's unmatched folders when no
        adoption run has happened yet, so a fresh scan never looks empty.
      parameters:
        - name: kind
          in: query
          required: false
          description: >
            Restrict to one media kind. Omit for every kind, including the
            mixed-root entries whose kind was never resolved.
          schema:
            $ref: "#/components/schemas/MediaKind"
        - name: q
          in: query
          required: false
          description: Free-text filter over the folder name and parsed title.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 0 means all — honoured, not clamped.
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: One page, plus totals for the whole queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPage"

  /library/adopt:
    post:
      operationId: runAdoption
      summary: Match the unmatched folders the last scan found
      description: >
        Parses each candidate folder name, searches the provider for the
        root's kind, and adopts the ones that clear the per-kind bar. The
        first pass over a new root proposes without writing; once the root is
        confirmed, later passes apply automatically (ADR 0010).
      responses:
        "200":
          description: What was adopted and what needs review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptResult"

  /library/manual:
    post:
      operationId: addManualEntry
      summary: Create a library record no provider backs (ADR 0012)
      description: >
        For media no metadata provider has right: programmes no database
        carries, home video, anything a user wants filed their own way. The
        folder must be a direct child of a registered root folder and must
        exist. For a series the episode list is read off the disk — the files
        are the truth for a record with no provider behind it — and files
        carrying no episode number are skipped rather than guessed at. The
        entry is created unmonitored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, title, path]
              properties:
                kind:
                  $ref: "#/components/schemas/MediaKind"
                title:
                  type: string
                year:
                  type: integer
                author:
                  type: string
                  description: Books only.
                overview:
                  type: string
                path:
                  type: string
                  description: Absolute folder, a direct child of a root folder.
      responses:
        "201":
          description: The new entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItemDetail"
        "400":
          description: Missing title, unsupported kind, or a folder outside a root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another item already points at that folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/{id}/rescan:
    post:
      operationId: rescanManualEntry
      summary: Re-read a manual series' folder for episodes that have appeared
      description: >
        Adds episodes for new files and never removes any: a missing file is
        the normal state of a monitored episode. Only valid for manual
        entries — provider-backed items use metadata refresh.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The entry, with any new episodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItemDetail"
        "400":
          description: Not a manual entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/adopt/one:
    post:
      operationId: adoptOne
      summary: Adopt one reviewed folder to a chosen match
      description: >
        Applies a specific candidate to a specific folder, in place. The path
        must be one the review queue is currently offering — the endpoint
        writes a library item pointed at a directory, so arbitrary paths are
        refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                kind:
                  $ref: "#/components/schemas/MediaKind"
                tmdbId:
                  type: integer
                  format: int64
                tvdbId:
                  type: integer
                  format: int64
                olid:
                  type: string
                title:
                  type: string
                year:
                  type: integer
                force:
                  type: boolean
                  description: >
                    Re-point an existing library entry at this folder even
                    when it already points at a directory that exists. The
                    caller must have been told which other folder it is.
      responses:
        "204":
          description: Adopted; the folder leaves the review queue.
        "400":
          description: Not a folder awaiting review, or the match was rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Another folder already holds this title and also exists on disk.
            Resolvable: retry with force to move the entry here, or dismiss
            this folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/adopt/exact:
    post:
      operationId: adoptExact
      summary: Apply every confident match in the review queue
      description: >
        Adopts the proposals that clear the per-kind bar, including in roots
        whose first pass has not been confirmed — pressing this is the review.
      responses:
        "200":
          description: What was adopted and what still needs a human.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptResult"

  /library/adopt/confirm:
    post:
      operationId: confirmRootAdopted
      summary: Turn automatic adoption on or off for a root
      description: >
        Reversible on purpose. Confirming a root is a trust decision, and a
        switch that only goes one way is one users are right to hesitate
        over.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rootFolderId]
              properties:
                rootFolderId:
                  type: integer
                  format: int64
                autoAdopt:
                  type: boolean
                  description: Defaults to true.
      responses:
        "204":
          description: Confirmed.

  /library/scan/ignored:
    get:
      operationId: listIgnoredDirs
      summary: Directories dismissed as not-media
      responses:
        "200":
          description: Every dismissal, so it can be undone.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IgnoredPath"
    post:
      operationId: ignoreDir
      summary: Dismiss an adoption candidate for good
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                reason:
                  type: string
      responses:
        "204":
          description: Dismissed; scans stop offering it.
        "400":
          description: Path invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: unignoreDir
      summary: Undo a dismissal
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Restored; the next scan offers it again.

  /filesystem:
    get:
      operationId: browseFilesystem
      summary: List child directories of a path (root-folder picker and typeahead)
      description: >
        Directories only, one level, no recursion. Missing and unreadable
        paths return the same error on purpose — distinguishing them is what
        makes an enumeration primitive useful to someone probing the host.
        Requires authentication like every other settings route.
      parameters:
        - name: path
          in: query
          required: false
          description: >
            Absolute path to list. A trailing separator lists the directory;
            a partial final component filters that directory's children by
            prefix, which is what drives typeahead. Defaults to "/".
          schema:
            type: string
      responses:
        "200":
          description: The directory's child directories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowseResult"
        "400":
          description: Path not absolute, or not readable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /metadata/preview:
    get:
      operationId: previewMetadata
      summary: Read a title before adding, without loading episodes or writing library state
      parameters:
        - name: kind
          in: query
          required: true
          schema: { $ref: "#/components/schemas/MediaKind" }
        - name: tmdbId
          in: query
          schema: { type: integer, format: int64 }
        - name: tvdbId
          in: query
          schema: { type: integer, format: int64 }
        - name: olid
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Verified metadata with fresh ownership and Add eligibility.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataPreview" }
        "400":
          description: Invalid external ID or kind/key combination.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No provider record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Provider identity conflict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: No supported preview route.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Metadata provider unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /metadata/search:
    get:
      operationId: searchMetadata
      summary: Search the metadata provider
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MediaKind"
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Candidates from the provider.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "400":
          description: Unsupported kind or invalid external ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: More than one record claims the identity, or a provider contradicted it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The identity resolved but no supported provider can hydrate it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Metadata provider not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /metadata/recommendations:
    post:
      operationId: recommendSeries
      summary: Find series by theme or verified seed without adding them
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationRequest' }
      responses:
        '200':
          description: Bounded suggestions or actionable refinement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationResponse' }
        '400': { description: invalid_recommendation_request }
        '404': { description: seed_not_found }
        '409': { description: identity_conflict }
        '422': { description: unsupported_seed }
        '429': { description: recommendations_busy; Retry-After 2 }
        '503': { description: provider_unavailable or recommendation_state_changed }
  /metadata/recommendations/status:
    get:
      operationId: recommendationStatus
      summary: Local recommendation readiness without external work
      responses:
        '200':
          description: Feature and local model state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationStatus' }
  /metadata/recommendations/model/install:
    post:
      operationId: installRecommendationModel
      summary: Explicitly install the pinned local model
      responses:
        '202': { description: Installation started or already running }
        '503': { description: Standalone helper unavailable }
  /metadata/recommendations/model:
    delete:
      operationId: removeRecommendationModel
      summary: Remove verified local model while ranking is disabled
      responses:
        '204': { description: Removed }
        '409': { description: Disable semantic ranking first }
  /metadata/availability:
    post:
      operationId: lookupAvailability
      summary: Read catalogue and observed primary-copy availability for exact identities.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items: { $ref: '#/components/schemas/AvailabilityTarget' }
      responses:
        '200':
          description: Facts in the same order as the requested identities; failures are unknown.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Availability' }
        '400': { description: Invalid request. }
  /discover/library/seeds:
    get:
      operationId: listLibraryDiscoverySeeds
      summary: Page exact library movie and series identities usable as discovery seeds.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000 } }
      responses:
        '200':
          description: Fifty seeds per page, with current local availability.
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SearchResult' }
                  hasMore: { type: boolean }
        '400': { description: Invalid request. }
  /discover/library/{id}/items:
    get:
      operationId: getLibraryDiscoveryItems
      summary: Read one bounded kind-aware shelf from an explicitly selected library seed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: kind, in: query, required: true, schema: { type: string, enum: [movie, series] } }
        - { name: tmdbId, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: shelf, in: query, required: true, schema: { type: string, enum: [related, collection] } }
      responses:
        '200':
          description: Provider metadata freshly joined to local availability; never initiates acquisition.
          content:
            application/json:
              schema:
                type: object
                required: [title, source, seed, items]
                properties:
                  title: { type: string }
                  source: { type: string }
                  seed: { $ref: '#/components/schemas/SearchResult' }
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/SearchResult' }
        '400': { description: Invalid request. }
        '409': { description: The selected library identity changed; select it again. }
        '503': { description: The shelf provider or library is unavailable. }
  /discover/lists:
    get:
      operationId: listDiscoverLists
      summary: The Discover catalogue
      description: >
        Every browse row on offer, from every provider that is configured
        (ADR 0015). A provider missing its key contributes nothing rather
        than rows that would always fail, so an empty array means "no
        provider is set up", not "nothing is trending".
      responses:
        "200":
          description: The rows this install can serve, in display order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscoverList"

  /discover/items:
    get:
      operationId: discoverItems
      summary: One page of one Discover row
      parameters:
        - name: list
          in: query
          required: true
          description: A list id from /discover/lists.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 1-based. Past the end of a row, the array is empty.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The row's contents, marked with what is already added.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "400":
          description: No such list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The provider serving this list is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /rootfolders/{id}/volume:
    get:
      operationId: previewLibraryVolume
      summary: Owner review of the exact library volume binding, without mutations.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Owner-only volume review, including custody blockers and a fingerprint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryVolumeReview" }
    post:
      operationId: confirmLibraryVolume
      summary: Confirm a freshly observed library volume; never deletes filesystem data.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint, acknowledged]
              properties:
                fingerprint: { type: string, minLength: 64, maxLength: 64 }
                acknowledged: { type: boolean }
      responses:
        '204': { description: Binding confirmed and old availability proofs invalidated. }
        '409': { description: Volume or custody changed, acknowledgement missing, or work is active. }
  /rootfolders:
    get:
      operationId: listRootFolders
      summary: List library root folders
      responses:
        "200":
          description: Registered roots with disk info.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RootFolder"
    post:
      operationId: addRootFolder
      summary: Register a library root folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                kind:
                  $ref: "#/components/schemas/RootKind"
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootFolder"
        "400":
          description: Path invalid or not accessible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /rootfolders/{id}:
    patch:
      operationId: updateRootFolder
      summary: Retype a root folder (items already in it are untouched)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  $ref: "#/components/schemas/RootKind"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootFolder"
        "400":
          description: Unknown kind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such root folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteRootFolder
      summary: Remove a root folder registration (disk untouched)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Removed.
        "404":
          description: No such root folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /settings:
    get:
      operationId: getSettings
      summary: Read settings (secrets masked)
      responses:
        "200":
          description: Current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "204":
          description: Saved.

  /profiles:
    get:
      operationId: listProfiles
      summary: List quality profiles
      responses:
        "200":
          description: Profiles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QualityProfile"
    post:
      operationId: createProfile
      summary: Create a quality profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityProfile"
        "400":
          description: Invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /languages:
    get:
      operationId: listLanguages
      summary: List the audio languages a profile can require
      description: >
        The vocabulary of ADR 0022, in display order. Profile editors pick
        from this rather than typing codes.
      responses:
        "200":
          description: Languages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LanguageOption"

  /profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: updateProfile
      summary: Replace a quality profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityProfile"
        "400":
          description: Invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteProfile
      summary: Delete a quality profile
      description: >
        Refused with 409 while any library item, copy, or import list still
        references the profile -- those rows would be left pointing at nothing.
      responses:
        "204":
          description: Deleted.
        "404":
          description: No such profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Still in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /indexers:
    get:
      operationId: listIndexers
      summary: List indexers
      responses:
        "200":
          description: Indexers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Indexer"
    post:
      operationId: addIndexer
      summary: Add an indexer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerInput"
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indexer"
        "400":
          description: Invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /indexers/test:
    post:
      operationId: testIndexer
      summary: Test an indexer config (t=caps)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerInput"
      responses:
        "200":
          description: Reachable.
        "400":
          description: Failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /indexers/{id}:
    patch:
      operationId: updateIndexerBudget
      summary: Set the saved indexer's rolling daily request cap
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dailyRequestCap]
              properties:
                dailyRequestCap: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Updated configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Indexer" }
        "400": { description: Invalid cap. }
        "404": { description: No such indexer. }
    delete:
      operationId: deleteIndexer
      summary: Remove an indexer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }
        "404":
          description: No such record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /indexers/{id}/test:
    post:
      operationId: testIndexerById
      summary: Test a saved indexer with its stored credentials
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Reachable. }
        "400":
          description: Test failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such indexer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /downloadclients:
    get:
      operationId: listDownloadClients
      summary: List download clients
      responses:
        "200":
          description: Clients.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadClientConfig"
    post:
      operationId: addDownloadClient
      summary: Add a download client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientInput"
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClientConfig"
        "400":
          description: Invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /downloadclients/test:
    post:
      operationId: testDownloadClient
      summary: Test a download client config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientInput"
      responses:
        "200": { description: Reachable. }
        "400":
          description: Failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /downloadclients/{id}:
    put:
      operationId: updateDownloadClient
      summary: Update a download client (e.g. toggle manual approval)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientInput"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadClientConfig" }
        "400":
          description: Invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteDownloadClient
      summary: Remove a download client
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }
        "404":
          description: No such record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /downloadclients/{id}/test:
    post:
      operationId: testDownloadClientById
      summary: Test a saved download client with its stored credentials
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Reachable. }
        "400":
          description: Test failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/releases:
    get:
      operationId: searchReleases
      summary: Interactive search for one item target or book edition
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: season
          in: query
          required: false
          schema: { type: integer }
        - name: episode
          in: query
          required: false
          schema: { type: integer }
        - name: copyId
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Additional quality copy or book edition; absent/0 selects the primary target.
      responses:
        "200":
          description: Ranked candidates with rejection reasons attached.
          headers:
            X-Monarr-Search-Partial:
              description: True when one or more indexers or query modes failed.
              schema: { type: boolean }
            X-Monarr-Search-Reason:
              description: Semicolon-separated, credential-redacted incomplete-search reasons.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReleaseCandidate"
        "404":
          description: Unknown item/season/episode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No enabled indexers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /grab:
    post:
      operationId: grabRelease
      summary: Send a release to a download client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrabRequest"
      responses:
        "409":
          description: Request identity conflicts, request was retained, candidate evidence expired, or blacklist confirmation is required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "201":
          description: Queued; returns the download row id.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: integer, format: int64 }
        "400":
          description: Invalid or no client for protocol.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /queue:
    get:
      operationId: listQueue
      summary: Recent downloads, filtered and paged
      description: >
        Without parameters this is the last 100 downloads in every state,
        which is what it has always been. With them it is one page of one
        group: `filter=active` is everything still moving or awaiting a
        decision (the only view that has to be complete), `imported` and
        `failed` are history and are meant to be paged.
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [active, imported, failed]
        - name: q
          in: query
          required: false
          description: Case-insensitive substring of the release title.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100, maximum: 500 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Queue.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueItem"

  /queue/summary:
    get:
      operationId: queueSummary
      summary: How many downloads are in each state
      description: >
        The section counts, without the rows. A collapsed "Finished (1,284)"
        should cost one aggregate, not 1,284 rows over the wire.
      responses:
        "200":
          description: Counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueSummary" }

  /queue/finished:
    delete:
      operationId: clearFinishedQueue
      summary: Clear the finished rows
      description: >
        Removes every imported row from the queue. The rows only - an
        imported download's row is a receipt, and the files it describes are
        in the library under the library's own records. Nothing here reads a
        path, asks a download client, or touches a file.
      responses:
        "200":
          description: How many rows were cleared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClearedCount" }

  /queue/failed:
    delete:
      operationId: clearFailedQueue
      summary: Clear the failed rows
      description: >
        Removes every failed row from Activity. The rows only - this does not
        delete a payload, remove a library file, change a blocklist, or ask a
        download client to remove anything.
      responses:
        "200":
          description: How many rows were cleared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClearedCount" }

  /history:
    get:
      operationId: listHistory
      summary: What happened to a release — grab, client outcome, import result
      description: >
        The per-release timeline. Monarr recorded these events from the
        beginning and surfaced none of them, which is how five consecutive
        failed grabs of one movie in ten hours looked, from the UI, like
        nothing happening at all. Newest first.
      parameters:
        - name: mediaItemId
          in: query
          required: false
          description: Only this item's events. Omitted = everything, newest first.
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100, maximum: 500 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: The timeline.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryEvent"

  /activity:
    get:
      operationId: listActivity
      summary: Unified download and retained import activity
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [progress, attention, history], default: progress }
        - name: scope
          in: query
          schema: { type: string, enum: [all, imports], default: all }
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Counts cover the complete search and scope; rows are paged after classification. Negative IDs are read-only historical publications.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportActivityPage' }
        "400":
          description: Invalid view, scope or pagination.

  /imports:
    get:
      operationId: listImportActivity
      summary: Retained import activity, including worker ownership and publication outcomes
      parameters:
        - name: filter
          in: query
          schema: { type: string, enum: [all, active, queued, attention, imported], default: all }
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One page of imports. Counts cover the full search, not only this page. History is subject to Activity retention.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportActivityPage' }
        "400":
          description: Invalid filter or pagination.

  /queue/{id}:
    get:
      operationId: getQueueItem
      summary: One Activity row, whatever its state
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueItem" }
        "404":
          description: No such row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: removeQueueItem
      summary: Remove a queue row (optionally from the client too)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: fromClient
          in: query
          required: false
          schema: { type: boolean }
        - name: blocklist
          in: query
          required: false
          description: >
            With fromClient: also blocklist the release (the item page's
            Cancel download), so automation does not grab it again. Activity's
            Remove leaves it off: a removal is not a verdict on the release.
          schema: { type: boolean }
      responses:
        "204": { description: Removed. }
        "404":
          description: Unknown row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /queue/{id}/resolve-reservation:
    post:
      operationId: resolveQueueReservation
      summary: Acknowledge duplicate risk and release uncertain or cancelled episode custody
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acknowledgeDuplicateRisk]
              properties:
                acknowledgeDuplicateRisk: { type: boolean }
      responses:
        "204": { description: Custody released; original retained as superseded evidence. }
        "400": { description: Acknowledgment missing or row not resolvable. }
  /queue/{id}/resume:
    post:
      operationId: resumeQueueItem
      summary: Resume the retained Runner job after resource admission
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Resume requested; hold clears on authoritative state }
        "409": { description: Hold remains unresolved }
  /queue/{id}/import:
    post:
      operationId: importQueueItem
      summary: Import a download now — approve a held one, or retry a failed one
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Imported. }
        "400":
          description: Import failed (reason in the body); the row stays retryable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /queue/{id}/publications/{publicationId}/files/resolve:
    post:
      operationId: resolvePublicationFile
      summary: Decide an unresolved publication file - place it, discard it, or keep it for later
      description: >
        Pipeline contract v2 (section 3.4). A publication file the importer could
        not place (an obfuscated name with no episode mapping, a sidecar with no
        parent, a file whose precedence is ambiguous) stays unresolved, retained
        and shown in Resolve. place imports exactly that file; discard records
        discarded{rejected} (the file is deleted only by M4's per-file cleanup,
        never by this call); keep records that a person looked and wants it left.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: publicationId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, action]
              properties:
                path: { type: string, description: The file's path relative to the publication. }
                action: { type: string, description: "place | discard | keep" }
      responses:
        "204": { description: Recorded; a place is queued for import. }
        "400":
          description: Not an unresolved file of this publication, or an unknown action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown row or publication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /queue/{id}/publications/{publicationId}/files/place:
    post:
      operationId: placePublicationFiles
      summary: Place one or more files of a runner delivery into an item, as chosen episodes
      description: >
        Resolve's place for several files at once (Import file… on the item
        page): one admission, one import. mediaItemId may name another item
        only while nothing of this delivery is in the library; the download
        then follows it. Refused while an import of this delivery runs.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: publicationId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                mediaItemId: { type: integer, format: int64, description: "Target item; absent = the download's own." }
                copyId: { type: integer, format: int64, description: Target copy or edition; 0 = the primary. }
                files:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [path]
                    properties:
                      path: { type: string, description: The file's path relative to the publication. }
                      season: { type: integer }
                      episodes:
                        type: array
                        description: The episode(s) this file is, overriding its name.
                        items: { type: integer }
      responses:
        "204": { description: Recorded and queued for import. }
        "400":
          description: A file that is not unresolved, a refused move, a running import, or an unknown episode or copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown row or publication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /queue/{id}/cancel-import:
    post:
      operationId: cancelQueueImport
      summary: Durably cancel this import attempt and retain source custody
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportAttemptIdentity" }
      responses:
        "202": { description: Cancellation persisted; actual writer or publication reconciliation remains pending. }
        "204": { description: Cancellation finalized after actual writer release. }
        "400": { description: Invalid request. }
        "404": { description: Unknown row. }
        "409": { description: Attempt changed or completed. }

  /queue/{id}/import-review:
    get:
      operationId: getImportReview
      summary: Read retained import custody and publication evidence without storage I/O
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Current import control and retained custody. }
        "404": { description: Unknown row. }
    post:
      operationId: resolveImportReview
      summary: Review custody or explicitly clean selected cancelled empty stages
      description: >
        preview_stage_cleanup returns current zero-byte stage fingerprints;
        cleanup_stages requires those fingerprints and acknowledged=true.
        Only cancelled, quiescent, identity-proven stage allocations qualify.
        Library targets and prior-file backups are never deletion targets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [generationKey, epoch, action, ids]
              properties:
                generationKey: { type: string }
                epoch: { type: string, pattern: '^[0-9]+$' }
                action: { type: string, enum: [retain_uncertain, operator_adopted, operator_disposed, preview_stage_cleanup, cleanup_stages] }
                ids: { type: array, items: { type: string } }
                acknowledged: { type: boolean, default: false }
                fingerprints: { type: object, additionalProperties: { type: string } }
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Evidence previewed or review recorded; cleanup_stages physically removes only selected verified empty stages. }
        "400": { description: Explicit acknowledgement required. }
        "409": { description: Local writer active or attempt changed. }

  /queue/{id}/blocklist:
    post:
      operationId: blocklistQueueItem
      summary: Declare the release bad — blocklist it and search a replacement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Blocklisted; a replacement search was kicked off. }
        "404":
          description: Unknown row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /import/scan:
    get:
      operationId: scanImportPath
      summary: List the media files Monarr can see under a path
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
        - name: depth
          in: query
          required: false
          description: >
            1 lists only the files directly in path (the item page's Import
            file… browser), each with its subtitle count and, for a file
            inside a runner delivery, that delivery, plus an entry with
            skipped set for each entry it could not offer. Absent walks the
            whole tree; any other value is refused.
          schema: { type: integer }
      responses:
        "200":
          description: Files found (empty array means nothing importable there).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScannedFile" }
        "400":
          description: Path not accessible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /import/plan:
    post:
      operationId: planImport
      summary: What importing these files into an item would do (moves nothing)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportPlanRequest" }
      responses:
        "200":
          description: One line per file, in request order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportPlanFile" }
        "400":
          description: No item, no files, or a copy that is not the item's.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /import/default-path:
    get:
      operationId: getManualImportDefaultPath
      summary: Completed-download folder Monarr sees for manual imports
      responses:
        "200":
          description: Configured, learned, or standard completed-download path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPathDefault" }

  /import/recovery/settings:
    get:
      operationId: getRecoverySettings
      responses:
        '200':
          description: Recovery settings and advisory prerequisites
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    put:
      operationId: putRecoverySettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoverySettings' }
      responses:
        '200': { description: Applied without prerequisite gating }
  /import/recovery:
    get:
      operationId: listRecoveries
      responses:
        '200':
          description: Runner recovery manifests
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
    post:
      operationId: queueRecoveryImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryImportRequest' }
      responses:
        '202':
          description: Durable recovery import queued
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '409': { description: Preview changed or recovery held }
  /import/recovery/retained/plan:
    post:
      operationId: planRetainedRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 1000
              items: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Provisional per-file dry-run observations without mutation authority
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '409': { description: Inventory changed while planning }
  /import/recovery/preview:
    post:
      operationId: previewRecoveryImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryImportRequest' }
      responses:
        '202':
          description: Verified staged files, probe and target generation
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /import/recovery/previews/{id}:
    get:
      operationId: getRecoveryPreview
      summary: Read a persisted recovery preview
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Preview operation
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /import/recovery/jobs:
    get:
      operationId: listRecoveryImports
      responses:
        '200':
          description: Durable recovery import activity
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
  /import/recovery/{id}/cancel:
    post:
      operationId: cancelRecoveryImport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Cancellation requested; source remains held until acknowledgement }
        '409': { description: Import already committed }
  /import/recovery/{id}:
    get:
      operationId: getRecoveryImport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Durable import status
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /import/manual:
    post:
      operationId: manualImport
      summary: Import files from a path into a chosen item/copy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualImportRequest" }
      responses:
        "202":
          description: Accepted as an Activity job; the import continues in the background.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualImportAccepted" }
        "400":
          description: >
            The path, selection, or target is invalid; no job was queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /customformats:
    get:
      operationId: listCustomFormats
      summary: Custom-format scoring rules
      responses:
        "200":
          description: Rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomFormat"
    post:
      operationId: addCustomFormat
      summary: Add a scoring rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomFormatInput"
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFormat"
        "400":
          description: Invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /customformats/{id}:
    delete:
      operationId: deleteCustomFormat
      summary: Remove a scoring rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }
        "404":
          description: No such record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /importlists:
    get:
      operationId: listImportLists
      summary: Import list sources
      responses:
        "200":
          description: Lists.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportList"
    post:
      operationId: addImportList
      summary: Add an import list source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportListInput"
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportList"
        "400":
          description: Invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /importlists/{id}:
    delete:
      operationId: deleteImportList
      summary: Remove an import list source
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }
        "404":
          description: No such record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/{id}/autosearch:
    post:
      operationId: autoSearchLibraryItem
      summary: Search for everything this item wants and grab the best releases
      description: >
        Sonarr-style automatic search: no candidate list — the decision engine
        picks. Series search per-season packs. Runs to completion and reports
        what it did for every target, including the ones it did not search and
        why, so "nothing happened" is always distinguishable from "nothing was
        wanted".
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The search ran; the body says what it did.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoSearchResult" }
        "404":
          description: No such item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/status:
    get:
      operationId: getLibraryItemStatus
      summary: Where this item stands, from search to cinema
      description: >
        A read projection over the search records, download rows,
        publications and cinema sub-deliveries. A movie or book returns six
        stages (searched, downloading, processed, moved, cinema_notified,
        in_cinema), the current download with Runner's own rate and ETA, and
        earlier attempts. A series returns season summaries; with `season`
        it returns that season's episodes, each with its own stages. "In
        cinema" is confirmed at visibleAt; an item with no record returns
        the last known facts.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: season
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: The item's status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemStatus" }
        "404":
          description: No such item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/status/confirm:
    post:
      operationId: confirmLibraryItemInCinema
      summary: Ask cinema to confirm this item's files
      description: >
        Queues a scan request per folder, with the item's current files as
        the expected files, through the same notification outbox an import
        writes. The read-back then confirms each file or names what is
        missing. The request key is stable per item (or per episode), so
        asking again refreshes the same request instead of adding one.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: episode
          in: query
          required: false
          description: An episode id; only that episode's files are named.
          schema: { type: integer, format: int64 }
      responses:
        "202":
          description: Requests queued.
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: integer, description: Folder requests queued. }
        "404":
          description: No such item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: No readable files, or no cinema notifier to ask.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/copies:
    post:
      operationId: addMediaCopy
      summary: Add an additional quality copy (e.g. a 720p copy of a 4K item)
      description: >
        Each copy has its own quality profile and its own automation
        lifecycle. rootFolderId picks a separate folder for the copy;
        omit it (or 0) to keep the copy in the item's folder — filenames
        carry the quality, so versions coexist. Movies and series only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaCopyInput" }
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItemDetail" }
        "400":
          description: Invalid copy (bad profile, folder collision, book).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/copies/{copyId}:
    patch:
      operationId: updateMediaCopy
      summary: Edit a copy's name, profile, or monitoring
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: copyId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaCopyUpdate" }
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItemDetail" }
        "404":
          description: No such item or copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteMediaCopy
      summary: Remove a copy (its files on disk are kept)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: copyId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItemDetail" }
        "404":
          description: No such item or copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/probe:
    post:
      operationId: reprobeLibraryItem
      summary: Re-measure this item's files
      description: >
        Re-reads every video file of the item, ignoring the already-probed
        cache. The cache is right for a routine scan, but it leaves no way back
        for a file whose probe failed for a reason outside the file — a
        permission that has since been fixed, a mount that was not up.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: integer
                    description: How many files were queued for measurement.
        "404":
          description: No such item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/files/{fileId}:
    delete:
      operationId: removeLibraryFile
      summary: Remove one file from an item, and optionally condemn its release
      description: >
        Deletes one file's library record, optionally the bytes on disk,
        optionally blocklists the release that produced it, and optionally
        searches for a replacement.


        The parts are separate because they are separate statements. Deleting
        says "I do not want this copy"; blocklisting says "and never take this
        release again". A file deleted to free space should not poison a
        release that was fine. A file that is a fake should do both.


        Blocklisting needs a source release, which only exists for files monarr
        itself grabbed. For an adopted file the deletion still happens and the
        response says why the blocklist did not.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: fileId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: fromDisk
          in: query
          schema: { type: boolean, default: false }
          description: Delete the bytes too, not just the library record.
        - name: blocklist
          in: query
          schema: { type: boolean, default: false }
          description: Never grab the release that produced this file again.
        - name: search
          in: query
          schema: { type: boolean, default: false }
          description: Hunt for a replacement once the file is gone.
      responses:
        "200":
          description: What actually happened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoveFileResult" }
        "404":
          description: No such item or file, or the two do not belong together.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/files/{fileId}/report:
    post:
      operationId: reportLibraryFile
      summary: Record a review flag for existing library media
      description: Stores reported evidence separately; it does not change quality, coverage, or acquisition state.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: fileId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryFileReportRequest" }
      responses:
        "204": { description: Review flag recorded. }
        "404":
          description: The reviewed generation is no longer current.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The reviewed generation changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/review-flags/{flagId}/resolve:
    post:
      operationId: resolveLibraryReviewFlag
      summary: Resolve a user report for the exact reviewed file generation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: flagId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileGeneration]
              properties:
                fileGeneration: { type: string }
      responses:
        "204": { description: Review flag resolved. }
        "404": { description: No matching open review flag. }
        "409": { description: File generation changed. }

  /library/{id}/files/{fileId}/replacement-observations:
    post:
      operationId: startReplacementFileObservation
      summary: Prepare a read-only, generation-bound file observation
      description: Hashes and fingerprints current bytes in the background before an explicit replacement decision can act on them.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: fileId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplacementObservationRequest" }
      responses:
        "202":
          description: Observation queued or already running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplacementObservation" }
        "200":
          description: Idempotent replay of an existing observation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplacementObservation" }
        "409":
          description: The file generation changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /replacement-observations/{observationId}:
    get:
      operationId: getReplacementFileObservation
      summary: Read a prepared file observation
      parameters:
        - name: observationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Observation status and exact byte identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplacementObservation" }
        "404":
          description: No such observation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/replacement-operations:
    get:
      operationId: getLibraryLifecycleReview
      summary: List durable replacement operations and open file reports for an item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Item-level lifecycle review, available after files or Activity rows are removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryLifecycleReview" }
        "404":
          description: Item was not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: createReplacementOperation
      summary: Start a reviewed bad-source or quality replacement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplacementRequest" }
      responses:
        "200": { description: Existing request replayed with its original identity. }
        "202":
          description: Durable replacement operation accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplacementOperation" }
        "400":
          description: Invalid replacement scope or missing explicit decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Item or file was not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The reviewed source changed or the request ID conflicts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /replacement-operations/{operationId}:
    get:
      operationId: getReplacementOperation
      summary: Read a durable replacement operation
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current operation and snapshotted file evidence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplacementOperation" }
        "404":
          description: No such operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/rematch/preview:
    post:
      operationId: previewRematch
      summary: What a Re-match would do (ADR 0027); no side effects
      description: >
        Re-match… (every file of the item) or Move to… (fileIds) to another
        library item, another copy or edition, other episodes, or a title not
        yet in the library (target by provider id; it is added only when the
        Re-match is executed). Lists every rename, the files that do not fit
        (with the target's episodes for a picker), what happens to this item,
        the releases blocklisted for it, what Cinema will do, and anything
        in flight that blocks the move (`blocked`, retry to wait for it).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RematchRequest" }
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RematchPreview" }
        "400":
          description: A target of another kind, a file that is not this item's, or no target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/rematch:
    get:
      operationId: getLibraryRematch
      summary: The open Re-match moving files out of or into this item
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The operation (progress, Stop, cinema confirmation).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RematchOperation" }
        "204":
          description: No open operation for this item.
    post:
      operationId: startRematch
      summary: Execute a previewed Re-match (idempotent by requestId)
      description: >
        Adds the target first when it is not in the library (default profile,
        a root of its kind), then takes both titles' leases, refuses a stale
        preview (409 `stale`) or work in flight (409 `rematch_blocked`), and
        starts the moves. Follow it with GET /rematch/{operationId}.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RematchRequest" }
      responses:
        "202":
          description: The operation, started (or the one this requestId already started).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RematchOperation" }
        "400":
          description: Invalid request (no requestId or fingerprint, nothing to move, no room).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            `stale` (preview again), `rematch_blocked` (work in flight; the
            body carries `blocked`), `request_conflict` (requestId reused), or
            `busy` (a title is being imported). 503 `maintenance` while a
            deployment drain pauses new work.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RematchConflict" }

  /rematch/{operationId}:
    get:
      operationId: getRematch
      summary: A Re-match's state, bytes copied, result and Cinema confirmation
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RematchOperation" }
        "404":
          description: No such operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /rematch/{operationId}/cancel:
    post:
      operationId: cancelRematch
      summary: Stop a Re-match that has not committed (a copy's temp file is removed, sources untouched)
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Stopping; files already moved are put back.
        "404":
          description: No such operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The files are already committed; it can no longer be stopped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /rematch/{operationId}/dismiss:
    post:
      operationId: dismissRematch
      summary: Hide a finished Re-match from the item pages' status panels
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Dismissed.
        "404":
          description: No such operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: It is still running; Stop it instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/offload/preview:
    post:
      operationId: previewOffload
      summary: What an Offload would delete (ADR 0028); no side effects
      description: >
        Offload frees the space and keeps the title: it deletes every file of
        the scope (video, subtitles, every quality copy) and marks the scope
        offloaded, so nothing searches for it again until Re-acquire. The
        preview lists the files including sidecars and untracked subtitles,
        the bytes freed, the library volume's free space before and after,
        what is blocking it (`blocked`; retry to wait), a line on what Cinema
        will do (advisory, never a gate) and, when a file covers several
        episodes, the episodes the scope widens to (`widened`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OffloadRequest" }
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OffloadPreview" }
        "400":
          description: A scope that does not exist, or a title that is already offloaded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/offload:
    get:
      operationId: getLibraryOffload
      summary: The open Offload of this title
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: >
            The operation to follow: the open one, else the latest finished
            one that has not been dismissed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OffloadOperation" }
        "204":
          description: No open or recent operation for this item.
    post:
      operationId: startOffload
      summary: Execute a previewed Offload (idempotent by requestId)
      description: >
        Takes the title's lease and its per-copy reservations, refuses a stale
        preview (409 `stale`) or work in flight (409 `offload_blocked`), then
        in one transaction records the scope and the file list, marks it
        offloaded and writes Cinema's sub-deliveries; the deletes follow in
        the background and survive a restart. Follow it with GET
        /offload/{operationId}.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OffloadRequest" }
      responses:
        "202":
          description: The operation, started (or the one this requestId already started).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OffloadOperation" }
        "400":
          description: Invalid request (no requestId or fingerprint, no such scope).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            `stale` (preview again), `offload_blocked` (work in flight, or the
            share is not mounted; the body carries `blocked`),
            `request_conflict` (requestId reused) or `busy` (the title is being
            imported). 503 `maintenance` while a deployment drain pauses new work.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OffloadConflict" }

  /library/{id}/reacquire:
    post:
      operationId: reacquireLibraryItem
      summary: Get an offloaded title, season or episode back (ADR 0028)
      description: >
        Clears offloaded inside the scope, monitors it, cancels the Offload's
        unconfirmed Cinema requests and searches at the current profile (a
        season is searched pack-first). Answers at once with `searching`; the
        search runs in the background. Asking again is harmless. The same
        service backs the plurx webhook's `reacquire` event.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OffloadRequest" }
      responses:
        "200":
          description: Where the title is now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReacquireResult" }
        "400":
          description: A scope that does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The Offload is still deleting files (`busy`); wait for it or Stop it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /offload/{operationId}:
    get:
      operationId: getOffload
      summary: An Offload's state, files deleted, bytes freed and Cinema confirmation
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OffloadOperation" }
        "404":
          description: No such operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /offload/{operationId}/cancel:
    post:
      operationId: cancelOffload
      summary: Stop an Offload; what is already deleted stays deleted
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Stopped; the remaining files stay on disk and their titles are no longer offloaded.
        "404":
          description: No such operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: It has already finished.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /offload/{operationId}/dismiss:
    post:
      operationId: dismissOffload
      summary: Hide a finished Offload from the item page's status panel
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Dismissed.
        "404":
          description: No such operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: It is still running; Stop it instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/seasons/{season}:
    patch:
      operationId: setSeasonMonitored
      summary: Monitor or unmonitor one season (cascades to its episodes)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: season
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorRequest" }
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItemDetail" }
        "409":
          description: >
            `offloaded`: the row is offloaded (ADR 0028), so it cannot be
            monitored until Re-acquire (POST /library/{id}/reacquire).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such item or season.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/episodes/{episodeId}:
    patch:
      operationId: setEpisodeMonitored
      summary: Monitor or unmonitor one episode
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: episodeId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorRequest" }
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItemDetail" }
        "409":
          description: >
            `offloaded`: the row is offloaded (ADR 0028), so it cannot be
            monitored until Re-acquire (POST /library/{id}/reacquire).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such item or episode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/{id}/refresh:
    post:
      operationId: refreshLibraryItem
      summary: Re-hydrate this item's metadata from its provider
      description: >
        Updates the cached metadata (overview, poster, status, rating, …)
        and, for series, picks up newly announced seasons and episodes.
        Monitored flags, quality profile, and folder are untouched; nothing
        is deleted. The metadata.refresh task does this for the whole
        library on a schedule.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The refreshed item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItemDetail" }
        "404":
          description: No such item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /library/bulk:
    post:
      operationId: bulkEditLibrary
      summary: Apply monitoring/profile changes to many items at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
                monitored:
                  type: boolean
                qualityProfileId:
                  type: integer
                  format: int64
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: integer
                  failed:
                    type: array
                    description: >
                      Items that were not changed, with the reason (`offloaded`: an
                      offloaded title cannot be monitored; Re-acquire it instead).
                    items:
                      type: object
                      required: [id, code, reason]
                      properties:
                        id: { type: integer, format: int64 }
                        code: { type: string }
                        reason: { type: string }

  /auth/login:
    post:
      operationId: login
      summary: Session login for the UI (when auth is enabled)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "204": { description: Session cookie set. }
        "401":
          description: Bad credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/cinema/connection:
    get:
      operationId: getCinemaConnection
      summary: Optional Cinema getCinemaConnection
      responses:
        "200":
          description: Current transaction result (no client or grant secrets)
    put:
      operationId: saveCinemaConnection
      summary: Optional Cinema saveCinemaConnection
      responses:
        "200":
          description: Current transaction result (no client or grant secrets)
  /auth/cinema/link:
    get:
      operationId: getCinemaLink
      summary: Optional Cinema getCinemaLink
      responses:
        "200":
          description: Current transaction result (no client or grant secrets)
    post:
      operationId: startCinemaLink
      summary: Optional Cinema startCinemaLink
      responses:
        "200":
          description: Current transaction result (no client or grant secrets)
    delete:
      operationId: unlinkCinema
      summary: Optional Cinema unlinkCinema
      responses:
        "200":
          description: Current transaction result (no client or grant secrets)
  /auth/cinema/start:
    post:
      operationId: startCinemaSignIn
      summary: Optional Cinema startCinemaSignIn
      responses:
        "200":
          description: Current transaction result (no client or grant secrets)
  /auth/cinema/native:
    post:
      operationId: startCinemaNative
      summary: Optional Cinema startCinemaNative
      responses:
        "200":
          description: Current transaction result (no client or grant secrets)
  /auth/cinema/native/result:
    post:
      operationId: finishCinemaNative
      summary: Optional Cinema finishCinemaNative
      responses:
        "200":
          description: Current transaction result (no client or grant secrets)
  /auth/cinema/browser:
    get:
      operationId: openCinemaBrowser
      summary: Optional Cinema openCinemaBrowser
      responses:
        "200":
          description: Current transaction result (no client or grant secrets)
  /auth/cinema/callback:
    get:
      operationId: cinemaCallback
      summary: Optional Cinema cinemaCallback
      responses:
        "200":
          description: Current transaction result (no client or grant secrets)
  /auth/me:
    get:
      operationId: getCurrentAccount
      summary: Current local Curator account and sign-in method
      responses:
        "200": { description: Safe account identity; no credentials or library paths. }
        "401": { description: Local account sign-in required. }
  /auth/info:
    get:
      operationId: getHouseholdSignInInfo
      summary: Public sign-in requirements and optional integration availability
      responses:
        "200": { description: Sign-in options without private connection information. }
  /auth/sessions:
    post:
      operationId: createAccountSession
      summary: Sign in locally and issue a separately revocable native device token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 80 }
                password: { type: string, maxLength: 1024 }
                device: { type: string, maxLength: 120 }
      responses:
        "200": { description: Token, safe account and expiry. }
        "401": { description: Bad credentials. }
  /auth/account:
    put:
      operationId: updateOwnAccount
      summary: Update the current local account after password confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "204": { description: Saved; credential changes revoke existing sessions. }
  /auth/invitations/accept:
    post:
      operationId: acceptHouseholdInvitation
      summary: Create an independent Curator account with a single-use household invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, username, password]
              properties:
                token: { type: string }
                username: { type: string, maxLength: 80 }
                displayName: { type: string, maxLength: 100 }
                password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        "201": { description: Safe local member account; sign in to continue. }
        "409": { description: Invitation or username unavailable. }
  /household/accounts:
    get:
      operationId: listHouseholdAccounts
      summary: Local owner account management
      responses:
        "200": { description: Safe local account records. }
  /household/accounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      operationId: updateHouseholdAccount
      summary: Confirm a local owner password and update account role, status or credentials
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "204": { description: Saved; last active owner is preserved atomically. }
  /household/invitations:
    post:
      operationId: createHouseholdInvitation
      summary: Local owner confirms password and creates a seven-day member invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "201": { description: Single-use invitation token and expiry; returned once. }

  /household/catalogue:
    get:
      operationId: searchHouseholdCatalogue
      summary: Member-safe movie or show search
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [movie, series] } }
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200": { description: Bounded safe titles with independent availability; no owner paths, policies or credentials. }
  /household/titles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getHouseholdTitle
      summary: Safe provider title details and regular aired season choices
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [movie, series] } }
      responses:
        "200": { description: Member-safe title preview. }
  /household/discovery/seeds:
    get:
      operationId: householdDiscoverySeeds
      summary: Member-safe library movie and show seeds with fresh availability
      responses:
        "200":
          description: Bounded library catalogue seed page without owner paths or credentials
  /household/discovery/shelf:
    get:
      operationId: householdDiscoveryShelf
      summary: Recommendations or collection from a current library seed
      responses:
        "200":
          description: Safe catalogue results with current library availability
  /household/requests:
    get:
      operationId: listHouseholdRequests
      summary: Household requests and current user's subscription state
      parameters:
        - { name: before, in: query, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        "200": { description: Up to 100 safe requests; owner notes only for their local author. }
    post:
      operationId: submitHouseholdRequest
      summary: Submit or join a request with a server-frozen known-aired scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, tmdbId]
              properties:
                kind: { type: string, enum: [movie, series] }
                tmdbId: { type: integer, format: int64, minimum: 1 }
                seasons: { type: array, maxItems: 20, items: { type: integer, minimum: 1 } }
      responses:
        "201": { description: Safe request and subscription; no acquisition admitted. }
  /household/requests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getHouseholdRequest
      summary: Safe household request detail
      responses:
        "200": { description: Safe request detail with current interest. }
  /household/requests/{id}/join:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: joinHouseholdRequest
      summary: Follow an existing household request without duplicating work
      responses:
        "200": { description: Updated subscription state. }
  /household/requests/{id}/withdraw:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: withdrawHouseholdRequest
      summary: Withdraw only your own pending interest
      responses:
        "200": { description: Updated request; a last pending subscriber withdraws it atomically. }
  /household/requests/{id}/decline:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: declineHouseholdRequest
      summary: Local owner declines a reviewed request and optionally saves a private note
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "204": { description: Declined without acquisition. }
  /household/requests/{id}/note:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      operationId: saveHouseholdRequestNote
      summary: Save a note visible only to the current local owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "204": { description: Private note saved. }

  /household/requests/{id}/review:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: reviewHouseholdRequest
      summary: Local owner's read-only current filesystem and policy review
      parameters:
        - { name: rootId, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: profileId, in: query, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        "200": { description: Current semantic review fingerprint and exact scope counts. }
        "409": { description: Restore or verify the library or review changed identity/scope first. }
  /household/requests/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: approveHouseholdRequest
      summary: Recheck and approve exactly the reviewed missing scope atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint]
              properties:
                fingerprint: { type: string, minLength: 64, maxLength: 64 }
                rootId: { type: integer, format: int64 }
                profileId: { type: integer, format: int64 }
                privateNote: { type: string, maxLength: 2000 }
                reacquire: { type: boolean }
      responses:
        "204": { description: Durable approved intent or already-fulfilled scope; no broad search-on-add. }
        "409": { description: Review changed facts or overlapping scope before approval. }

  /auth/logout:
    post:
      operationId: logout
      summary: Clear the session
      responses:
        "204": { description: Session cleared. }

  /notifiers:
    get:
      operationId: listNotifiers
      summary: List notification targets
      responses:
        "200":
          description: Notifiers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notifier"
    post:
      operationId: addNotifier
      summary: Add a notification target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifierInput"
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notifier"
        "400":
          description: Invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /notifiers/test:
    post:
      operationId: testNotifier
      summary: Send a test notification with an unsaved config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifierInput"
      responses:
        "200":
          description: Delivered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotifierTestResult" }
        "400":
          description: Failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /notifiers/{id}:
    put:
      operationId: updateNotifier
      summary: Replace a notification target in place
      description: >
        Editing used to mean delete-and-recreate, which changed the id — and
        the id is what the delivery log hangs off. Changing a URL should not
        throw away the record of every delivery before it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotifierInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notifier" }
        "404":
          description: Unknown notifier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteNotifier
      summary: Remove a notification target
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }
        "404":
          description: Unknown notifier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /notifiers/{id}/test:
    post:
      operationId: testNotifierByID
      summary: Send a test notification using the SAVED config
      description: >
        The add form's test probes what is typed into its boxes. This probes
        what is stored, which is what actually runs after an import — and the
        two are only the same until somebody edits one of them. Download
        clients and indexers have had a per-row test since the beginning;
        without this, checking a saved notifier meant retyping its settings
        into the add form and trusting you retyped them identically, which
        tests the typing rather than the notifier.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Delivered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotifierTestResult" }
        "400":
          description: Failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown notifier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /notifiers/{id}/deliveries:
    get:
      operationId: listDeliveries
      summary: This notifier's recent deliveries, newest first
      description: >
        Media-server notifications are queued and retried, so "did it
        arrive?" has an answer that outlives the log buffer. Successes carry
        what the far side said; failures carry why, and how many attempts it
        took to give up.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Deliveries (last 100).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Delivery" }

  /notifiers/{id}/deliveries/retry:
    post:
      operationId: retryFailedDeliveries
      summary: Put every failed delivery of this notifier back on the queue
      description: >
        A delivery is marked failed after its retry schedule (5 s, 30 s, 2 m)
        runs out, which is tuned for a restart, not for a media server that
        is refusing work for a day. Once the far side is healthy again this
        requeues everything that gave up, due now, with a fresh schedule.
        Only failed rows are touched; pending and delivered ones are left
        alone. Zero requeued is a normal answer, not an error. Rows that
        failed permanently (a rejected key, a path outside plurx's roots)
        are requeued too and fail again on their first attempt: the row
        cannot tell them apart, and the operator pressing this has usually
        just fixed the thing that made them fail.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: How many deliveries were requeued.
          content:
            application/json:
              schema:
                type: object
                required: [requeued]
                properties:
                  requeued: { type: integer, format: int64 }
        "404":
          description: Unknown notifier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            The notifier is disabled. A disabled notifier does not fire on
            an import, so it does not fire on request either.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /notifiers/{id}/deliveries/{deliveryId}/retry:
    post:
      operationId: retryDelivery
      summary: Put one failed delivery back on the queue
      description: >
        The single-row form of `retryFailedDeliveries`. The row goes back to
        pending, due now, with its attempt count reset so the full schedule
        runs again; its last error stays visible until the next attempt
        replaces it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: deliveryId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The requeued delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "404":
          description: >
            No such notifier, or no failed delivery with that id under it —
            a pending or delivered row has nothing to retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The notifier is disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /webhooks/plurx:
    post:
      operationId: plurxWebhook
      summary: Receive a watch-state notification from plurx
      description: >
        The one thing another application tells Monarr to record (master plan
        §11.1). Matched by external id only — never by title — so a
        notification for something Monarr does not have is accepted and
        ignored rather than guessed at. `watched` records and nothing more.
        `reacquire` is the one acting event: an admin in plurx asked for an
        offloaded title back, so Monarr clears offloaded inside the scope and
        searches (ADR 0028); `reacquire_status` reads where that stands. Both
        answer `{matched, mediaItemId, state}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlurxWatchedEvent" }
      responses:
        "200":
          description: >
            Accepted. `matched` is false when Monarr does not have the item —
            not an error, and deliberately not a 404: the sender should not
            retry something that will never match.
          content:
            application/json:
              schema:
                type: object
                required: [matched]
                properties:
                  matched: { type: boolean }
                  mediaItemId: { type: integer, format: int64 }
                  state:
                    type: string
                    enum: [searching, downloading, importing, on_disk, not_offloaded, offloading, offloaded, not_found]
                    description: >
                      reacquire and reacquire_status only. `offloading`: an Offload of
                      that scope is running (deleting or stopping), nothing came back
                      yet. `offloaded`: still offloaded and the Re-acquire has not started
                      (a status read, or the title was busy; ask again).
                  message: { type: string }
        "400":
          description: Unusable payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /system/transfers:
    get:
      operationId: listTransfers
      summary: What is moving right now, and between which applications
      description: >
        The data plane, reported separately from the control plane on
        purpose. /system/connections answers "can Monarr still talk to these
        applications"; this answers "is anything actually moving". Conflating
        them is how a 20 GB import — which held the queue poll open for
        seventeen minutes — got reported as a degraded download client, while
        being visible nowhere else at all.
      responses:
        "200":
          description: Everything in flight, longest-running first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Transfer" }

  /system/pipeline:
    get:
      operationId: pipelineSummary
      summary: How long the pipeline's seams take, and whether anything is overdue
      description: >
        Last-24-hour p50/p95 of the three seams between Runner, Curator and
        Cinema (pipeline contract section 3.5), read from the pipeline_timings
        table, with the count of timings still waiting and of downloads that
        have outlived their state's allowance. A seam that is not measured yet
        says so instead of reporting a number.
      responses:
        "200":
          description: One entry per seam, in pipeline order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineSummary" }

  /system/connections:
    get:
      operationId: getConnections
      summary: The other applications Monarr talks to, and whether they are talking back
      description: >
        One row per remote application, assembled from the last health probe,
        the push supervisor's live state, and the queue poll's contact clock.
        This is the screen that answers "are the three apps actually talking
        right now". URLs are redacted.
      responses:
        "200":
          description: Connections.
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  checkedAt:
                    type: integer
                    format: int64
                    description: When the last probe ran (epoch ms); absent if none has.
                  connections:
                    type: array
                    items: { $ref: "#/components/schemas/Connection" }

  /system/backups:
    get:
      operationId: listBackups
      summary: On-disk database backups (newest first)
      responses:
        "200":
          description: Backups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BackupInfo"

  /calendar:
    get:
      operationId: getCalendar
      summary: Episodes airing and movies/books released in a date range
      parameters:
        - name: start
          in: query
          required: true
          schema: { type: string }
        - name: end
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Calendar entries, date-ordered.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEntry"

  /wanted:
    get:
      operationId: listWanted
      summary: Everything still wanted (missing or below cutoff)
      responses:
        "200":
          description: Wanted items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WantedItem"

  /wanted/searches:
    post:
      operationId: createWantedSearch
      summary: Search an exact server-owned Wanted scope in the durable queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WantedSearchRequest"
      responses:
        "202":
          description: Accepted, or an identical active run reused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WantedSearchRun" }
        "400":
          description: Invalid discriminated scope or pacing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: The selected item or target does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A different run owns the active slot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WantedSearchConflict" }

  /wanted/searches/{runId}:
    get:
      operationId: getWantedSearch
      summary: Durable progress for one explicit Wanted search
      parameters:
        - $ref: "#/components/parameters/WantedSearchRunId"
      responses:
        "200":
          description: Current progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WantedSearchRun" }
        "404":
          description: Unknown or expired run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /wanted/searches/{runId}/results:
    get:
      operationId: listWantedSearchResults
      summary: Paginated terminal target reports for a Wanted search
      parameters:
        - $ref: "#/components/parameters/WantedSearchRunId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Terminal target reports in accepted order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WantedSearchResultsPage" }
        "404":
          description: Unknown or expired run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /wanted/searches/{runId}/cancel:
    post:
      operationId: cancelWantedSearch
      summary: Stop a Wanted search after its current bounded operation drains
      parameters:
        - $ref: "#/components/parameters/WantedSearchRunId"
      responses:
        "200":
          description: The run was already terminal and is unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WantedSearchRun" }
        "202":
          description: Cancellation persisted; active work is draining.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WantedSearchRun" }
        "404":
          description: Unknown or expired run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /blocklist:
    get:
      operationId: listBlocklist
      summary: Failed releases that will never be re-grabbed
      responses:
        "200":
          description: Blocklist entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlocklistEntry"

  /blocklist/{id}:
    delete:
      operationId: removeBlocklistEntry
      summary: Unblock a release
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }
        "404":
          description: No such record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events:
    get:
      operationId: streamEvents
      summary: Server-sent events
      description: >
        Streams every bus event as SSE `data:` lines. Each message is a JSON
        envelope `{type, ts, payload}` where `type` is the event type (e.g.
        `health.changed`, `task.completed`). Comment lines are sent
        periodically as heartbeats.
      responses:
        "200":
          description: An SSE stream (stays open).
          content:
            text/event-stream:
              schema:
                type: string

components:
  parameters:
    WantedSearchRunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
  schemas:
    DeploymentDrainStatus:
      type: object
      required: [phase, generation, active, elapsedSeconds, work]
      properties:
        phase: { type: string, enum: [accepting, draining, drained, stopping] }
        generation: { type: string }
        startedAt: { type: string, format: date-time }
        elapsedSeconds: { type: number }
        active: { type: integer }
        work:
          type: array
          items:
            type: object
            required: [id, kind, startedAt]
            properties:
              id: { type: integer, format: int64 }
              kind: { type: string }
              startedAt: { type: string, format: date-time }

    DeliveryLifecyclePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeliveryLifecycleReceipt" }
        nextBeforeId: { type: integer, format: int64 }
    ResolveDeliveryImportRequest:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 10000
          items: { type: string, minLength: 1, maxLength: 4096 }
    DeliveryLifecycleReceipt:
      type: object
      required: [receiptId, clientId, downloadId, deliveryId, publicationGeneration, manifestDigest, state, acceptance, manifestFiles, curatorFiles, attemptHistory]
      properties:
        runnerStages:
          type: object
          description: Immutable POST substages from one Runner node clock; excluded from aggregate major-stage totals.
          additionalProperties: true
        lifecycleTiming:
          type: object
          description: Immutable version-1 intervals. Only completed monotonic endpoints in one node boot clock contribute to a known-work union.
          additionalProperties: true
        sourceCopies:
          type: array
          description: Mutable per-copy processing-source cleanup obligations; no local deletion authority.
          items: { type: object, additionalProperties: true }
        receiptId: { type: integer, format: int64 }
        clientId: { type: integer, format: int64 }
        downloadId: { type: integer, format: int64 }
        generationKey: { type: string }
        mediaItemId: { type: integer, format: int64 }
        copyId: { type: integer, format: int64 }
        deliveryId: { type: string }
        publicationGeneration: { type: string }
        manifestDigest: { type: string }
        runnerInstanceId: { type: string }
        jobId: { type: string }
        requestToken: { type: string }
        publicationPath: { type: string }
        mappedPath: { type: string }
        readyAt: { type: string, format: date-time }
        terminalOutcome: { type: string }
        failureStage: { type: string }
        failureCause: { type: string }
        keepSourceOnFailure: { type: boolean }
        state: { type: string }
        acceptance: { type: string }
        consumerReceiptId: { type: string }
        attempts: { type: integer }
        blockedSince: { type: string, format: date-time }
        nextAttemptAt: { type: string, format: date-time }
        error: { type: string }
        manifestFiles:
          type: array
          items:
            type: object
            required: [path, sizeBytes, sha256]
            properties:
              path: { type: string }
              sizeBytes: { type: integer, format: int64 }
              sha256: { type: string }
        sourceFileOutcomes: { type: array, items: { type: object, additionalProperties: true } }
        pendingDeleteRequests:
          type: array
          items:
            type: object
            required: [id, paths]
            properties:
              id: { type: string }
              paths: { type: array, items: { type: string } }
              error: { type: string }
        attemptHistory:
          type: array
          items:
            type: object
            required: [id, stage, attempt, startedAt, result]
            properties:
              id: { type: integer, format: int64 }
              stage: { type: string }
              attempt: { type: integer }
              startedAt: { type: string, format: date-time }
              finishedAt: { type: string, format: date-time }
              result: { type: string }
              error: { type: string }
        sourceCleanup: { type: object, additionalProperties: true }
        sourceCleanupAttempts: { type: integer }
        sourceCleanupBlockedSince: { type: string, format: date-time }
        sourceCleanupNextAttemptAt: { type: string, format: date-time }
        sourceCleanupError: { type: string }
        directoryCleanupState: { type: string }
        directoryCleanupAttempts: { type: integer }
        directoryCleanupBlockedSince: { type: string, format: date-time }
        directoryCleanupNextAttemptAt: { type: string, format: date-time }
        directoryCleanupError: { type: string }
        ownedByClientId: { type: integer, format: int64, description: Read-only duplicate view owned by another configured Runner client. }
        curatorFiles: { type: array, items: { type: object, additionalProperties: true } }
    SystemStatus:
      type: object
      required:
        - appName
        - version
        - commit
        - goVersion
        - os
        - arch
        - startedAt
        - uptimeSeconds
        - dataDir
        - dbSchemaVersion
      properties:
        appName:
          type: string
          example: Monarr
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
        goVersion:
          type: string
        os:
          type: string
        arch:
          type: string
        startedAt:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
          format: int64
        dataDir:
          type: string
        dbSchemaVersion:
          type: integer
          format: int64

    HealthStatus:
      type: string
      enum: [ok, warning, error]

    HealthCheck:
      type: object
      required: [name, status, checkedAt]
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/HealthStatus"
        message:
          type: string
        checkedAt:
          type: string
          format: date-time

    HealthReport:
      type: object
      required: [overall, checks]
      properties:
        overall:
          $ref: "#/components/schemas/HealthStatus"
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"

    TaskState:
      type: object
      required: [name, intervalSeconds, running]
      properties:
        name:
          type: string
        intervalSeconds:
          type: integer
          format: int64
        running:
          type: boolean
        lastRunAt:
          type: string
          format: date-time
        lastDurationMs:
          type: integer
          format: int64
        lastError:
          type: string
        nextRunAt:
          type: string
          format: date-time

    Error:
      type: object
      required: [message]
      properties:
        code:
          type: string
          description: Stable machine-readable classification when available.
        message:
          type: string

    AddAliasRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 256 }
        searchable:
          type: boolean
          default: false

    TitleAlias:
      type: object
      required: [id, title, source, sourceId, language, marketCountry, scope, role, searchable]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        source: { type: string }
        sourceId: { type: string }
        language: { type: string }
        marketCountry: { type: string }
        scope: { type: string, enum: [work, season, unsupported_numbering] }
        role: { type: string, enum: [original, alternate, historical, manual] }
        searchable: { type: boolean }

    CountryEvidence:
      type: object
      required: [code, source, basis]
      properties:
        code: { type: string }
        source: { type: string }
        basis: { type: string }

    IdentitySourceStatus:
      type: object
      required: [source, countries, lastError]
      properties:
        source: { type: string }
        countries:
          type: array
          items: { $ref: "#/components/schemas/CountryEvidence" }
        fetchedAt: { type: string, format: date-time }
        attemptedAt: { type: string, format: date-time }
        retryAfter: { type: string, format: date-time }
        lastError: { type: string }

    MediaKind:
      type: string
      enum: [movie, series, book]

    BookType:
      type: string
      enum: [ebook, audiobook]
      description: >
        A persistent edition medium under the book kind. The quality profile
        chooses formats within this medium and cannot change it (ADR 0018).

    BookEditionSummary:
      type: object
      required: [bookType, monitored, fileCount]
      properties:
        bookType:
          $ref: "#/components/schemas/BookType"
        monitored:
          type: boolean
        fileCount:
          type: integer
          description: Files attributed to this edition, excluding the other edition.

    Rating:
      type: object
      required: [source, value, scale]
      properties:
        source:
          type: string
          description: tmdb | openlibrary | imdb | rt | metacritic
        value:
          type: number
          description: In the source's native scale.
        votes:
          type: integer
        scale:
          type: integer
          description: 10, 5, or 100 — render 94/100 as "94%".

    MediaItemSummary:
      type: object
      required:
        [id, kind, title, year, author, posterPath, monitored, path,
         rating, ratingVotes, ratings, episodeCount, episodeFileCount, fileCount,
         addedAt]
      properties:
        availability: { $ref: "#/components/schemas/Availability" }
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/MediaKind"
        title:
          type: string
        year:
          type: integer
        author:
          type: string
          description: Books only (ADR 0006); empty for movies/series.
        bookType:
          $ref: "#/components/schemas/BookType"
        bookTypes:
          type: array
          items: { $ref: "#/components/schemas/BookType" }
          description: Book editions curated for this work. Empty/absent for movies and series.
        bookEditions:
          type: array
          items: { $ref: "#/components/schemas/BookEditionSummary" }
          description: Per-edition completeness for book library views. Empty/absent for video.
        posterPath:
          type: string
        monitored:
          type: boolean
        offloaded:
          type: boolean
          description: >
            Offloaded (ADR 0028): a movie whose files were deleted on purpose,
            or a show with any offloaded episode (see offloadedEpisodes).
        offloadedEpisodes:
          type: integer
          description: Shows only; the number of offloaded episodes.
        path:
          type: string
        source:
          type: string
          description: >
            Which provider this record came from ("tmdb", "tvmaze",
            "openlibrary"), or "manual" when none did (ADR 0012).
        quality:
          type: string
          description: >
            The WEAKEST quality among the item's files, rendered for display
            ("1080p WEB-DL"); empty when nothing is on disk or no file's
            quality was recorded. Weakest rather than best because that is
            what decides whether the item is still being hunted.
        qualityTarget:
          type: string
          description: The profile's cutoff — the "good enough" point.
        upgrade:
          type: string
          enum: ["", missing, seeking, met, capped]
          description: >
            missing = nothing on disk · seeking = below the cutoff and being
            hunted · met = cutoff reached · capped = below the cutoff with
            upgrades switched off. Empty when it could not be determined.
        upgradeReason:
          type: string
          description: >
            When seeking for a reason the quality target does not explain --
            today the audio-language rule (ADR 0022) -- the reason, server
            rendered: "no English audio on disk (German only)". Empty
            otherwise.
        audioLanguages:
          type: array
          items: { type: string }
          description: >
            Declared audio languages every primary-copy file carries (ADR
            0022), canonical codes. Absent when any file has an untagged
            track or was never measured -- absence is only a fact once every
            track has declared itself.
        rating:
          type: number
          description: Provider-scale community rating (TMDB /10, Open Library /5).
        ratingVotes:
          type: integer
          description: 0 means no rating known.
        ratings:
          type: array
          items: { $ref: "#/components/schemas/Rating" }
          description: All known ratings, labeled by source.
        episodeCount:
          type: integer
          description: Monitored episodes aired to date (series; 0 otherwise).
        episodeFileCount:
          type: integer
          description: Of episodeCount, how many have a file.
        fileCount:
          type: integer
          description: Files on disk for the item (movies/books completeness).
        addedAt:
          type: string
          format: date-time
          description: When the item was added — drives the "recently added" sort.

    ExternalIds:
      type: object
      required: [tmdb]
      properties:
        tmdb:
          type: integer
          format: int64
        imdb:
          type: string
        tvdb:
          type: integer
          format: int64
        isbn13:
          type: string
        olid:
          type: string
          description: Open Library work id, e.g. OL17091839W.
        asin:
          type: string

    EpisodeInfo:
      type: object
      required: [id, seasonNumber, episodeNumber, title, airDate, monitored, hasFile]
      properties:
        id:
          type: integer
          format: int64
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        title:
          type: string
        airDate:
          type: string
        monitored:
          type: boolean
        offloaded:
          type: boolean
          description: Offloaded (ADR 0028); Re-acquire is the way back.
        hasFile:
          type: boolean

    SeasonInfo:
      type: object
      required: [number, monitored, episodes]
      properties:
        number:
          type: integer
        monitored:
          type: boolean
        offloaded:
          type: boolean
          description: Offloaded (ADR 0028); Re-acquire is the way back.
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/EpisodeInfo"

    MediaFileInfo:
      type: object
      required: [id, path, size, episodeIds]
      properties:
        id:
          type: integer
          format: int64
        copyId:
          type: integer
          format: int64
          description: Which quality copy this file belongs to; 0/absent = primary.
        path:
          type: string
        size:
          type: integer
          format: int64
        episodeIds:
          type: array
          items:
            type: integer
            format: int64
        fileGeneration: { type: string }
        sourceGeneration: { type: string }
        sourceTransfer: { type: string }
        sourcePayloadGeneration: { type: string }
        sourceFileGeneration: { type: string }
        sourceGuid: { type: string }
        sourceIndexerId: { type: integer, format: int64 }
        sourceIndexer: { type: string }
        quality:
          type: string
          description: >
            The file's recorded quality, e.g. "WEB-DL 1080p". Empty when the
            file exists but nothing could be determined about it -- which is
            not the same as the file being absent (ADR 0013).
        provenance:
          type: string
          enum: ["", probe, filename, release, manual, failed, implausible]
          description: Where `quality` came from.
        provenanceLabel:
          type: string
          description: The badge text for `provenance` ("measured", "from filename", ...).
        verified:
          type: boolean
          description: >
            Whether the SOURCE half of `quality` is trustworthy enough to
            justify replacing this file (the don't-churn rule, ADR 0013).
        facts:
          type: string
          description: >
            The measured facts as one line, e.g. "1080p · HEVC · HDR10 ·
            TrueHD · 23 Mbps". Empty when the file was never probed.
        implausible:
          type: string
          description: >
            Why this file's own measurements cannot be true, in one sentence
            ready to show. Empty for every file that adds up. When set, the
            file is not counted toward the item being satisfied, so the search
            for a real copy continues.
        sourceRelease:
          type: string
          description: >
            The release that put this file here, when monarr grabbed it.
            Empty for an adopted file -- which is also why there is nothing to
            blocklist for one.
    MediaItemDetail:
      type: object
      required:
        - id
        - kind
        - title
        - year
        - posterPath
        - backdropPath
        - overview
        - author
        - genres
        - status
        - releaseDate
        - runtime
        - rating
        - ratingVotes
        - ratings
        - monitored
        - qualityProfileId
        - downloadPriority
        - downloadPriorityOverride
        - copies
        - path
        - rootFolderId
        - ended
        - ids
        - seasons
        - files
        - addedAt
        - aliases
        - countries
        - identitySources
      properties:
        availability: { $ref: "#/components/schemas/Availability" }
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/MediaKind"
        title:
          type: string
        year:
          type: integer
        author:
          type: string
          description: Books only (ADR 0006); empty for movies/series.
        bookType:
          $ref: "#/components/schemas/BookType"
        bookTypes:
          type: array
          items: { $ref: "#/components/schemas/BookType" }
          description: Book editions curated for this work. The primary remains in bookType for compatibility.
        posterPath:
          type: string
        backdropPath:
          type: string
        source:
          type: string
          description: >
            Which provider this record came from, or "manual" when none did
            (ADR 0012). A manual entry has no metadata to refresh against.
        aliases:
          type: array
          items: { $ref: "#/components/schemas/TitleAlias" }
        countries:
          type: array
          items: { $ref: "#/components/schemas/CountryEvidence" }
        identitySources:
          type: array
          items: { $ref: "#/components/schemas/IdentitySourceStatus" }
        quality:
          type: string
          description: >
            The weakest quality among the primary copy's files ("1080p
            WEB-DL"); empty when nothing is on disk or no quality was
            recorded. Weakest because that is what decides whether the item
            is still being hunted.
        qualityTarget:
          type: string
          description: The profile's cutoff — the "good enough" point.
        upgrade:
          type: string
          enum: ["", missing, seeking, met, capped]
          description: >
            missing = nothing on disk · seeking = below the cutoff and being
            hunted · met = cutoff reached · capped = below the cutoff with
            upgrades switched off.
        upgradeReason:
          type: string
          description: >
            When seeking for a reason the quality target does not explain --
            today the audio-language rule (ADR 0022) -- the reason, server
            rendered: "no English audio on disk (German only)". Empty
            otherwise.
        audioLanguages:
          type: array
          items: { type: string }
          description: >
            Declared audio languages every primary-copy file carries (ADR
            0022), canonical codes. Absent when any file has an untagged
            track or was never measured.
        overview:
          type: string
        genres:
          type: array
          items:
            type: string
        status:
          type: string
        releaseDate:
          type: string
        runtime:
          type: integer
        rating:
          type: number
          description: Provider-scale community rating (TMDB /10, Open Library /5).
        ratingVotes:
          type: integer
          description: 0 means no rating known.
        ratings:
          type: array
          items: { $ref: "#/components/schemas/Rating" }
          description: All known ratings, labeled by source.
        monitor:
          $ref: "#/components/schemas/SeriesMonitorMode"
        monitored:
          type: boolean
        offloaded:
          type: boolean
          description: A movie that is offloaded (ADR 0028). Seasons and episodes carry their own.
        qualityProfileId:
          type: integer
          format: int64
        downloadPriority:
          type: integer
          description: >
            Effective scheduler priority after applying the per-item override
            or inheriting the selected quality profile. Supported values are
            -100, -50, 0, 50, 100, and 900 (force).
        downloadPriorityOverride:
          type: integer
          nullable: true
          description: NULL means inherit downloadPriority from the quality profile.
        copies:
          type: array
          items: { $ref: "#/components/schemas/MediaCopy" }
          description: Additional video quality copies or independently curated book editions.
        path:
          type: string
        rootFolderId:
          type: integer
          format: int64
        ended:
          type: boolean
        ids:
          $ref: "#/components/schemas/ExternalIds"
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/SeasonInfo"
        files:
          type: array
          items:
            $ref: "#/components/schemas/MediaFileInfo"
        addedAt:
          type: string
          format: date-time

    AddMediaRequest:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/MediaKind"
        tmdbId:
          type: integer
          format: int64
          description: Identifies movies/series.
        tvdbId:
          type: integer
          format: int64
          description: >
            Identifies a series that came from the provider chain rather than
            TMDB (ADR 0011). Exactly one of tmdbId / tvdbId / olid identifies
            the item.
        imdbId:
          type: string
          description: Canonical tt-prefixed IMDb title ID used to verify an exact lookup.
        hydrationSource:
          type: string
          description: Provider that supplies and later refreshes this item's episode/movie record.
        olid:
          type: string
          description: Open Library work id — identifies books (ADR 0006).
        bookType:
          $ref: "#/components/schemas/BookType"
        rootFolderId:
          type: integer
          format: int64
        qualityProfileId:
          type: integer
          format: int64
          description: 0/absent = kind default (the matching bookType default for books).
        downloadPriority:
          type: integer
          description: Optional per-item override; absent inherits the quality profile.
        monitored:
          type: boolean
          default: true
        monitor:
          $ref: "#/components/schemas/SeriesMonitorMode"
        searchNow:
          type: boolean
          default: false
          description: >
            Kick an automatic search for the item right after adding
            (Sonarr's "start search for missing" checkbox).

    MediaCopyInput:
      type: object
      required: [qualityProfileId]
      properties:
        bookType:
          $ref: "#/components/schemas/BookType"
          description: Required when adding the other edition to a book; absent for video quality copies.
        qualityProfileId:
          type: integer
          format: int64
        rootFolderId:
          type: integer
          format: int64
          description: Separate folder for the copy; 0/absent = share the item's folder.
        name:
          type: string
          description: Display label, e.g. "720p for dad".
        monitored:
          type: boolean
          default: true

    MediaCopyUpdate:
      type: object
      properties:
        name: { type: string }
        qualityProfileId: { type: integer, format: int64 }
        monitored: { type: boolean }

    MediaCopy:
      type: object
      required: [id, name, qualityProfileId, rootFolderId, path, monitored]
      properties:
        bookType:
          $ref: "#/components/schemas/BookType"
          description: Present for a book edition; absent for video quality copies.
        id: { type: integer, format: int64 }
        name: { type: string }
        qualityProfileId: { type: integer, format: int64 }
        rootFolderId: { type: integer, format: int64 }
        path:
          type: string
          description: The copy's folder; "" = shares the item's folder.
        monitored: { type: boolean }

    SeriesMonitorMode:
      type: string
      enum: [all, latest, future, new_seasons, first_season, none]
      description: >
        Persistent series policy. Applying a mode resets existing selections.
        All selects everything; latest selects the latest and later seasons;
        future selects episodes airing today or later; new_seasons selects
        seasons after the last season started before today; first_season selects only
        the lowest regular season (season 1 when none is known yet) and later seasons
        arrive unmonitored, ready to monitor or Re-acquire; none clears selections.
        Specials start unmonitored. Refresh preserves manual selections.

    MonitorRequest:
      type: object
      required: [monitored]
      properties:
        monitored:
          type: boolean

    UpdateMediaItemRequest:
      type: object
      description: Per-item edit; absent fields are left as they are.
      properties:
        monitor:
          $ref: "#/components/schemas/SeriesMonitorMode"
        monitored:
          type: boolean
        qualityProfileId:
          type: integer
          format: int64
        downloadPriority:
          type: integer
          description: Set a per-item override (-100, -50, 0, 50, 100, or 900).
        inheritDownloadPriority:
          type: boolean
          description: Clear the per-item override and inherit from the quality profile.
        rootFolderId:
          type: integer
          format: int64
          description: Recomputes the item folder; 0 clears the assignment.
        path:
          type: string
          description: Explicit absolute folder; wins over rootFolderId. "" clears it.

    MetadataPreview:
      type: object
      required: [kind, title, overview, ids, ownership, addability]
      properties:
        kind: { $ref: "#/components/schemas/MediaKind" }
        title: { type: string }
        year: { type: integer }
        author: { type: string }
        overview: { type: string }
        posterPath: { type: string }
        previewSource: { type: string }
        ids:
          type: object
          properties:
            tmdb: { type: integer, format: int64 }
            tvdb: { type: integer, format: int64 }
            imdb: { type: string }
            olid: { type: string }
        genres:
          type: array
          items: { type: string }
        status: { type: string }
        runtimeMinutes: { type: integer }
        ownership:
          type: string
          enum: [absent, present, ambiguous, unknown]
        libraryItemId: { type: integer, format: int64 }
        bookTypes:
          type: array
          items: { $ref: "#/components/schemas/BookType" }
        addability:
          type: string
          enum: [supported, unsupported, conflict]
        addBlockReason: { type: string }

    LibraryVolumeReview:
      type: object
      required: [state, observedIdentity, empty, fingerprint]
      properties:
        state: { $ref: '#/components/schemas/LibraryVolumeState' }
        observedIdentity: { type: string }
        empty: { type: boolean }
        blocker: { type: string }
        fingerprint: { type: string }
    LibraryVolumeState:
      type: object
      required: [rootId, path, expectedIdentity, generation, sharedRevision, libraryRevision, fileRecords, activeWork]
      properties:
        rootId: { type: integer, format: int64 }
        path: { type: string }
        expectedIdentity: { type: string }
        generation: { type: integer, format: int64 }
        sharedRevision: { type: integer, format: int64 }
        libraryRevision: { type: integer, format: int64 }
        fileRecords: { type: integer }
        activeWork: { type: integer }
    AvailabilityTarget:
      type: object
      required: [kind]
      properties:
        libraryItemId: { type: integer, format: int64 }
        kind: { $ref: '#/components/schemas/MediaKind' }
        tmdbId: { type: integer, format: int64 }
        tvdbId: { type: integer, format: int64 }
        imdbId: { type: string }
        olid: { type: string }
        isbn13: { type: string }
        asin: { type: string }
    Availability:
      type: object
      required: [catalog, presence, copyId, expected, present, offloaded, acquisition]
      description: Read-only primary-copy facts, independent of requests and playback readiness. Series counts cover known aired regular episodes. First-run, failed, changed or older-than-13h observations are unknown.
      properties:
        catalog: { type: string, enum: [present, absent, ambiguous, unknown] }
        presence: { type: string, enum: [present, partial, missing, offloaded, unknown] }
        libraryItemId: { type: integer, format: int64 }
        copyId: { type: integer, format: int64 }
        expected: { type: integer }
        present: { type: integer }
        offloaded: { type: integer }
        acquisition: { type: string, enum: [none, active, unknown] }
        checkedAt: { type: string, format: date-time }
        reason: { type: string }
        seasons:
          type: array
          items: { $ref: '#/components/schemas/SeasonAvailability' }
    SeasonAvailability:
      type: object
      required: [number, expected, present, offloaded, unknownDates]
      properties:
        number: { type: integer }
        expected: { type: integer }
        present: { type: integer }
        offloaded: { type: integer }
        unknownDates: { type: integer }
    SearchResult:
      type: object
      required: [kind, tmdbId, title, year, overview, posterPath, inLibrary]
      properties:
        availability: { $ref: "#/components/schemas/Availability" }
        kind:
          $ref: "#/components/schemas/MediaKind"
        tmdbId:
          type: integer
          format: int64
        tvdbId:
          type: integer
          format: int64
          description: >
            Set for a series the provider chain supplied (ADR 0011); such a
            result has no tmdbId.
        imdbId:
          type: string
        hydrationSource:
          type: string
          description: Provider selected to hydrate and later refresh this result.
        source:
          type: string
          description: Which provider produced it ("tmdb", "tvmaze").
        olid:
          type: string
          description: Present for book results (ADR 0006).
        author:
          type: string
        title:
          type: string
        year:
          type: integer
        overview:
          type: string
        posterPath:
          type: string
        inLibrary:
          type: boolean
        bookTypes:
          type: array
          items: { $ref: "#/components/schemas/BookType" }
          description: Which editions of this Open Library work are already curated.

    DiscoverList:
      type: object
      description: >
        One browse row on offer. Metadata about the row, not its contents —
        the contents come from /discover/items, which is where the cost is.
      required: [id, title, blurb, kind, source]
      properties:
        id:
          type: string
          description: Stable slug, unique across providers ("tmdb-trending-movies").
        title:
          type: string
          description: The row heading, e.g. "Trending this week".
        blurb:
          type: string
          description: >
            One line saying what the row actually measures. "Trending" means
            something different at each provider - TMDB counts lookups, Trakt
            counts playback - so a row without this is a ranking nobody can
            interpret.
        kind:
          $ref: "#/components/schemas/MediaKind"
        source:
          type: string
          description: Which provider publishes it ("tmdb", "trakt").

    RootKind:
      type: string
      description: >
        What a root folder holds (ADR 0009). "mixed" means the kind is not
        known, so adoption asks instead of assuming — the behaviour every
        root had before kinds existed.
      enum: [movie, series, book, mixed]

    RootFolder:
      type: object
      required: [id, path, kind, freeBytes, accessible]
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
        kind:
          $ref: "#/components/schemas/RootKind"
        autoAdopt:
          type: boolean
          description: >
            Adoption applies matches into this root without asking. Off
            until the first pass has been reviewed and confirmed.
        freeBytes:
          type: integer
          format: int64
        accessible:
          type: boolean

    UnmatchedDir:
      type: object
      required: [rootFolderId, path, name]
      properties:
        rootFolderId:
          type: integer
          format: int64
        path:
          type: string
        name:
          type: string

    ScanStatus:
      type: object
      required: [state]
      properties:
        id: { type: integer, format: int64 }
        requestedAt:
          type: string
          format: date-time
          description: Earliest timestamp for a report belonging to this scan.
        state:
          type: string
          enum: [idle, queued, running, completed, failed]
        attempts: { type: integer, format: int64 }
        error: { type: string }

    ScanReport:
      type: object
      required:
        - scannedAt
        - rootsScanned
        - itemsScanned
        - filesLinked
        - filesRemoved
        - unmatchedDirs
        - missingPaths
      properties:
        scannedAt:
          type: string
          format: date-time
        rootsScanned:
          type: integer
        itemsScanned:
          type: integer
        filesLinked:
          type: integer
        filesRemoved:
          type: integer
        skippedDirs:
          type: integer
          description: Directories excluded by a skip pattern (counted, not listed).
        ignoredDirs:
          type: integer
          description: Directories the user has dismissed (counted, not listed).
        unmatchedTotal:
          type: integer
          description: >
            True number of unmatched folders. unmatchedDirs may be a capped
            prefix of these; the full list is at /library/review.
        unmatchedDirs:
          type: array
          items:
            $ref: "#/components/schemas/UnmatchedDir"
        missingPaths:
          type: array
          items:
            type: string
        missingItems:
          type: array
          description: >
            Unavailable folders with previously recorded media files, with identity
            and reason for repair. Uncreated destinations awaiting a first download
            are excluded.
          items:
            $ref: "#/components/schemas/MissingItem"

    DirEntry:
      type: object
      required: [name, path, registered]
      properties:
        name:
          type: string
        path:
          type: string
        registered:
          type: boolean
          description: Already a registered root folder.

    BrowseResult:
      type: object
      required: [path, parent, dirs]
      properties:
        path:
          type: string
        parent:
          type: string
          description: Empty at the filesystem root.
        dirs:
          type: array
          items:
            $ref: "#/components/schemas/DirEntry"

    AdoptionCandidate:
      type: object
      required: [kind, tmdbId, title, year]
      properties:
        kind:
          $ref: "#/components/schemas/MediaKind"
        tmdbId:
          type: integer
          format: int64
        tvdbId:
          type: integer
          format: int64
          description: >
            Set for a series identified through the provider chain (ADR 0011)
            rather than by TMDB. Exactly one of tmdbId / tvdbId / olid
            identifies a candidate.
        source:
          type: string
          description: >
            Which provider produced this candidate ("tmdb", "tvmaze"). For
            display only — identity is the ids.
        olid:
          type: string
        author:
          type: string
        title:
          type: string
        altTitles:
          type: array
          description: >
            Other names this work is released under that the folder's name
            actually matches — usually absent. Present so a row can say why
            "Cunk on Life" is offered for a folder called "Cunk's Quest for
            Meaning": they are the same film.
          items:
            type: string
        year:
          type: integer
        overview:
          type: string
        posterPath:
          type: string

    # heldBy / sharedWith describe the umbrella case: a provider that files a
    # whole franchise under one title lists every part of it among that title's
    # alternate names, so several folders answer to one entry and only the first
    # can have it.
    Proposal:
      type: object
      required: [rootFolderId, path, name, parsedTitle, parsedYear, confidence, candidates]
      properties:
        rootFolderId:
          type: integer
          format: int64
        path:
          type: string
        name:
          type: string
        parsedTitle:
          type: string
        parsedYear:
          type: integer
        kind:
          $ref: "#/components/schemas/MediaKind"
        confidence:
          type: string
          enum: [exact, ambiguous, none]
          description: >
            exact clears the per-kind bar and may be adopted without asking;
            anything else goes to review. There is deliberately no
            "probably".
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/AdoptionCandidate"
        heldBy:
          type: string
          description: >
            The folder that already holds the leading candidate, when that
            candidate answers to this folder only through an alternate title.
            Present so the row can say so before the user clicks a chip that
            looks right and reads a conflict error afterwards.
        sharedWith:
          type: array
          description: >
            Other folders in this review batch whose leading candidate is the
            same entry by the same alternate-title route.
          items:
            type: string

    ReviewCounts:
      type: object
      required: [total, ambiguous, none, movie, series, book, unknown]
      properties:
        total:
          type: integer
        ambiguous:
          type: integer
        none:
          type: integer
        movie:
          type: integer
        series:
          type: integer
        book:
          type: integer
        unknown:
          type: integer
          description: Entries from mixed roots, where no kind was resolved.

    ReviewPage:
      type: object
      required: [items, total, offset, limit, counts]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Proposal"
        total:
          type: integer
          description: Entries matching the filter.
        offset:
          type: integer
        limit:
          type: integer
        counts:
          $ref: "#/components/schemas/ReviewCounts"

    AdoptResult:
      type: object
      required: [adopted, review, failures]
      properties:
        adopted:
          type: array
          items:
            $ref: "#/components/schemas/Proposal"
        review:
          type: array
          items:
            $ref: "#/components/schemas/Proposal"
        failures:
          type: array
          items:
            type: string

    MissingItem:
      type: object
      required: [id, kind, title, path]
      properties:
        reason:
          type: string
          enum: [missing, inaccessible, not_directory]
          description: Why the folder holding previously recorded files is unavailable.
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/MediaKind"
        title:
          type: string
        path:
          type: string

    IgnoredPath:
      type: object
      required: [path, reason, ignoredAt]
      properties:
        path:
          type: string
        reason:
          type: string
        ignoredAt:
          type: string
          format: date-time

    Quality:
      type: object
      required: [source, resolution, display]
      properties:
        source:
          type: string
          description: webdl | bluray | remux | hdtv | ... or a book format (epub, m4b, ...).
        resolution:
          type: integer
          description: 480 | 720 | 1080 | 2160; 0 for books and unknown.
        display:
          type: string
          description: Human rendering, e.g. "WEB-DL 1080p".

    QualityProfile:
      type: object
      required: [id, name, target, upgradesAllowed, downloadPriority, sentence]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        target:
          $ref: "#/components/schemas/Quality"
        floor:
          $ref: "#/components/schemas/Quality"
        upgradesAllowed: { type: boolean }
        downloadPriority:
          type: integer
          description: Default scheduler priority for items that inherit from this profile.
        audioLanguages:
          type: array
          items: { type: string }
          description: >
            Required audio languages (ADR 0022), canonical ISO 639-1 codes. A
            file must carry at least one of them on an audio track or the
            item stays wanted at any quality; a release whose name advertises
            none of them is refused. Empty means no requirement.
        sentence:
          type: string
          description: >
            The profile rendered as the one true sentence it now is -- "hunts
            the best release up to WEB-DL 1080p, then stops". Server-rendered
            so every client says exactly the same thing about a profile.
        inUse:
          type: integer
          description: >
            How many items, copies and import lists reference this profile.
            Non-zero means DELETE will be refused with 409.

    QualityInput:
      type: object
      required: [source]
      properties:
        source: { type: string }
        resolution: { type: integer, default: 0 }

    ProfileInput:
      type: object
      required: [name, target]
      properties:
        name: { type: string }
        target:
          $ref: "#/components/schemas/QualityInput"
        floor:
          $ref: "#/components/schemas/QualityInput"
        upgradesAllowed: { type: boolean, default: true }
        downloadPriority:
          type: integer
          default: 0
          description: One of -100, -50, 0, 50, 100, or 900 (force).
        audioLanguages:
          type: array
          items: { type: string }
          description: >
            Required audio languages, any one of which satisfies (ADR 0022).
            Codes from GET /languages. Omit or send empty for no requirement.

    LanguageOption:
      type: object
      required: [code, name]
      properties:
        code: { type: string, description: Canonical ISO 639-1 code ("en"). }
        name: { type: string, description: Display name ("English"). }

    IndexerInput:
      type: object
      required: [name, url, protocol]
      properties:
        name: { type: string }
        url: { type: string }
        apiKey: { type: string }
        protocol: { type: string, enum: [torrent, usenet] }
        categories:
          type: array
          items: { type: integer }
        dailyRequestCap:
          type: integer
          minimum: 0
          default: 0
          description: Local API-call allowance per rolling day; zero means unlimited. Provider retry delays still apply.
        enabled: { type: boolean, default: true }

    Indexer:
      allOf:
        - $ref: "#/components/schemas/IndexerInput"
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }

    PathMapping:
      type: object
      required: [remote, local]
      properties:
        remote:
          type: string
          description: Path prefix as the download client reports it.
        local:
          type: string
          description: Same location as Monarr sees it.

    DownloadClientInput:
      type: object
      required: [type, name, url]
      properties:
        type: { type: string, enum: [qbittorrent, sabnzbd, transmission, deluge, nzbget, nzbd, runner-torrent] }
        name: { type: string }
        url: { type: string }
        username: { type: string }
        password: { type: string }
        category: { type: string, default: monarr }
        enabled: { type: boolean, default: true }
        manualApproval:
          type: boolean
          default: false
          description: >
            Hold a completed download at 'awaiting_import' until you approve
            it, instead of importing automatically.
        removeCompleted:
          type: boolean
          description: >
            Delete the payload from this client once Monarr has imported it.


            Off means every grab leaves a second full copy behind, and when the
            client's disk and the library are different filesystems -- the
            normal arrangement -- that copy is real bytes rather than a
            hardlink. Deleting is safe either way: a hard-linked import keeps
            the library's copy, because removing one name for an inode does not
            touch the other.


            Defaults on for usenet clients, which have no obligation once the
            download is done, and off for torrent clients, which are still
            seeding and which Monarr cannot yet tell "finished seeding" from
            "seeding happily".
        mode:
          type: string
          enum: [poll, push]
          default: poll
          description: >
            How Monarr learns this client's state. 'poll' asks every 30
            seconds. 'push' additionally holds the client's event stream
            open, so a finished download is acted on when it finishes
            rather than up to a poll interval later — currently only the
            native nzbd client can stream. Push never replaces the poll,
            so a stream that dies quietly costs latency, not correctness.
        pathMappings:
          type: array
          items: { $ref: "#/components/schemas/PathMapping" }
          description: >
            Remote path mappings: when the client runs on another host or
            container, rewrite the completed-download path it reports into
            the path Monarr sees the same files at.

    DownloadClientConfig:
      allOf:
        - $ref: "#/components/schemas/DownloadClientInput"
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }

    Rejection:
      type: object
      required: [code, reason]
      properties:
        code: { type: string }
        reason: { type: string }

    MatchEvidence:
      type: object
      required: [version, matched, reason]
      properties:
        version: { type: integer }
        matched: { type: boolean }
        method: { type: string }
        code: { type: string }
        reason: { type: string }
        originalTitle: { type: string }
        parsedTitle: { type: string }
        targetTitle: { type: string }
        matchedTitle: { type: string }
        matchedId:
          type: object
          required: [provider, value]
          properties:
            provider: { type: string }
            value: { type: string }
        country: { type: string }
        warnings:
          type: array
          items: { type: string }

    ReleaseCandidate:
      type: object
      required: [title, downloadUrl, indexer, protocol, size, seeders, age, quality, score, accepted, isUpgrade, rejections, match, candidateToken]
      properties:
        title: { type: string }
        downloadUrl: { type: string }
        infoUrl: { type: string }
        indexer: { type: string }
        protocol: { type: string }
        size: { type: integer, format: int64 }
        seeders: { type: integer }
        age: { type: string }
        quality: { type: string }
        languages:
          type: array
          items: { type: string }
          description: >
            Audio languages the release name advertises (ADR 0022), canonical
            codes; "mul" for a MULTi/DUAL release. A name that says nothing
            reads as English, the scene convention.
        score:
          type: integer
          description: Custom-format score sum (Phase 5).
        formats:
          type: array
          items: { type: string }
          description: Names of matched custom formats.
        accepted: { type: boolean }
        isUpgrade: { type: boolean }
        rejections:
          type: array
          items: { $ref: "#/components/schemas/Rejection" }
        match:
          $ref: "#/components/schemas/MatchEvidence"
        candidateToken:
          type: string
          description: Opaque short-lived server proof binding this row to its displayed match evidence.
        warning:
          type: string
          description: >
            A caution that does not decline the release: the profile would take
            it, but something does not add up. Today that means an advertised
            size too small to hold what the name claims.
        blacklistReason:
          type: string
          description: Exact blocklist reason; Download anyway applies only to this manual request.

    ReplacementObservationRequest:
      type: object
      required: [requestId, fileGeneration]
      properties:
        requestId: { type: string }
        fileGeneration: { type: string }

    ReplacementObservation:
      type: object
      required: [observationId, requestId, state, fileGeneration]
      properties:
        observationId: { type: string }
        requestId: { type: string }
        state: { type: string }
        fileGeneration: { type: string }
        sourceGeneration: { type: string }
        sha256: { type: string }
        size: { type: integer, format: int64 }
        error: { type: string }

    LibraryFileReportRequest:
      type: object
      required: [fileGeneration, reasonCode, reason]
      properties:
        fileGeneration: { type: string }
        reasonCode: { type: string }
        reason: { type: string }
        evidence: { type: object, additionalProperties: true }

    ReplacementRequest:
      type: object
      required: [requestId, scope, copyId, sourceFileId, intent, blacklistSourceRelease, reasonCode, reason, observedFiles]
      properties:
        requestId: { type: string }
        sourceGeneration: { type: string }
        sourceTransfer: { type: string }
        scope: { type: string, enum: [episodes, download] }
        copyId: { type: integer, format: int64 }
        sourceFileId: { type: integer, format: int64 }
        episodeIds:
          type: array
          items: { type: integer, format: int64 }
        intent: { type: string, enum: [replace_bad, replace_quality] }
        blacklistSourceRelease: { type: boolean }
        reasonCode: { type: string }
        reason: { type: string }
        observedFiles:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, fileGeneration, observationId]
            properties:
              id: { type: integer, format: int64 }
              fileGeneration: { type: string }
              observationId: { type: string }

    ReplacementOperation:
      type: object
      required: [operationId, requestId, state, intent, scope, blacklistSourceRelease]
      properties:
        operationId: { type: string }
        requestId: { type: string }
        state: { type: string }
        intent: { type: string }
        scope: { type: string }
        blacklistSourceRelease:
          type: boolean
          description: The exact blacklist choice saved with this operation; never inferred from current blacklist state.
        mediaItemId: { type: integer, format: int64 }
        copyId: { type: integer, format: int64 }
        sourceGeneration: { type: string }
        sourceTransfer: { type: string }
        sourceRelease: { type: string }
        sourceGuid: { type: string }
        sourceIndexerId: { type: integer, format: int64 }
        episodeIds:
          type: array
          items: { type: integer, format: int64 }
        lastError: { type: string }
        retryAttempts: { type: integer }
        blockedSince: { type: string, format: date-time }
        nextAttemptAt: { type: string, format: date-time }
        blockedWarning: { type: boolean }
        files:
          type: array
          items:
            type: object
            additionalProperties: true

    LibraryLifecycleReview:
      type: object
      required: [operations, openReports]
      properties:
        operations:
          type: array
          items: { $ref: "#/components/schemas/ReplacementOperation" }
        openReports:
          type: array
          items: { $ref: "#/components/schemas/LibraryReviewFlag" }

    LibraryReviewFlag:
      type: object
      required: [id, mediaItemId, mediaFileId, fileGeneration, reasonCode, reason, state, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        mediaItemId: { type: integer, format: int64 }
        mediaFileId: { type: integer, format: int64 }
        fileGeneration: { type: string }
        reasonCode: { type: string }
        reason: { type: string }
        state: { type: string, enum: [open] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RemoveFileResult:
      type: object
      required: [path, deletedFromDisk, searched]
      properties:
        path: { type: string }
        deletedFromDisk: { type: boolean }
        blocklisted:
          type: string
          description: The release title that was blocklisted; empty if none was.
        searched: { type: boolean }
        note:
          type: string
          description: >
            The one thing that did not work out, in plain terms -- most often
            that monarr did not grab this file so there was nothing to
            blocklist. Not an error: the deletion still happened.

    GrabRequest:
      type: object
      required: [mediaItemId, title, downloadUrl, protocol, intent, requestId]
      properties:
        mediaItemId: { type: integer, format: int64 }
        copyId:
          type: integer
          format: int64
          description: Additional quality copy or book edition; absent/0 selects the primary target.
        season: { type: integer }
        episode: { type: integer }
        title: { type: string }
        downloadUrl: { type: string }
        indexer: { type: string }
        protocol: { type: string }
        size: { type: integer, format: int64 }
        candidateToken:
          type: string
          description: Opaque token returned by Release Search. Absent means an explicit manual override.
        intent:
          type: string
          enum: [additional_copy]
          description: Manual acquisition always creates an independent additional copy.
        requestId:
          type: string
          description: Stable idempotency key for one deliberate manual Grab action.
        downloadAnyway:
          type: boolean
          description: One-request override for an existing automatic blacklist entry; it does not remove the entry.

    ScannedFile:
      type: object
      required: [path, name, size, kind, quality, season, episodes]
      properties:
        path: { type: string }
        name: { type: string }
        size: { type: integer, format: int64 }
        kind: { type: string, description: "video | book" }
        quality: { type: string }
        season: { type: integer, description: "-1 when not a series file" }
        episodes:
          type: array
          items: { type: integer }
        snapshotIdentity:
          type: string
          description: Stable preview snapshot token used to detect changed files before explicit legacy review import.
        subtitles:
          type: integer
          description: Subtitle files that travel with this video (depth=1 only).
        publication: { $ref: "#/components/schemas/ScannedPublication" }
        skipped:
          type: string
          description: Why this entry cannot be imported (a symlink, an unreadable file); depth=1 only.

    ScannedPublication:
      type: object
      description: The runner delivery a scanned file is part of. Such a file is placed through Resolve, never through /import/manual.
      required: [downloadId, publicationId, path, outcome]
      properties:
        downloadId: { type: integer, format: int64 }
        publicationId: { type: integer, format: int64 }
        path: { type: string, description: The file's path relative to the publication. }
        outcome: { type: string, description: "The file's recorded outcome; empty when the manifest does not name it." }

    EpisodeTarget:
      type: object
      required: [path, season, episodes]
      properties:
        path: { type: string, description: Absolute path of one selected file. }
        season: { type: integer }
        episodes:
          type: array
          minItems: 1
          items: { type: integer }

    ImportPlanRequest:
      type: object
      required: [mediaItemId, files]
      properties:
        mediaItemId: { type: integer, format: int64 }
        copyId: { type: integer, format: int64, description: Target copy or edition; 0 = the primary. }
        removeOriginal: { type: boolean }
        files:
          type: array
          minItems: 1
          items:
            type: object
            required: [path]
            properties:
              path: { type: string }
              season: { type: integer }
              episodes:
                type: array
                items: { type: integer }

    ImportPlanFile:
      type: object
      required: [path, quality, season, episodes, subtitles]
      properties:
        path: { type: string }
        quality: { type: string }
        season: { type: integer, description: "-1 when not a series file" }
        episodes:
          type: array
          items: { type: integer }
        destination: { type: string, description: Exact library path from the naming template. }
        action: { type: string, description: "new | replace | beside" }
        existing: { type: string, description: Quality of the file there now. }
        reason: { type: string }
        mode: { type: string, description: "runner | hardlink | copy | rename | copy_remove" }
        note: { type: string, description: What else placing it does (a runner delivery moved here from another title). }
        subtitles: { type: integer }
        publication: { $ref: "#/components/schemas/ScannedPublication" }
        error: { type: string, description: Why this file cannot be imported as chosen. }

    ImportPathDefault:
      type: object
      required: [path]
      properties:
        path: { type: string }

    ItemStatus:
      type: object
      required: [mediaItemId, kind, generatedAt, active, done, headline]
      properties:
        mediaItemId: { type: integer, format: int64 }
        kind: { type: string }
        generatedAt: { type: integer, format: int64, description: Unix ms. }
        active: { type: boolean, description: A download is moving; poll every 2 s. }
        done: { type: boolean, description: Every stage is done; the panel collapses to one line. }
        headline: { $ref: "#/components/schemas/StatusHeadline" }
        stages:
          type: array
          items: { $ref: "#/components/schemas/StatusStage" }
        download: { $ref: "#/components/schemas/StatusDownload" }
        cinema: { $ref: "#/components/schemas/StatusCinema" }
        attempts:
          type: array
          items: { $ref: "#/components/schemas/StatusAttempt" }
        seasons:
          type: array
          items: { $ref: "#/components/schemas/StatusSeason" }
        episodes:
          type: array
          items: { $ref: "#/components/schemas/StatusEpisode" }
        rematch: { $ref: "#/components/schemas/StatusRematch" }
        offload: { $ref: "#/components/schemas/StatusOffload" }

    StatusOffload:
      type: object
      description: >
        The open Offload deleting this title's files (the panel's "Offloading
        files" block), and once it is over its final stage "Offloaded <date> ·
        <bytes> freed" until dismissed. Stop is POST /offload/{operationId}/cancel,
        dismiss POST /offload/{operationId}/dismiss.
      required: [operationId, state, scope, label, headline, filesDone, filesTotal, bytesTotal, bytesFreed, ended, stoppable]
      properties:
        operationId: { type: string }
        state: { type: string, enum: [deleting, waiting, retrying, stopping, complete, cancelled, failed] }
        scope: { type: string, enum: [item, season, episode] }
        label: { type: string }
        headline: { type: string }
        filesDone: { type: integer }
        filesTotal: { type: integer }
        bytesTotal: { type: integer, format: int64 }
        bytesFreed: { type: integer, format: int64 }
        failed: { type: array, items: { type: string } }
        error: { type: string, description: The plain reason it is waiting or retrying. }
        cinemaLine: { type: string }
        cinema:
          type: array
          items:
            type: object
            properties:
              directory: { type: string }
              status: { type: string }
              result: { type: string }
              lastError: { type: string }
              visibleAt: { type: integer, format: int64 }
        ended: { type: boolean }
        stoppable: { type: boolean }
        finishedAt: { type: integer, format: int64 }

    StatusRematch:
      type: object
      description: >
        The open Re-match moving files out of or into this item (the panel's
        "Moving files" block). Stop is POST /rematch/{operationId}/cancel.
      required: [operationId, state, ended, role, sourceItemId, targetItemId, sourceTitle, targetTitle, headline, bytesDone, bytesTotal, filesDone, filesTotal, stoppable]
      properties:
        operationId: { type: string }
        state: { type: string, enum: [planned, moving, moved, committed, cancel_pending, complete, cancelled, failed] }
        ended: { type: boolean, description: The operation is over (failed, or complete with files that could not move); shown 24 h or until dismissed. }
        failedMoves:
          type: array
          items:
            type: object
            required: [from, reason]
            properties:
              from: { type: string }
              reason: { type: string }
        role: { type: string, enum: [source, target], description: Which side of the move this item is. }
        sourceItemId: { type: integer, format: int64 }
        targetItemId: { type: integer, format: int64 }
        sourceTitle: { type: string }
        targetTitle: { type: string }
        headline: { type: string, description: "For this item's side, e.g. Files moving here from Dune (1984)." }
        bytesDone: { type: integer, format: int64 }
        bytesTotal: { type: integer, format: int64 }
        filesDone: { type: integer }
        filesTotal: { type: integer }
        moves:
          type: array
          items:
            type: object
            required: [from, to, state, bytes]
            properties:
              from: { type: string }
              to: { type: string }
              state: { type: string }
              bytes: { type: integer, format: int64 }
        cinema:
          type: array
          items:
            type: object
            required: [directory, status]
            properties:
              directory: { type: string }
              status: { type: string }
              result: { type: string }
              lastError: { type: string }
              visibleAt: { type: integer, format: int64 }
        cinemaLine: { type: string }
        warnings: { type: array, items: { type: string }, description: Cinema's retained and present lines. }
        error: { type: string }
        stoppable: { type: boolean, description: False once the files are committed. }

    StatusHeadline:
      type: object
      required: [state, title]
      properties:
        state: { type: string, enum: [done, active, waiting, failed, todo] }
        title: { type: string }
        detail: { type: string }
        at: { type: integer, format: int64, description: Unix ms the client formats beside the title. }

    StatusStage:
      type: object
      required: [key, state]
      properties:
        key: { type: string, enum: [searched, downloading, processed, moved, cinema_notified, in_cinema] }
        state: { type: string, enum: [done, active, waiting, failed, todo] }
        at: { type: integer, format: int64, description: Unix ms; absent when there is no time to show. }
        detail: { type: string }
        actions:
          type: array
          description: Actions that apply to this stage.
          items:
            type: string
            enum: [search, interactive_search, open_activity, cancel_download, retry_import, resend_cinema, confirm_cinema]

    StatusDownload:
      type: object
      required: [id, release, state, bytes, total, progress]
      properties:
        id: { type: integer, format: int64 }
        release: { type: string }
        indexer: { type: string }
        state: { type: string }
        bytes: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        progress: { type: number }
        rateBps: { type: integer, format: int64, description: "Runner's rate_bps, relayed." }
        etaSeconds: { type: integer, format: int64, description: remaining_bytes / rate_bps. }
        stage: { type: string, description: "Runner's post-processing stage." }
        stageSince: { type: integer, format: int64 }
        episodes: { type: integer, description: Episodes covered; more than one is a season pack. }

    StatusCinema:
      type: object
      required: [deliveryId, notifierId, status]
      properties:
        deliveryId: { type: integer, format: int64 }
        notifierId: { type: integer, format: int64 }
        status: { type: string }
        waitingOn: { type: string }
        visibleAt: { type: integer, format: int64 }
        itemIds:
          type: array
          items: { type: integer, format: int64 }
        error: { type: string }
        warnings: { type: array, items: { type: string }, description: Cinema's lasting answers about files that left (a Re-match). }

    StatusAttempt:
      type: object
      required: [downloadId, release, at, outcome]
      properties:
        downloadId: { type: integer, format: int64 }
        release: { type: string }
        indexer: { type: string }
        at: { type: integer, format: int64 }
        outcome: { type: string }
        reason: { type: string }

    StatusSeason:
      type: object
      required: [season, episodes, inCinema, onDisk, active, summary]
      properties:
        season: { type: integer }
        episodes: { type: integer }
        inCinema: { type: integer }
        onDisk: { type: integer }
        active: { type: boolean }
        summary: { type: string }
        download: { $ref: "#/components/schemas/StatusDownload" }

    StatusEpisode:
      type: object
      required: [episodeId, season, episode, wantableId, summary, inPack, stages]
      properties:
        episodeId: { type: integer, format: int64 }
        season: { type: integer }
        episode: { type: integer }
        title: { type: string }
        wantableId: { type: string, description: Scopes Search now to this episode (POST /wanted/searches, scope target). }
        summary: { type: string }
        at: { type: integer, format: int64, description: Unix ms the client formats beside the summary. }
        inPack: { type: boolean }
        downloadId: { type: integer, format: int64, description: The download this episode's track follows. }
        cinema: { $ref: "#/components/schemas/StatusCinema" }
        stages:
          type: array
          items: { $ref: "#/components/schemas/StatusStage" }

    AutoSearchResult:
      type: object
      required: [grabbed, targets]
      properties:
        grabbed:
          type: integer
          description: How many releases the search actually grabbed.
        targets:
          type: array
          description: >
            Every wantable the item produced, searched or not. An item with no
            targets at all wants nothing.
          items:
            $ref: "#/components/schemas/AutoSearchTarget"

    AutoSearchTarget:
      type: object
      required: [wantableId, label, seen, matched, accepted]
      properties:
        wantableId: { type: string }
        label:
          type: string
          description: Human name for the target, e.g. "Blade Runner (1982)".
        skipped:
          type: string
          description: >
            Set when the target was not searched, and why. "unmonitored" means
            monitoring is off for it; "downloading" means it already has a
            download in progress; "compared_recently" means this season's
            comparison completed too recently to repeat, so nothing was queued. Exact Wanted runs can additionally report a
            target that disappeared, changed reason, reached its re-grab cap,
            or was left by cancellation.
          enum: [unmonitored, downloading, no_longer_wanted, reason_changed, regrab_capped, cancelled, queued, compared_recently]
        seen:
          type: integer
          description: Distinct releases the indexers returned for this target.
        matched:
          type: integer
          description: Of those, how many the matcher tied to this target.
        accepted:
          type: integer
          description: Of the matched, how many the quality profile would take.
        grabbed:
          type: string
          description: Title of the release grabbed, absent if none was.
        error:
          type: string
          description: Why the search or the grab failed.
        incomplete:
          type: array
          items: { type: string }
          description: >
            Indexers that could not be fully searched, as "name: reason" — a
            spent request allowance, a provider retry delay, a timeout. With
            seen 0 this means the indexers were not asked, not that they had
            nothing.

    RecoverySettings:
      type: object
      required: [enabled, local_root, remote_root]
      properties:
        enabled: { type: boolean }
        local_root: { type: string }
        remote_root: { type: string }
        consumer_token: { type: string, writeOnly: true }
    RecoveryImportRequest:
      type: object
      required: [client_id, recovery_id, media_item_id, copy_id, file_ids, target_generation, accept_unverified]
      properties:
        preview_id: { type: string }
        episode_targets:
          type: object
          additionalProperties:
            type: object
            required: [season, episodes]
            properties:
              season: { type: integer }
              episodes: { type: array, items: { type: integer } }
        client_id: { type: integer, format: int64 }
        recovery_id: { type: string }
        media_item_id: { type: integer, format: int64 }
        copy_id: { type: integer, format: int64 }
        file_ids: { type: array, items: { type: string } }
        target_generation: { type: string }
        accept_unverified: { type: boolean }
    ManualImportRequest:
      type: object
      required: [path, mediaItemId]
      properties:
        path: { type: string }
        paths:
          type: array
          description: >
            Exact files selected from the scan. Every path must be a media
            file under path. Absent imports the whole path for backwards
            compatibility; an explicit selection must contain a file.
          minItems: 1
          items: { type: string }
        mediaItemId: { type: integer, format: int64 }
        copyId:
          type: integer
          format: int64
          description: Target copy; 0 = the primary copy.
        downloadId:
          type: integer
          format: int64
          description: >
            Tie the import to a stuck queue row so it's marked imported (or
            failed) by this attempt. 0 = a standalone import.
        reviewLegacy:
          type: boolean
          description: Explicitly approve only the selected files from a fenced legacy payload for this manual import.
        reviewLegacyFingerprint:
          type: string
          description: Exact inventory fingerprint shown in the legacy review preview.
        reviewLegacyFiles:
          type: array
          description: Exact selected path and snapshot identities from the preview; required when reviewLegacy is true.
          minItems: 1
          items:
            type: object
            required: [path, snapshotIdentity]
            properties:
              path: { type: string }
              snapshotIdentity: { type: string }
        episodeTargets:
          type: array
          description: >
            A series file's episode(s), chosen by a person, per selected path.
            Admitted with the selection: every retry places the file as these
            episodes whatever its name says.
          items: { $ref: "#/components/schemas/EpisodeTarget" }
        removeOriginal:
          type: boolean
          description: >
            Remove each source once its library copy is placed (a rename on
            one filesystem; copy, verify and remove across volumes).
            Standalone imports of loose files only; refused for a file inside
            a runner delivery.

    ManualImportAccepted:
      type: object
      required: [downloadId]
      properties:
        downloadId:
          type: integer
          format: int64
          description: Activity row that now owns the background import.

    PlacementSuggestion:
      type: object
      required: [rootFolderId, path]
      properties:
        rootFolderId: { type: integer, format: int64 }
        path:
          type: string
          description: Exact default folder path produced by Monarr's naming rules.

    CustomFormatInput:
      type: object
      required: [name, pattern]
      properties:
        name: { type: string }
        pattern:
          type: string
          description: Case-insensitive RE2 matched against release titles.
        score:
          type: integer
          default: 0

    CustomFormat:
      allOf:
        - $ref: "#/components/schemas/CustomFormatInput"
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }

    ImportListInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [tmdb-popular, tmdb-top, trakt-list]
        config:
          type: object
          additionalProperties: { type: string }
          description: "trakt-list: {user, slug, clientId}."
        kind:
          $ref: "#/components/schemas/MediaKind"
        rootFolderId: { type: integer, format: int64 }
        qualityProfileId: { type: integer, format: int64 }
        monitored: { type: boolean, default: true }
        enabled: { type: boolean, default: true }

    ImportList:
      allOf:
        - $ref: "#/components/schemas/ImportListInput"
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }

    NotifierInput:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          enum: [webhook, discord, plex, jellyfin, plurx]
        name:
          type: string
        settings:
          type: object
          additionalProperties:
            type: string
          description: "Type-specific: webhook/discord {url}; plex {url, token}; jellyfin and plurx {url, apiKey} — for plurx a scoped plx_ key with scan:trigger, never an admin token."
        onGrab:
          type: boolean
          default: true
        onImport:
          type: boolean
          default: true
        onFailed:
          type: boolean
          default: true
        onHealth:
          type: boolean
          default: false
        enabled:
          type: boolean
          default: true

    Notifier:
      allOf:
        - $ref: "#/components/schemas/NotifierInput"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
            features:
              type: array
              items: { type: string }
              description: >
                What the far side's connection test said it supports (Cinema:
                removed_paths, contract 4.4). Advisory; nothing is gated on it.
            featuresReadAt:
              type: integer
              format: int64
              description: When features were last read (Unix ms); absent = never.

    PlurxWatchedEvent:
      type: object
      required: [event, kind]
      properties:
        event:
          type: string
          description: >
            `watched` (the default), `reacquire`, or `reacquire_status`. An
            event this build does not know is accepted and dropped.
        kind:
          type: string
          enum: [movie, episode, show, season]
          description: >
            watched: movie or episode. reacquire / reacquire_status: movie,
            show, season or episode (ids as for watched: movie tmdb/imdb;
            show, season and episode use the SHOW's tmdb plus season and
            episode).
        tmdb:
          type: integer
          format: int64
          description: For an episode, season or show this is the SHOW's id, not the episode's.
        imdb: { type: string }
        season: { type: integer }
        episode: { type: integer }
        watched_at:
          type: integer
          format: int64
          description: Unix seconds. Required for `watched`.
        user:
          type: string
          description: >
            The plurx username. Per the §11.1 decision the signal is per-user;
            this is plurx's user, not a Monarr account, and Monarr does not
            create one.

    PipelineSummary:
      type: object
      required: [windowHours, timings, overdueRows, heldPublications]
      properties:
        windowHours: { type: integer, description: The look-back window of every figure here. }
        overdueRows:
          type: integer
          description: Downloads older than their state's allowance (the pipeline:overdue health check).
        heldPublications:
          type: integer
          description: >
            Publications the environment is holding — a full or blocked library,
            completed storage unavailable or outside the configured roots, a
            manifest missing or unreadable. They wait (retried on the retry
            ladder, never ended by their deadline); each row says why.
        timings:
          type: array
          items: { $ref: "#/components/schemas/PipelineTiming" }

    PipelineTiming:
      type: object
      required: [kind, samples, waiting]
      properties:
        kind:
          type: string
          enum: [failure_to_next_grab, runner_done_to_import, import_to_cinema_visible]
        samples: { type: integer, description: Timings that finished inside the window. }
        waiting:
          type: integer
          description: Timings that started inside the window and have not finished. Never folded into the percentiles.
        p50Seconds: { type: number, format: double, description: Absent when there are no samples. }
        p95Seconds: { type: number, format: double, description: Absent when there are no samples. }

    Transfer:
      type: object
      required: [downloadId, title, stage, startedAt, outbound]
      properties:
        downloadId:
          type: integer
          format: int64
          description: Monarr's download row, so a reader can reach the handoff trace.
        transfer:
          type: string
          description: >
            The id that spans all three applications (contract §3.1) — the one
            to grep with.
        title: { type: string }
        stage:
          type: string
          enum: [downloading, importing, notifying, publication_cleanup]
          description: >
            Which seam this is at. `downloading` is nzbd's work that Monarr is
            watching; `importing` is Monarr moving bytes itself; `notifying`
            is telling plurx, including the waits between retries;
            `publication_cleanup` is Curator verifying and removing a
            publication's evidenced files (detail says why it runs; a
            download-less publication reports a negative downloadId, minus its
            publication id).
        peer:
          type: string
          description: >
            The application on the other side. Absent for `importing` —
            Monarr is moving its own files, and naming a peer would invent a
            seam that does not exist.
        outbound:
          type: boolean
        startedAt: { type: string, format: date-time }
        bytes:
          type: integer
          format: int64
          description: >
            Bytes moved. Absent when the stage cannot measure itself — which a
            UI must render differently from 0%, hence the omission rather than
            a zero.
        total: { type: integer, format: int64 }
        bytesPerSecond:
          type: number
          format: double
          description: >
            Averaged over the life of the transfer, not instantaneous: an
            instantaneous rate on a network mount is mostly noise, and the
            question being asked is "will this finish tonight".
        detail: { type: string }

    Connection:
      type: object
      required: [name, kind, type, state]
      properties:
        name: { type: string }
        kind:
          type: string
          enum: [downloadclient, mediaserver, inbound]
          description: >
            downloadclient / mediaserver are things Monarr connects TO.
            inbound is another application that connects to Monarr — plurx
            pushing watch state, or a compat consumer.
        type: { type: string }
        url:
          type: string
          description: Redacted — any password is replaced before it leaves the server.
        state:
          type: string
          enum: [live, polling, degraded, unreachable, unprobed, calling, quiet]
          description: >
            live = a push stream is open; polling = answering, on the 30s poll;
            degraded = answering but not working properly; unreachable = not
            answering; unprobed = configured, but has no side-effect-free
            test. For inbound rows: calling = heard from recently; quiet =
            has called at some point since startup, but not lately.
        version: { type: string }
        lastContact:
          type: integer
          format: int64
          description: Last time something actually came through it (epoch ms).
        lastEventSeq:
          type: integer
          format: int64
          description: The last event id seen on a push stream.
        detail: { type: string }

    Delivery:
      type: object
      required: [id, notifierId, event, attempts, status, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        notifierId: { type: integer, format: int64 }
        downloadId: { type: integer, format: int64 }
        event: { type: string }
        attempts: { type: integer, format: int64 }
        lastError: { type: string }
        result:
          type: string
          description: What the far side answered on success, e.g. "scanned → plurx item 1201".
        status:
          type: string
          enum: [pending, ok, failed]
        nextAt:
          type: integer
          format: int64
          description: When a pending retry becomes due (epoch ms).
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        directory:
          type: string
          description: >
            The one directory this sub-delivery tells Cinema about (pipeline
            contract v2 section 4.1). Absent on a chat notifier's row.
        publicationId: { type: integer, format: int64 }
        attempt:
          type: integer
          format: int64
          description: >
            The attempt Cinema sees as the suffix of the request key. Reused
            after an ambiguous outcome, advanced after a confirmed retryable
            result and by Retry.
        requestKey:
          type: string
          description: The request key the current attempt is sent with, "<transfer>/<generation>/<dir-hash>/<attempt>".
        remoteRequestId: { type: string, description: Cinema's request id after it queued the scan. }
        remoteState:
          type: string
          description: queued, running, done or failed, as Cinema last reported the request.
        waitingOn:
          type: string
          description: What Cinema says the queued request is waiting on (full_scan:<library>, heavy_lane:<holder>, root_unreadable:<path>, queue_position:<n>).
        visibleAt:
          type: integer
          format: int64
          description: When Cinema reported every expected file placed with matching bytes and mtime (epoch ms).
        itemIds:
          type: array
          items: { type: integer, format: int64 }
          description: The Cinema item ids reported for this directory.
        expectedFiles:
          type: array
          items: { $ref: "#/components/schemas/ExpectedFile" }
        warning:
          type: boolean
          description: Still pending 30 minutes after it was written — shown with waitingOn or the reason a file is not placed. Never given up on.

    ExpectedFile:
      type: object
      required: [path, bytes, mtimeNs]
      properties:
        path: { type: string }
        bytes: { type: integer, format: int64 }
        mtimeNs: { type: integer, format: int64 }

    NotifierTestResult:
      type: object
      properties:
        message:
          type: string
          description: A pass that still has something to say, e.g. that checking the library paths needs a newer Cinema.

    BackupInfo:
      type: object
      required: [name, sizeBytes, createdAt]
      properties:
        name:
          type: string
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    CalendarEntry:
      type: object
      required: [date, kind, mediaItemId, title, detail, hasFile]
      properties:
        date:
          type: string
        kind:
          type: string
          description: episode | movie | book
        mediaItemId:
          type: integer
          format: int64
        title:
          type: string
        detail:
          type: string
        hasFile:
          type: boolean
        tmdbId:
          type: integer
          format: int64
          description: >
            The item's TMDB id, so a consumer can resolve this entry against
            its own library by id rather than by title. For an episode this is
            the SHOW's id — an episode's own identity does not name the series
            it belongs to. Absent when unknown.
        imdbId:
          type: string
          description: The item's IMDb id (the show's, for an episode).
        posterPath:
          type: string
          description: >
            Artwork, exactly as the library serves it elsewhere: a
            TMDB-relative path, or an absolute URL for book covers. Absent
            when the item has none.
        airDateUtc:
          type: string
          format: date-time
          description: >
            The exact instant this episode airs, composed from the show's
            broadcast slot and this date (ADR 0016). ABSENT whenever the
            schedule is unknown — streaming originals, movies and books have
            no broadcast instant, and a guessed midnight would sort and read
            as if it were real. Consumers pair it with `date`, which is
            always present.
        network:
          type: string
          description: Broadcaster or streaming service, display only ("HBO", "Netflix").
        seasonNumber:
          type: integer
          description: Episodes only — what `detail` encodes, machine-readable.
        episodeNumber:
          type: integer
          description: Episodes only — what `detail` encodes, machine-readable.
        episodeTitle:
          type: string
          description: Episodes only; absent when the provider has no title yet.
        runtime:
          type: integer
          description: Minutes. Absent when unknown.
        monitored:
          type: boolean
          description: >
            The episode's own monitored flag for episodes, the item's
            otherwise. An unmonitored entry still appears on the calendar —
            it is dated news either way — but nothing is hunting for it.

    WantedItem:
      type: object
      required: [wantableId, mediaItemId, title, detail, missing, current, copy, reason, kind, copyId]
      properties:
        wantableId:
          type: string
        mediaItemId:
          type: integer
          format: int64
        title:
          type: string
        detail:
          type: string
        missing:
          type: boolean
          description: false = on disk but below the profile cutoff.
        current:
          type: string
        copy:
          type: string
          description: Label of the quality copy this entry hunts for; "" = the primary.
        reason:
          type: string
          enum: [missing, upgrade]
        kind:
          type: string
          enum: [movie, series, book]
        copyId:
          type: integer
          format: int64
          description: 0 is the primary; positive values name an additional copy or edition.
        season:
          type: integer
          description: Series episodes only.
        episode:
          type: integer
          description: Series episodes only.

    WantedSearchScope:
      type: object
      required: [scope]
      properties:
        scope:
          type: string
          enum: [all, reason, group, target]
        reason:
          type: string
          enum: [missing, upgrade]
        mediaItemId:
          type: integer
          format: int64
        wantableId:
          type: string

    WantedSearchRequest:
      type: object
      required: [scope]
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [all, reason, group, target]
        reason:
          type: string
          enum: [missing, upgrade]
        mediaItemId:
          type: integer
          format: int64
        wantableId:
          type: string
        targetDelayMs:
          type: integer
          minimum: 0
          maximum: 60000
          default: 1000

    WantedSearchRun:
      type: object
      required:
        [runId, scope, scopeLabel, status, createdAt, targetDelayMs, selected,
         processed, searched, skipped, failed, grabbed]
      properties:
        runId: { type: string }
        scope: { $ref: "#/components/schemas/WantedSearchScope" }
        scopeLabel: { type: string }
        status:
          type: string
          enum: [queued, running, completed, failed, interrupted, cancelled]
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        cancelRequestedAt: { type: string, format: date-time }
        targetDelayMs: { type: integer }
        selected: { type: integer }
        processed: { type: integer }
        searched: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }
        grabbed: { type: integer }
        error: { type: string }

    WantedSearchResult:
      type: object
      required: [ordinal, wantableId, label, state, seen, matched, accepted, finishedAt]
      properties:
        ordinal: { type: integer }
        wantableId: { type: string }
        label: { type: string }
        state: { type: string, enum: [searched, skipped, failed] }
        skipped:
          type: string
          description: >
            "indexers_unavailable" means no release was seen and at least one
            indexer could not be searched; error names each one and why.
          enum: [unmonitored, downloading, no_longer_wanted, reason_changed, regrab_capped, cancelled, queued, indexers_unavailable]
        seen: { type: integer }
        matched: { type: integer }
        accepted: { type: integer }
        grabbed: { type: string }
        error: { type: string }
        finishedAt: { type: string, format: date-time }

    WantedSearchResultsPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WantedSearchResult" }
        limit: { type: integer }
        offset: { type: integer }

    WantedSearchConflict:
      type: object
      required: [activeRunId, canCancel, message]
      properties:
        activeRunId: { type: string }
        canCancel: { type: boolean }
        message: { type: string }

    BlocklistEntry:
      type: object
      required: [id, mediaItemId, releaseTitle, indexer, reason, createdAt]
      properties:
        id:
          type: integer
          format: int64
        mediaItemId:
          type: integer
          format: int64
        releaseTitle:
          type: string
        indexer:
          type: string
        reason:
          type: string
        createdAt:
          type: string
          format: date-time

    HistoryEvent:
      type: object
      required: [ts, type, mediaItemId, releaseTitle]
      properties:
        ts:
          type: string
          format: date-time
        type:
          type: string
          description: >
            grabbed | failed | imported | import_failed | import_blocked |
            import_retried | regrab_capped | short_delivery | payload_removed
            | file_removed | quality_mismatch | implausible_file |
            episode_from_release.
        mediaItemId: { type: integer, format: int64 }
        releaseTitle: { type: string }
        data:
          type: object
          additionalProperties: true
          description: Event-specific detail, as recorded.

    QueueSummary:
      type: object
      required: [total, active, counts]
      properties:
        total: { type: integer }
        active:
          type: integer
          description: Rows in a non-terminal state - what is actually moving.
        counts:
          type: object
          additionalProperties: { type: integer }
          description: Row count per state, keyed by the state string.
        retentionDays:
          type: integer
          description: >
            The window terminal rows and history events age out after.
            0 = keep everything.

    ClearedCount:
      type: object
      required: [cleared]
      properties:
        cleared: { type: integer }

    ImportAttemptIdentity:
      type: object
      required: [generationKey, epoch]
      properties:
        generationKey: { type: string }
        epoch: { type: string, pattern: '^[0-9]+$' }

    ImportAttemptStatus:
      allOf:
        - $ref: "#/components/schemas/ImportAttemptIdentity"
        - type: object
          required: [outcome, pendingPublications, retainedPublications, heldStages]
          properties:
            outcome: { type: string, enum: ['', pending, cancelled, completed] }
            pendingPublications: { type: integer }
            retainedPublications: { type: integer }
            heldStages: { type: integer }

    ImportActivityPage:
      type: object
      required: [items, counts, total, hasMore, retentionDays]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ImportActivityItem' }
        counts:
          type: object
          additionalProperties: { type: integer }
        total: { type: integer }
        hasMore: { type: boolean }
        retentionDays: { type: integer }
    ImportActivityItem:
      type: object
      required: [download, category, title, kind, destination, updatedAt]
      properties:
        download:
          allOf: [{ $ref: '#/components/schemas/QueueItem' }]
          description: Negative IDs identify read-only unattributed historical publications, never queue mutation targets.
        category: { type: string, enum: [active, queued, attention, imported, progress, history] }
        title: { type: string }
        kind: { type: string }
        destination: { type: string }
        updatedAt: { type: string, format: date-time }

    QueueItem:
      type: object
      required: [id, mediaItemId, title, state, progress, protocol, quality, addedAt]
      properties:
        id: { type: integer, format: int64 }
        mediaItemId: { type: integer, format: int64 }
        copyId:
          type: integer
          format: int64
          description: The media copy this grab targets; 0 = the primary copy.
        title: { type: string }
        state:
          type: string
          description: >
            planned | grabbed | submitting | downloading | held | downloaded |
            awaiting_import | importing | imported | notified | failed.
            `downloaded` means the download completed (pipeline contract v2).
        planId: { type: integer, format: int64 }
        planState: { type: string }
        submissionPhase: { type: string, enum: [pending, submitting, submitted, uncertain, rejected] }
        reservationActionable: { type: boolean, description: Whether current custody can be explicitly released after duplicate-risk acknowledgement. }
        parkedReason:
          type: string
          description: >
            Why a legacy (non-Runner) client's row, or a season episode held in
            custody, is reserved. Runner rows are never parked (pipeline contract v2).
        runnerOutcome:
          type: string
          description: The recorded terminal - completed | failed | cancelled - or absent while open.
        runnerReason:
          type: string
          description: >
            Why it failed: health | fetch | par | unpack | script | publish | io |
            identity | hold_expired (Runner's), or submit | lost | parked (Curator's,
            always provisional).
        fetchCause: { type: string, description: "fetch failures: gone | indexer_unavailable." }
        blamesRelease: { type: boolean, description: Whether the failure blocklisted the release. }
        provisional:
          type: boolean
          description: The terminal is Curator's own and any later Runner fact re-opens it.
        deadlineAt:
          type: string
          format: date-time
          description: When this state becomes overdue (contract section 3.5). Absent when it has none.
        stateEnteredAt:
          type: string
          format: date-time
          description: When the row entered its current state; Activity shows how long an awaiting_import row has waited for a person.
        stale:
          type: boolean
          description: A held row past its deadline - Runner has not reported since; never a Curator failure.
        heldReason: { type: string, description: Runner's hold message while held. }
        publications:
          type: array
          description: The publications (one per Runner generation) and what became of each file.
          items: { $ref: "#/components/schemas/QueuePublication" }
        selection:
          type: object
          additionalProperties: true
          description: Recorded public selection facts; absent for legacy or manual rows. Contains no transport URLs.
        control:
          type: object
          additionalProperties: true
          description: Runner persisted control; revision is a decimal string.
        progress: { type: number }
        protocol: { type: string }
        quality: { type: string }
        clientId: { type: integer, format: int64 }
        error: { type: string }
        savePath:
          type: string
          description: The completed-download path the client reported.
        importPath:
          type: string
          description: Where Monarr looked for the files after remote path mapping.
        importState:
          type: string
          enum: [queued, running]
          description: >
            The in-memory importer state. `queued` means the job was accepted
            and is waiting for one of the bounded import workers; `running`
            means a worker owns it. Absent means no importer owns this row.
        importControl: { $ref: "#/components/schemas/ImportAttemptStatus" }
        importRetryAttempts: { type: integer, minimum: 0 }
        importBlockedSince: { type: string, format: date-time }
        importRetryAt: { type: string, format: date-time }
        stage:
          type: string
          description: >
            What is happening to this job RIGHT NOW, finer-grained than
            `state` and present only while something is moving: downloading |
            par_rename | par_verify | par_repair | rar_rename | unpack |
            cleanup | move | post_unpack_rename | publication_verify | script | importing |
            notifying. The post-processing names are the download client's
            own spellings. Absent means nothing is in flight for this row.
        stageSince: { type: string, format: date-time }
        stagePeer:
          type: string
          description: >
            Which application is doing the current stage — the download client's
            name while it fetches and post-processes, empty while Monarr copies
            into the library, the media server's name while it is being told.

        stageDetail:
          type: string
          description: One line describing the current stage, in the client's words.
        bytes:
          type: integer
          format: int64
          description: Bytes moved at the current stage. Absent when the stage cannot measure itself.
        total:
          type: integer
          format: int64
          description: Bytes expected at the current stage. Absent when unknown — which is NOT the same as zero.
        bytesPerSecond:
          type: number
          description: Average rate over the life of the current stage.
        match:
          $ref: "#/components/schemas/MatchEvidence"
          description: Why this release was accepted when it was grabbed.
        handoff:
          type: array
          description: The download → import handoff, step by step.
          items: { $ref: "#/components/schemas/HandoffEntry" }
        addedAt: { type: string, format: date-time }

    QueuePublication:
      type: object
      required: [id, kind, state, cohort, path, files]
      properties:
        id: { type: integer, format: int64 }
        cleanupApprovedAt:
          type: string
          format: date-time
          description: When a historical publication's review batch was approved; absent until then.
        cleanupPausedAt:
          type: string
          format: date-time
          description: When an operator paused this publication's automatic cleanup; absent when it runs.
        cleanupState:
          type: string
          enum: [queued, running]
          description: A per-file cleanup pass waiting on or running in the cleanup lane; absent when none.
        cleanupReason: { type: string, description: Why the queued or running pass runs (after its import, hourly sweep, an operator action). }
        generation: { type: string }
        kind: { type: string, description: "completed | salvage" }
        state: { type: string, description: "discovered | importing | imported | import_failed | notified | removed" }
        cohort:
          type: string
          description: live | historical. historical publications are never deleted automatically until their review batch is approved.
        path: { type: string }
        manifestSource: { type: string, description: "file | none (v1_record on a removed publication until migration 0079 normalises it)" }
        error: { type: string }
        held:
          type: boolean
          description: The environment is holding this publication (it waits; heldReason says why).
        heldReason: { type: string, description: Why it is held, when held. }
        heldSince:
          type: string
          format: date-time
          description: When the hold began, when held.
        files:
          type: array
          items: { $ref: "#/components/schemas/QueuePublicationFile" }
    QueuePublicationFile:
      type: object
      required: [path, outcome]
      properties:
        path: { type: string }
        bytes: { type: integer, format: int64 }
        outcome: { type: string, description: "pending | placed | discarded | unresolved" }
        discardReason: { type: string, description: "superseded | duplicate | rejected, when discarded" }
        reason: { type: string }
        libraryPath: { type: string }
        removed: { type: boolean, description: The file's bytes have left the publication directory (per-file cleanup). }

    HandoffEntry:
      type: object
      required: [step, at]
      properties:
        step:
          type: string
          description: >
            grabbed | downloading | downloaded | awaiting_import | importing
            | imported | failed.
        at: { type: integer, format: int64, description: Unix milliseconds. }
        detail: { type: string }

    CompletedInventory:
      type: object
      required: [roots, bytes, attention]
      properties:
        bytes: { type: integer, format: int64, description: Logical bytes; stale or partial when a root has an error. }
        attention: { type: integer }
        roots:
          type: array
          items:
            $ref: '#/components/schemas/CompletedRoot'
    StorageChangeRequest:
      type: object
      required: [root, expectedIdentity, observedIdentity]
      properties:
        root: { type: string }
        expectedIdentity: { type: string }
        observedIdentity: { type: string }
        reviewToken: { type: string }
    StorageChangeReview:
      allOf:
        - { $ref: '#/components/schemas/StorageChangeRequest' }
        - type: object
          required: [expectedDescription, observedDescription, existingPayloads, existingRequests, inFlightRequests, activeImports]
          properties:
            expectedDescription: { type: string }
            observedDescription: { type: string }
            existingPayloads: { type: integer }
            existingRequests: { type: integer }
            inFlightRequests: { type: integer }
            activeImports: { type: integer }
    CompletedRoot:
      type: object
      required: [path, rootIdentity, checkedAt, lastCompleteAt, error, entries, bytes]
      properties:
        path: { type: string }
        checkedAt: { type: string, format: date-time }
        rootIdentity: { type: string }
        lastCompleteAt: { type: string, format: date-time }
        error: { type: string }
        bytes: { type: integer, format: int64 }
        storageIdentity: { type: string }
        observedStorageIdentity: { type: string }
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CompletedEntry'
    CompletedEntry:
      type: object
      required: [path, bytes, files, status, reason, receipts, fingerprint]
      properties:
        fingerprint: { type: string, description: Recursive metadata and filesystem identity token for reviewed deletion. }
        path: { type: string }
        bytes: { type: integer, format: int64 }
        files: { type: integer }
        status: { type: string }
        reason: { type: string }
        legacyReview: { type: boolean, description: Payload held for review because the storage under it was replaced. }
        deliveryManaged: { type: boolean, description: A publication claims this directory; its files leave only by their recorded per-file outcome. }
        wholeDeletable: { type: boolean, description: "A publication's directory with no manifest evidence left in it (every manifest file removed, or an approved directory with none): an operator may delete it whole." }
        reviewFiles:
          type: array
          description: Current file metadata snapshots for exact selected-file operations. For a publication, only its unresolved files an operator may discard; the manifest digest remains the deletion authority.
          items:
            $ref: '#/components/schemas/CompletedReviewFile'
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/CompletedReceipt'
    CompletedReviewFile:
      type: object
      required: [path, sizeBytes, modifiedAt, mode, snapshotIdentity]
      properties:
        path: { type: string }
        sizeBytes: { type: integer, format: int64 }
        modifiedAt: { type: string, format: date-time }
        mode: { type: string }
        snapshotIdentity: { type: string, description: Current metadata snapshot token; it is not proof of storage or content. }
    CompletedReceipt:
      type: object
      required: [downloadId, path, clientId, title, state, protocol, payloadRemoved, live]
      properties:
        downloadId: { type: integer, format: int64 }
        mediaItemId: { type: integer, format: int64, description: Exact associated library item when retained by the download record. }
        copyId: { type: integer, format: int64, description: Exact associated copy; zero means primary copy. }
        path: { type: string }
        clientId: { type: integer, format: int64 }
        title: { type: string }
        state: { type: string }
        protocol: { type: string }
        payloadRemoved: { type: boolean }
        live: { type: boolean }
        legacyReview: { type: boolean }
        deliveryManaged: { type: boolean }

    RecommendationFilters:
      type: object
      additionalProperties: false
      properties:
        theme: { type: string, nullable: true, enum: [gay_male, lesbian, lgbtq, coming_of_age, found_family, political_drama, space_exploration] }
        centralThemeOnly: { type: boolean }
        genres: { type: array, maxItems: 3, items: { type: integer } }
        originalLanguage: { type: string, nullable: true }
        yearFrom: { type: integer, nullable: true }
        yearTo: { type: integer, nullable: true }
        excludeTeenFocus: { type: boolean }
        hideInLibrary: { type: boolean }
    RecommendationSeed:
      type: object
      additionalProperties: false
      required: [provider, id]
      properties:
        provider: { type: string, enum: [tmdb, tvdb] }
        id: { type: string, pattern: '^[1-9][0-9]*$' }
    RecommendationRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [series] }
        query: { type: string, maxLength: 500 }
        seed: { $ref: '#/components/schemas/RecommendationSeed' }
        filters: { $ref: '#/components/schemas/RecommendationFilters' }
        limit: { type: integer, minimum: 1, maximum: 20 }
    RecommendationWarning:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    RecommendationReason:
      type: object
      required: [code, source, field, value, fetchedAt]
      properties:
        code: { type: string }
        source: { type: string }
        field: { type: string }
        value: { type: string }
        fetchedAt: { type: string, format: date-time }
    RecommendationResult:
      type: object
      required: [key, item, ownership, addability, themeEvidence, reasons, fetchedAt]
      properties:
        key: { type: string }
        item: { $ref: '#/components/schemas/SearchResult' }
        ownership: { type: string, enum: [absent, present, ambiguous, unknown] }
        libraryItemId: { type: integer, format: int64 }
        addability: { type: string, enum: [supported, unsupported, conflict] }
        themeEvidence: { type: string, enum: [central, present, unknown, contradicted] }
        reasons: { type: array, items: { $ref: '#/components/schemas/RecommendationReason' } }
        fetchedAt: { type: string, format: date-time }
    RecommendationApplied:
      type: object
      required: [query, rankingText, filters, interpretationVersion, limit]
      properties:
        query: { type: string }
        rankingText: { type: string }
        seed: { $ref: '#/components/schemas/RecommendationSeed' }
        filters: { $ref: '#/components/schemas/RecommendationFilters' }
        interpretationVersion: { type: string }
        limit: { type: integer }
    RecommendationResponse:
      type: object
      required: [state, applied, ranking, modelState, coverage, retrievedCount, checkedCount, eligibleCount, hiddenOwnedCount, returnedCount, warnings, results]
      properties:
        state: { type: string, enum: [ready, needs_refinement] }
        applied: { $ref: '#/components/schemas/RecommendationApplied' }
        ranking: { type: string, enum: [semantic, metadata_only] }
        modelState: { type: string }
        coverage: { type: string, enum: [bounded, partial] }
        retrievedCount: { type: integer }
        checkedCount: { type: integer }
        eligibleCount: { type: integer }
        hiddenOwnedCount: { type: integer }
        returnedCount: { type: integer }
        warnings: { type: array, items: { $ref: '#/components/schemas/RecommendationWarning' } }
        results: { type: array, items: { $ref: '#/components/schemas/RecommendationResult' } }
    RecommendationStatus:
      type: object
      required: [modelState, providerConfigured, message, themes]
      properties:
        modelState: { type: string, enum: [disabled, not_installed, downloading, loading, ready, failed] }
        providerConfigured: { type: boolean }
        message: { type: string }
        themes:
          type: array
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
    Settings:
      type: object
      required: [tmdbApiKeyConfigured, tmdbApiKeyHint]
      properties:
        tmdbApiKeyConfigured:
          type: boolean
        semanticRankingEnabled:
          type: boolean
          description: Opt in to standalone local semantic ranking; model download is explicit.
        tmdbApiKeyHint:
          type: string
        omdbApiKeyConfigured:
          type: boolean
          description: OMDb key present — enables Rotten Tomatoes / IMDb / Metacritic ratings.
        omdbApiKeyHint:
          type: string
        traktClientIdConfigured:
          type: boolean
          description: >
            Trakt client id present - adds the Trakt rows to Discover
            (ADR 0015). Optional: without it TMDB still serves nine rows.
        traktClientIdHint:
          type: string
        apiKey:
          type: string
          description: >
            Monarr's own API key — what consumers send as X-Api-Key to the
            /sonarr and /radarr personalities (and, once auth hardening is
            on, to /api/v1).
        authRequired:
          type: boolean
          description: Whether /api/v1 requires authentication.
        scanSkipPatterns:
          type: string
          description: >
            User skip patterns, one per line, applied on top of the built-in
            defaults during the root-folder sweep. Blank lines and # comments
            are ignored.
        completedRoots:
          type: string
          description: Curator-owned download storage roots, one absolute path per line. When empty, use /working/monarr if mounted, otherwise discover completed folders without claiming them.
        activityRetentionDays:
          type: integer
          description: >
            How long finished and failed downloads, and history events, are
            kept before the daily sweep ages them out. 0 keeps everything.
        defaultProfiles:
          $ref: '#/components/schemas/DefaultProfiles'

    DefaultProfiles:
      type: object
      description: >
        The quality profile a newly added item gets when the add form does not
        name one, per media kind. Always fully populated on read: an unset or
        dangling setting resolves to the built-in, so this is the effective
        answer rather than only what has been saved.
      required: [movie, series, book, audiobook]
      properties:
        movie:  { type: integer, format: int64 }
        series: { type: integer, format: int64 }
        book:
          type: integer
          format: int64
          description: >
            Ebook default retained under the historical book key for API
            compatibility. Must target an ebook format.
        audiobook:
          type: integer
          format: int64
          description: Must target an audiobook format.

    SettingsUpdate:
      type: object
      properties:
        completedRoots:
          type: string
          description: Curator-owned download storage roots, one absolute path per line. When empty, use /working/monarr if mounted, otherwise discover completed folders without claiming them.
        activityRetentionDays:
          type: integer
          minimum: 0
          description: >
            Days to keep finished/failed downloads and history events.
            0 keeps everything.
        tmdbApiKey:
          type: string
        semanticRankingEnabled:
          type: boolean
        omdbApiKey:
          type: string
          description: Optional — adds Rotten Tomatoes / IMDb / Metacritic ratings. "" clears it.
        traktClientId:
          type: string
          description: >
            Optional — a free Trakt app client id, which adds five rows to
            Discover (ADR 0015). "" clears it. Import lists keep their own
            per-list id and are unaffected either way.
        scanSkipPatterns:
          type: string
          description: Directory-name patterns to never offer as adoption candidates, one per line.
        authRequired:
          type: boolean
          description: Require API key or session for /api/v1 (Phase 5).
        authUsername:
          type: string
        authPassword:
          type: string
          description: Stored salted-hashed; never returned.
        defaultProfiles:
          $ref: '#/components/schemas/DefaultProfilesUpdate'

    RematchRequest:
      type: object
      properties:
        target:
          type: object
          description: A library item (itemId), or a title by provider id.
          properties:
            itemId: { type: integer, format: int64 }
            kind: { $ref: "#/components/schemas/MediaKind" }
            tmdbId: { type: integer, format: int64 }
            tvdbId: { type: integer, format: int64 }
            imdbId: { type: string }
            olid: { type: string }
            hydrationSource: { type: string }
        copyId: { type: integer, format: int64, description: "Target copy or edition; 0 = primary." }
        fileIds:
          type: array
          description: Move to… these files; absent = every file of the item (Re-match…).
          items: { type: integer, format: int64 }
        choices:
          type: array
          items:
            type: object
            required: [fileId]
            properties:
              fileId: { type: integer, format: int64 }
              season: { type: integer }
              episodes: { type: array, items: { type: integer } }
              leave: { type: boolean, description: "Leave it out: it stays on disk and leaves the library." }
        blocklist: { type: boolean, description: "Blocklist the moved files' releases for this item (default true)." }
        requestId: { type: string, description: "Execute only." }
        sourceRevision: { type: integer, format: int64, description: "Execute only: the preview's." }
        targetRevision: { type: integer, format: int64, description: "Execute only: the preview's (0 for a new title)." }
        fingerprint: { type: string, description: "Execute only: the preview's." }

    RematchMove:
      type: object
      required: [fileId, from, season, episodes, bytes]
      properties:
        fileId: { type: integer, format: int64 }
        from: { type: string }
        to: { type: string }
        season: { type: integer }
        episodes: { type: array, items: { type: integer } }
        label: { type: string }
        mode: { type: string, enum: [rename, copy, relink] }
        bytes: { type: integer, format: int64 }
        quality: { type: string }
        sidecars:
          type: array
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
        note: { type: string }
        problem: { type: string, description: "Why it is left out (stays on disk, leaves the library)." }
        needsPick: { type: boolean }

    RematchItemRef:
      type: object
      required: [id, kind, title, inLibrary]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string }
        title: { type: string }
        year: { type: integer }
        inLibrary: { type: boolean }
        folder: { type: string }
        folderChosen: { type: boolean }

    RematchPreview:
      type: object
      required: [source, target, moves, leftOut, sourceOutcome, sourceReason, blocklist, blocklistOn, sourceRevision, targetRevision, fingerprint, summary]
      properties:
        source: { $ref: "#/components/schemas/RematchItemRef" }
        target: { $ref: "#/components/schemas/RematchItemRef" }
        targetCopyId: { type: integer, format: int64 }
        moves: { type: array, items: { $ref: "#/components/schemas/RematchMove" } }
        leftOut: { type: array, items: { $ref: "#/components/schemas/RematchMove" } }
        sourceOutcome: { type: string, enum: [stays, removed] }
        sourceReason: { type: string }
        blocklist:
          type: array
          items:
            type: object
            properties:
              fileId: { type: integer, format: int64 }
              release: { type: string }
              indexer: { type: string }
        blocklistOn: { type: boolean }
        blocklistNote: { type: string }
        cinema: { type: string }
        episodes:
          type: array
          items:
            type: object
            properties:
              season: { type: integer }
              episode: { type: integer }
              title: { type: string }
              hasFile: { type: boolean }
        copies:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              bookType: { type: string }
        blocked: { $ref: "#/components/schemas/RematchBlocked" }
        sourceRevision: { type: integer, format: int64 }
        targetRevision: { type: integer, format: int64 }
        fingerprint: { type: string }
        summary: { type: string }

    RematchBlocked:
      type: object
      required: [reason, ref, itemId, message, retry]
      properties:
        reason: { type: string, enum: [download, import, replacement, rematch, offload] }
        ref: { type: string }
        itemId: { type: integer, format: int64 }
        message: { type: string }
        retry: { type: boolean }

    RematchConflict:
      type: object
      required: [message]
      properties:
        code: { type: string }
        message: { type: string }
        blocked: { $ref: "#/components/schemas/RematchBlocked" }

    RematchOperation:
      type: object
      required: [operationId, requestId, state, sourceItemId, targetItemId, bytesDone, bytesTotal, createdAt, updatedAt]
      properties:
        operationId: { type: string }
        requestId: { type: string }
        state:
          type: string
          enum: [planned, moving, moved, committed, complete, cancel_pending, cancelled, failed]
        sourceItemId: { type: integer, format: int64 }
        targetItemId: { type: integer, format: int64 }
        plan: { type: object, description: "The stored request and preview." }
        result:
          type: object
          description: "moved [{from,to,episodes,mode}], leftOut, failed, blocklisted, sourceRemoved, leftBehind, cinemaNote."
        bytesDone: { type: integer, format: int64 }
        bytesTotal: { type: integer, format: int64 }
        lastError: { type: string }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        cinema:
          type: array
          items:
            type: object
            properties:
              directory: { type: string }
              status: { type: string }
              result: { type: string }
              lastError: { type: string }
              visibleAt: { type: integer, format: int64 }

    OffloadRequest:
      type: object
      required: [scope]
      properties:
        scope:
          type: string
          enum: [item, season, episode]
          description: item is the whole movie or show.
        season: { type: integer, description: "Scope season: the season number." }
        episodeId: { type: integer, format: int64, description: "Scope episode: the episode's id." }
        requestId: { type: string, description: "Execution only: idempotency key." }
        fingerprint: { type: string, description: "Execution only: the preview's fingerprint; a library that changed since refuses with 409 stale." }

    OffloadFile:
      type: object
      required: [path, kind, bytes]
      properties:
        path: { type: string }
        kind: { type: string, enum: [media, sidecar] }
        bytes: { type: integer, format: int64 }
        shared: { type: boolean, description: "Another hard link keeps the bytes allocated (a seeding copy)." }
        episodes: { type: array, items: { type: string }, description: "S01E02 labels." }

    OffloadBlocked:
      type: object
      required: [reason, message, retry]
      properties:
        reason: { type: string, enum: [download, import, replacement, rematch, offload, unmounted] }
        ref: { type: string }
        message: { type: string }
        retry: { type: boolean }

    OffloadPreview:
      type: object
      required: [item, scope, label, files, bytes, freed, freeBefore, freeAfter, fingerprint, summary]
      properties:
        item: { type: object, description: "{id, kind, title, year}." }
        scope: { type: string, enum: [item, season, episode] }
        label: { type: string }
        files: { type: array, items: { $ref: "#/components/schemas/OffloadFile" } }
        bytes: { type: integer, format: int64, description: Every byte deleted. }
        freed: { type: integer, format: int64, description: What returns to the volume now (hard-linked bytes are not counted until the other link goes). }
        freeBefore: { type: integer, format: int64, description: "Library volume free bytes; -1 unknown." }
        freeAfter: { type: integer, format: int64 }
        root: { type: string }
        episodes: { type: array, items: { type: string }, description: What becomes offloaded, in order. }
        widened: { type: array, items: { type: string }, description: "Episodes the request did not name but a multi-episode file takes with it." }
        cinema: { type: string, description: What Cinema will do. Advisory. }
        cinemaWarning: { type: boolean, description: "True when Cinema will drop the title and its watch history (it does not advertise offload)." }
        blocked: { $ref: "#/components/schemas/OffloadBlocked" }
        fingerprint: { type: string }
        summary: { type: string }

    OffloadConflict:
      type: object
      required: [message]
      properties:
        code: { type: string }
        message: { type: string }
        blocked: { $ref: "#/components/schemas/OffloadBlocked" }

    OffloadOperation:
      type: object
      required: [operationId, requestId, state, itemId, scope, filesTotal, filesDone, bytesTotal, bytesFreed, stoppable, createdAt, updatedAt]
      properties:
        operationId: { type: string }
        requestId: { type: string }
        state:
          type: string
          enum: [deleting, waiting, retrying, stopping, complete, cancelled, failed]
          description: >
            waiting = the share is not mounted (nothing is marked deleted);
            retrying = an unlink failed (see failed); both resume by themselves.
        itemId: { type: integer, format: int64 }
        scope: { type: string, enum: [item, season, episode] }
        label: { type: string }
        plan: { type: object, description: The stored request and preview. }
        result: { type: object }
        filesTotal: { type: integer }
        filesDone: { type: integer }
        failed: { type: array, items: { type: string } }
        bytesTotal: { type: integer, format: int64 }
        bytesFreed: { type: integer, format: int64 }
        lastError: { type: string }
        stoppable: { type: boolean }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        cinemaLine: { type: string }
        cinema:
          type: array
          items:
            type: object
            properties:
              directory: { type: string }
              status: { type: string }
              result: { type: string }
              lastError: { type: string }
              visibleAt: { type: integer, format: int64 }

    ReacquireResult:
      type: object
      required: [mediaItemId, state, cleared]
      properties:
        mediaItemId: { type: integer, format: int64 }
        state:
          type: string
          enum: [searching, downloading, importing, on_disk, not_offloaded, offloading, offloaded]
        cleared: { type: boolean, description: This call cleared offloaded. }
        message: { type: string }

    DefaultProfilesUpdate:
      type: object
      description: >
        Partial: only the kinds present are changed. A profile that does not
        exist, or that lives on the wrong format axis for the kind, is refused
        with 400 rather than saved and discovered later.
      properties:
        movie:  { type: integer, format: int64 }
        series: { type: integer, format: int64 }
        book:   { type: integer, format: int64 }
        audiobook: { type: integer, format: int64 }
