openapi: 3.0.3
info:
  title: Monarr API
  version: "1"
  description: >
    Native Monarr API (spec-first; blueprint §7). Served under /api/v1.
    This is the only API the web UI uses. Phase 0 surface: system status,
    health, scheduler tasks, and the SSE event stream.
  license:
    name: GPL-3.0

paths:
  /system/status:
    get:
      operationId: getSystemStatus
      summary: System status
      responses:
        "200":
          description: Current system status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"

  /system/tasks:
    get:
      operationId: listTasks
      summary: Scheduler task states
      responses:
        "200":
          description: All registered scheduled tasks with their run state.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskState"

  /system/tasks/{name}/run:
    post:
      operationId: runTask
      summary: Trigger an immediate run of a scheduled task
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Run requested (requests coalesce if one is pending).
        "404":
          description: No task with that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /health:
    get:
      operationId: getHealth
      summary: Run health checks and report results
      responses:
        "200":
          description: Health report; overall is the worst check status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"

  /library:
    get:
      operationId: listLibrary
      summary: List library items
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MediaKind"
      responses:
        "200":
          description: Item summaries, sorted by title.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaItemSummary"
    post:
      operationId: addLibraryItem
      summary: Add a media item (hydrates metadata from the provider)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMediaRequest"
      responses:
        "201":
          description: The newly added, fully hydrated item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItemDetail"
        "400":
          description: Unsupported kind or invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Item already in the library.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Metadata provider not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/{id}:
    get:
      operationId: getLibraryItem
      summary: Get one item with seasons, episodes, and files
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItemDetail"
        "404":
          description: No such item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteLibraryItem
      summary: Remove an item from the library (files on disk are untouched)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Removed.
        "404":
          description: No such item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/scan:
    post:
      operationId: scanLibrary
      summary: Trigger a disk scan / reconcile
      responses:
        "202":
          description: Scan requested (runs via the scheduler; watch SSE).

  /library/scan/report:
    get:
      operationId: getScanReport
      summary: Result of the most recent scan
      responses:
        "200":
          description: The last scan report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanReport"
        "404":
          description: No scan has run yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /metadata/search:
    get:
      operationId: searchMetadata
      summary: Search the metadata provider
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MediaKind"
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Candidates from the provider.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "400":
          description: Unsupported kind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Metadata provider not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /rootfolders:
    get:
      operationId: listRootFolders
      summary: List library root folders
      responses:
        "200":
          description: Registered roots with disk info.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RootFolder"
    post:
      operationId: addRootFolder
      summary: Register a library root folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootFolder"
        "400":
          description: Path invalid or not accessible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /rootfolders/{id}:
    delete:
      operationId: deleteRootFolder
      summary: Remove a root folder registration (disk untouched)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Removed.
        "404":
          description: No such root folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /settings:
    get:
      operationId: getSettings
      summary: Read settings (secrets masked)
      responses:
        "200":
          description: Current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "204":
          description: Saved.

  /profiles:
    get:
      operationId: listProfiles
      summary: List quality profiles
      responses:
        "200":
          description: Profiles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QualityProfile"

  /indexers:
    get:
      operationId: listIndexers
      summary: List indexers
      responses:
        "200":
          description: Indexers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Indexer"
    post:
      operationId: addIndexer
      summary: Add an indexer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerInput"
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indexer"
        "400":
          description: Invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /indexers/test:
    post:
      operationId: testIndexer
      summary: Test an indexer config (t=caps)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerInput"
      responses:
        "200":
          description: Reachable.
        "400":
          description: Failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /indexers/{id}:
    delete:
      operationId: deleteIndexer
      summary: Remove an indexer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }

  /downloadclients:
    get:
      operationId: listDownloadClients
      summary: List download clients
      responses:
        "200":
          description: Clients.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadClientConfig"
    post:
      operationId: addDownloadClient
      summary: Add a download client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientInput"
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClientConfig"
        "400":
          description: Invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /downloadclients/test:
    post:
      operationId: testDownloadClient
      summary: Test a download client config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientInput"
      responses:
        "200": { description: Reachable. }
        "400":
          description: Failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /downloadclients/{id}:
    delete:
      operationId: deleteDownloadClient
      summary: Remove a download client
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }

  /library/{id}/releases:
    get:
      operationId: searchReleases
      summary: Interactive search for a movie, episode, or season pack
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: season
          in: query
          required: false
          schema: { type: integer }
        - name: episode
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Ranked candidates with rejection reasons attached.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReleaseCandidate"
        "404":
          description: Unknown item/season/episode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No enabled indexers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /grab:
    post:
      operationId: grabRelease
      summary: Send a release to a download client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrabRequest"
      responses:
        "201":
          description: Queued; returns the download row id.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: integer, format: int64 }
        "400":
          description: Invalid or no client for protocol.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /queue:
    get:
      operationId: listQueue
      summary: Recent downloads (all states)
      responses:
        "200":
          description: Queue.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueItem"

  /queue/{id}:
    delete:
      operationId: removeQueueItem
      summary: Remove a queue row (optionally from the client too)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: fromClient
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "204": { description: Removed. }
        "404":
          description: Unknown row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /customformats:
    get:
      operationId: listCustomFormats
      summary: Custom-format scoring rules
      responses:
        "200":
          description: Rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomFormat"
    post:
      operationId: addCustomFormat
      summary: Add a scoring rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomFormatInput"
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFormat"
        "400":
          description: Invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /customformats/{id}:
    delete:
      operationId: deleteCustomFormat
      summary: Remove a scoring rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }

  /importlists:
    get:
      operationId: listImportLists
      summary: Import list sources
      responses:
        "200":
          description: Lists.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportList"
    post:
      operationId: addImportList
      summary: Add an import list source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportListInput"
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportList"
        "400":
          description: Invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /importlists/{id}:
    delete:
      operationId: deleteImportList
      summary: Remove an import list source
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }

  /library/bulk:
    post:
      operationId: bulkEditLibrary
      summary: Apply monitoring/profile changes to many items at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
                monitored:
                  type: boolean
                qualityProfileId:
                  type: integer
                  format: int64
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: integer

  /auth/login:
    post:
      operationId: login
      summary: Session login for the UI (when auth is enabled)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "204": { description: Session cookie set. }
        "401":
          description: Bad credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      operationId: logout
      summary: Clear the session
      responses:
        "204": { description: Session cleared. }

  /notifiers:
    get:
      operationId: listNotifiers
      summary: List notification targets
      responses:
        "200":
          description: Notifiers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notifier"
    post:
      operationId: addNotifier
      summary: Add a notification target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifierInput"
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notifier"
        "400":
          description: Invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /notifiers/test:
    post:
      operationId: testNotifier
      summary: Send a test notification with an unsaved config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifierInput"
      responses:
        "200":
          description: Delivered.
        "400":
          description: Failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /notifiers/{id}:
    delete:
      operationId: deleteNotifier
      summary: Remove a notification target
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }
        "404":
          description: Unknown notifier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /system/backups:
    get:
      operationId: listBackups
      summary: On-disk database backups (newest first)
      responses:
        "200":
          description: Backups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BackupInfo"

  /calendar:
    get:
      operationId: getCalendar
      summary: Episodes airing and movies/books released in a date range
      parameters:
        - name: start
          in: query
          required: true
          schema: { type: string }
        - name: end
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Calendar entries, date-ordered.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEntry"

  /wanted:
    get:
      operationId: listWanted
      summary: Everything still wanted (missing or below cutoff)
      responses:
        "200":
          description: Wanted items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WantedItem"

  /blocklist:
    get:
      operationId: listBlocklist
      summary: Failed releases that will never be re-grabbed
      responses:
        "200":
          description: Blocklist entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlocklistEntry"

  /blocklist/{id}:
    delete:
      operationId: removeBlocklistEntry
      summary: Unblock a release
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }

  /events:
    get:
      operationId: streamEvents
      summary: Server-sent events
      description: >
        Streams every bus event as SSE `data:` lines. Each message is a JSON
        envelope `{type, ts, payload}` where `type` is the event type (e.g.
        `health.changed`, `task.completed`). Comment lines are sent
        periodically as heartbeats.
      responses:
        "200":
          description: An SSE stream (stays open).
          content:
            text/event-stream:
              schema:
                type: string

components:
  schemas:
    SystemStatus:
      type: object
      required:
        - appName
        - version
        - commit
        - goVersion
        - os
        - arch
        - startedAt
        - uptimeSeconds
        - dataDir
        - dbSchemaVersion
      properties:
        appName:
          type: string
          example: Monarr
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
        goVersion:
          type: string
        os:
          type: string
        arch:
          type: string
        startedAt:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
          format: int64
        dataDir:
          type: string
        dbSchemaVersion:
          type: integer
          format: int64

    HealthStatus:
      type: string
      enum: [ok, warning, error]

    HealthCheck:
      type: object
      required: [name, status, checkedAt]
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/HealthStatus"
        message:
          type: string
        checkedAt:
          type: string
          format: date-time

    HealthReport:
      type: object
      required: [overall, checks]
      properties:
        overall:
          $ref: "#/components/schemas/HealthStatus"
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"

    TaskState:
      type: object
      required: [name, intervalSeconds, running]
      properties:
        name:
          type: string
        intervalSeconds:
          type: integer
          format: int64
        running:
          type: boolean
        lastRunAt:
          type: string
          format: date-time
        lastDurationMs:
          type: integer
          format: int64
        lastError:
          type: string
        nextRunAt:
          type: string
          format: date-time

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    MediaKind:
      type: string
      enum: [movie, series, book]

    MediaItemSummary:
      type: object
      required: [id, kind, title, year, author, posterPath, monitored, path]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/MediaKind"
        title:
          type: string
        year:
          type: integer
        author:
          type: string
          description: Books only (ADR 0006); empty for movies/series.
        posterPath:
          type: string
        monitored:
          type: boolean
        path:
          type: string

    ExternalIds:
      type: object
      required: [tmdb]
      properties:
        tmdb:
          type: integer
          format: int64
        imdb:
          type: string
        tvdb:
          type: integer
          format: int64
        isbn13:
          type: string
        olid:
          type: string
          description: Open Library work id, e.g. OL17091839W.
        asin:
          type: string

    EpisodeInfo:
      type: object
      required: [id, seasonNumber, episodeNumber, title, airDate, monitored, hasFile]
      properties:
        id:
          type: integer
          format: int64
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        title:
          type: string
        airDate:
          type: string
        monitored:
          type: boolean
        hasFile:
          type: boolean

    SeasonInfo:
      type: object
      required: [number, monitored, episodes]
      properties:
        number:
          type: integer
        monitored:
          type: boolean
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/EpisodeInfo"

    MediaFileInfo:
      type: object
      required: [id, path, size, episodeIds]
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
        size:
          type: integer
          format: int64
        episodeIds:
          type: array
          items:
            type: integer
            format: int64

    MediaItemDetail:
      type: object
      required:
        - id
        - kind
        - title
        - year
        - posterPath
        - backdropPath
        - overview
        - author
        - genres
        - status
        - releaseDate
        - runtime
        - monitored
        - path
        - rootFolderId
        - ended
        - ids
        - seasons
        - files
        - addedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/MediaKind"
        title:
          type: string
        year:
          type: integer
        author:
          type: string
          description: Books only (ADR 0006); empty for movies/series.
        posterPath:
          type: string
        backdropPath:
          type: string
        overview:
          type: string
        genres:
          type: array
          items:
            type: string
        status:
          type: string
        releaseDate:
          type: string
        runtime:
          type: integer
        monitored:
          type: boolean
        path:
          type: string
        rootFolderId:
          type: integer
          format: int64
        ended:
          type: boolean
        ids:
          $ref: "#/components/schemas/ExternalIds"
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/SeasonInfo"
        files:
          type: array
          items:
            $ref: "#/components/schemas/MediaFileInfo"
        addedAt:
          type: string
          format: date-time

    AddMediaRequest:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/MediaKind"
        tmdbId:
          type: integer
          format: int64
          description: Identifies movies/series.
        olid:
          type: string
          description: Open Library work id — identifies books (ADR 0006).
        rootFolderId:
          type: integer
          format: int64
        qualityProfileId:
          type: integer
          format: int64
          description: 0/absent = kind default (Any; Ebook for books).
        monitored:
          type: boolean
          default: true

    SearchResult:
      type: object
      required: [kind, tmdbId, title, year, overview, posterPath, inLibrary]
      properties:
        kind:
          $ref: "#/components/schemas/MediaKind"
        tmdbId:
          type: integer
          format: int64
        olid:
          type: string
          description: Present for book results (ADR 0006).
        author:
          type: string
        title:
          type: string
        year:
          type: integer
        overview:
          type: string
        posterPath:
          type: string
        inLibrary:
          type: boolean

    RootFolder:
      type: object
      required: [id, path, freeBytes, accessible]
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
        freeBytes:
          type: integer
          format: int64
        accessible:
          type: boolean

    UnmatchedDir:
      type: object
      required: [rootFolderId, path, name]
      properties:
        rootFolderId:
          type: integer
          format: int64
        path:
          type: string
        name:
          type: string

    ScanReport:
      type: object
      required:
        - scannedAt
        - rootsScanned
        - itemsScanned
        - filesLinked
        - filesRemoved
        - unmatchedDirs
        - missingPaths
      properties:
        scannedAt:
          type: string
          format: date-time
        rootsScanned:
          type: integer
        itemsScanned:
          type: integer
        filesLinked:
          type: integer
        filesRemoved:
          type: integer
        unmatchedDirs:
          type: array
          items:
            $ref: "#/components/schemas/UnmatchedDir"
        missingPaths:
          type: array
          items:
            type: string

    QualityProfile:
      type: object
      required: [id, name, cutoff, upgradesAllowed, qualities]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        cutoff: { type: string }
        upgradesAllowed: { type: boolean }
        qualities:
          type: array
          items: { type: string }

    IndexerInput:
      type: object
      required: [name, url, protocol]
      properties:
        name: { type: string }
        url: { type: string }
        apiKey: { type: string }
        protocol: { type: string, enum: [torrent, usenet] }
        categories:
          type: array
          items: { type: integer }
        enabled: { type: boolean, default: true }

    Indexer:
      allOf:
        - $ref: "#/components/schemas/IndexerInput"
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }

    DownloadClientInput:
      type: object
      required: [type, name, url]
      properties:
        type: { type: string, enum: [qbittorrent, sabnzbd, transmission, deluge, nzbget] }
        name: { type: string }
        url: { type: string }
        username: { type: string }
        password: { type: string }
        category: { type: string, default: monarr }
        enabled: { type: boolean, default: true }

    DownloadClientConfig:
      allOf:
        - $ref: "#/components/schemas/DownloadClientInput"
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }

    Rejection:
      type: object
      required: [code, reason]
      properties:
        code: { type: string }
        reason: { type: string }

    ReleaseCandidate:
      type: object
      required: [title, downloadUrl, indexer, protocol, size, seeders, age, quality, score, accepted, isUpgrade, rejections]
      properties:
        title: { type: string }
        downloadUrl: { type: string }
        infoUrl: { type: string }
        indexer: { type: string }
        protocol: { type: string }
        size: { type: integer, format: int64 }
        seeders: { type: integer }
        age: { type: string }
        quality: { type: string }
        score:
          type: integer
          description: Custom-format score sum (Phase 5).
        formats:
          type: array
          items: { type: string }
          description: Names of matched custom formats.
        accepted: { type: boolean }
        isUpgrade: { type: boolean }
        rejections:
          type: array
          items: { $ref: "#/components/schemas/Rejection" }

    GrabRequest:
      type: object
      required: [mediaItemId, title, downloadUrl, protocol]
      properties:
        mediaItemId: { type: integer, format: int64 }
        season: { type: integer }
        episode: { type: integer }
        title: { type: string }
        downloadUrl: { type: string }
        indexer: { type: string }
        protocol: { type: string }
        size: { type: integer, format: int64 }

    CustomFormatInput:
      type: object
      required: [name, pattern]
      properties:
        name: { type: string }
        pattern:
          type: string
          description: Case-insensitive RE2 matched against release titles.
        score:
          type: integer
          default: 0

    CustomFormat:
      allOf:
        - $ref: "#/components/schemas/CustomFormatInput"
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }

    ImportListInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [tmdb-popular, tmdb-top, trakt-list]
        config:
          type: object
          additionalProperties: { type: string }
          description: "trakt-list: {user, slug, clientId}."
        kind:
          $ref: "#/components/schemas/MediaKind"
        rootFolderId: { type: integer, format: int64 }
        qualityProfileId: { type: integer, format: int64 }
        monitored: { type: boolean, default: true }
        enabled: { type: boolean, default: true }

    ImportList:
      allOf:
        - $ref: "#/components/schemas/ImportListInput"
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }

    NotifierInput:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          enum: [webhook, discord, plex, jellyfin]
        name:
          type: string
        settings:
          type: object
          additionalProperties:
            type: string
          description: "Type-specific: webhook/discord {url}; plex {url, token}; jellyfin {url, apiKey}."
        onGrab:
          type: boolean
          default: true
        onImport:
          type: boolean
          default: true
        onFailed:
          type: boolean
          default: true
        onHealth:
          type: boolean
          default: false
        enabled:
          type: boolean
          default: true

    Notifier:
      allOf:
        - $ref: "#/components/schemas/NotifierInput"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64

    BackupInfo:
      type: object
      required: [name, sizeBytes, createdAt]
      properties:
        name:
          type: string
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    CalendarEntry:
      type: object
      required: [date, kind, mediaItemId, title, detail, hasFile]
      properties:
        date:
          type: string
        kind:
          type: string
          description: episode | movie | book
        mediaItemId:
          type: integer
          format: int64
        title:
          type: string
        detail:
          type: string
        hasFile:
          type: boolean

    WantedItem:
      type: object
      required: [wantableId, mediaItemId, title, detail, missing, current]
      properties:
        wantableId:
          type: string
        mediaItemId:
          type: integer
          format: int64
        title:
          type: string
        detail:
          type: string
        missing:
          type: boolean
          description: false = on disk but below the profile cutoff.
        current:
          type: string

    BlocklistEntry:
      type: object
      required: [id, mediaItemId, releaseTitle, indexer, reason, createdAt]
      properties:
        id:
          type: integer
          format: int64
        mediaItemId:
          type: integer
          format: int64
        releaseTitle:
          type: string
        indexer:
          type: string
        reason:
          type: string
        createdAt:
          type: string
          format: date-time

    QueueItem:
      type: object
      required: [id, mediaItemId, title, state, progress, protocol, quality, addedAt]
      properties:
        id: { type: integer, format: int64 }
        mediaItemId: { type: integer, format: int64 }
        title: { type: string }
        state: { type: string }
        progress: { type: number }
        protocol: { type: string }
        quality: { type: string }
        error: { type: string }
        addedAt: { type: string, format: date-time }

    Settings:
      type: object
      required: [tmdbApiKeyConfigured, tmdbApiKeyHint]
      properties:
        tmdbApiKeyConfigured:
          type: boolean
        tmdbApiKeyHint:
          type: string
        apiKey:
          type: string
          description: >
            Monarr's own API key — what consumers send as X-Api-Key to the
            /sonarr and /radarr personalities (and, once auth hardening is
            on, to /api/v1).
        authRequired:
          type: boolean
          description: Whether /api/v1 requires authentication.

    SettingsUpdate:
      type: object
      properties:
        tmdbApiKey:
          type: string
        authRequired:
          type: boolean
          description: Require API key or session for /api/v1 (Phase 5).
        authUsername:
          type: string
        authPassword:
          type: string
          description: Stored salted-hashed; never returned.
