<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%238b7cf6'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3Em%3C/text%3E%3C/svg%3E"
    />
    <title>Monarr</title>
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1117" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f8" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply layout, palette, and appearance before first paint. Classic is
      // deliberately the fallback: it is the layout Monarr shipped before
      // display choices existed, so an unknown future preference stays safe.
      try {
        var layouts = ['classic', 'plex', 'theater']
        var palettes = ['classic', 'terminal', 'noirr', 'amber', 'giallo', 'silver', 'void', 'vhs', 'paper', 'tide']
        var layout = localStorage.getItem('monarr-layout') || 'classic'
        var palette = localStorage.getItem('monarr-palette') || 'classic'
        var appearance = localStorage.getItem('monarr-theme') || 'auto'
        if (!layouts.includes(layout)) layout = 'classic'
        if (!palettes.includes(palette)) palette = 'classic'
        if (!['auto', 'light', 'dark'].includes(appearance)) appearance = 'auto'
        var darkOnly = palette === 'void' || palette === 'vhs'
        var systemLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
        var mode = darkOnly ? 'dark' : appearance === 'auto' ? (systemLight ? 'light' : 'dark') : appearance
        document.documentElement.dataset.layout = layout
        document.documentElement.dataset.palette = palette
        document.documentElement.dataset.mode = mode
        document.documentElement.style.colorScheme = mode
      } catch (e) {}
      // Same, for poster card size — without it the whole library grid
      // reflows one frame after it draws. Key kept in step with
      // CARD_SIZE_KEY in src/cardsize.ts.
      try {
        var c = localStorage.getItem('monarr-card-size')
        if (c === 's' || c === 'm' || c === 'l') document.documentElement.dataset.cardSize = c
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
