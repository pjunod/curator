eal input,#curator-real select{border:1px solid var(--c-border);border-radius:8px;background:var(--c-panel);color:var(--c-text);padding:7px 10px;max-width:100%;min-width:0}#curator-real input[type=checkbox],#curator-real input[type=radio]{accent-color:var(--c-accent);width:15px;height:15px;flex:none;margin:2px 6px 0 0}#curator-real label{display:flex;align-items:center;gap:5px}#curator-real .c-field{display:grid;gap:7px;margin:14px 0}#curator-real .c-field label{font-size:13px}#curator-real .c-table-wrap{overflow:auto;max-width:100%}#curator-real table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}#curator-real th{text-align:left;font-size:11px;font-weight:400;letter-spacing:.6px;text-transform:uppercase;color:var(--c-muted);padding:9px 10px;border-bottom:1px solid var(--c-border)}#curator-real td{padding:9px 10px;border-bottom:1px solid var(--c-border);vertical-align:top;overflow-wrap:anywhere}#curator-real td small{display:block;color:var(--c-muted)}#curator-real tr:last-child>td{border-bottom:0}#curator-real .c-mono{font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}#curator-real .c-group{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--c-muted);padding:10px}#curator-real .c-expanded{background:color-mix(in srgb,var(--c-raised) 65%,var(--c-panel));padding:16px!important}#curator-real .c-timeline{list-style:none;padding:0;margin:16px 0 0;font-size:13px}#curator-real .c-timeline li{position:relative;display:grid;grid-template-columns:66px minmax(0,1fr) 112px;gap:12px;padding:8px 0 10px 22px;margin-left:8px;border-left:1px solid var(--c-border)}#curator-real .c-timeline li:before{content:'';position:absolute;left:-5px;top:16px;width:9px;height:9px;border-radius:50%;background:var(--c-accent)}#curator-real .c-timeline li.wait:before{background:var(--c-warn)}#curator-real .c-timeline time{font:11px/1.6 ui-monospace,monospace;color:var(--c-muted)}#curator-real .c-timeline .c-duration{font-size <script>
(()=>{
const root=document.getElementById('curator-real'),main=root.querySelector('main'),overlay=root.querySelector('.c-overlay');
const defaults={page:'activity',expanded:true,storageOpen:false,resolve:false,resolveAction:'import',resolved:false,cleaned:false,mount:false,retries:3,keep:false,dialog:null,indexer:'drunkenslug',indexes:{drunkenslug:{enabled:false,cap:10000,used:312},'nzb.life':{enabled:true,cap:500,used:118}},reason:'bad',blacklist:null,replaced:false,theme:'dark'};
let s=structuredClone(defaults),toast='';
function restore(w){if(w?.privateContent?.version===1)s={...structuredClone(defaults),...w.privateContent.state};}
restore(window.openai?.widgetState);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(t,a,cls='',extra='')=>`<button type="button" class="cursor-interaction ${cls}" data-action="${a}" ${extra}>${t}</button>`;
const pill=(t,c='')=>`<span class="c-pill ${c}">${t}</span>`;
function save(){window.openai?.setWidgetState?.({modelContent:{review:'existing-curator-layout',screen:s.page,dialog:s.dialog,indexerLimits:s.indexes,episodeBlacklist:s.blacklist,replacementReason:s.reason},privateContent:{version:1,state:s}}).catch(()=>{});}
function timeline(){const rows=[['12:00:00','Grabbed','Manual · additional copy','<1s'],['12:00:01','Download','Runner · all articles received','18m 42s'],['12:18:43','Verify','Runner · integrity passed','32s'],['12:19:15','Repair','Not needed','—'],['12:19:15','Extract','Runner · usable media verified','2m 08s'],['12:21:23','Handoff','Published → Curator accepted','14s · waited 45s'],['12:21:37','Runner cleanup','Working files removed and checked','3s'],['12:22:22','Import','Curator · additional copy committed','4m 16s'],['12:26:38','Notify Cinema','Library update acknowledged','1s']];return `<ol class="c-timeline">${rows.map(([t,n,d,a])=>`<li><time>${t}</time><div><strong>${n}</strong><small class="c-muted" style="display:block">${d}</small>${n==='Handoff'?'<details><summary>Communication · 2 attempts</summary><p>12:21:37 · Ready notification persisted<br>12:21:38 · First response timed out<br>12:22:22 · Same handoff accepted on retry<br>One import; no duplicate submission.</p></details>':''}</div><div class="c-duration">${a}</div></li>`).join('')}<li class="${s.cleaned?'':'wait'}"><time>${s.cleaned?'12:41:05':'12:26:39'}</time><div><strong>Curator cleanup</strong><small style="display:block" class="c-muted">${s.cleaned?'Completed files removed and checked':'Waiting for storage verification'}</small></div><div class="c-duration">${s.cleaned?'3s':'2s active<br>14m waiting'}</div>${s.cleaned?'':`<div class="c-full"><div class="c-message">Completed filesystem device number changed from 70 to 69. Cleanup paused; library copy is available.<br><small>Attempt ${s.retries} · next check in 2m</small></div><div class="c-actions">${btn('Retry cleanup','retry-cleanup')}${btn('Inspect storage','inspect-storage')}</div></div>`}</li></ol>`;}
function storage(){return `<section class="c-panel"><div class="c-between"><div><h2>Download storage</h2><p class="c-muted">Review leftover downloads and manage files on disk.</p></div><div class="c-row">${btn('Scan download storage','scan')}${btn('Retry cleanup','retry-cleanup')}</div></div><div class="c-stats"><div class="c-stat"><strong>${s.cleaned?'12.4':'72.5'} GB</strong><small>Logical size on disk</small></div><div class="c-stat"><strong>${s.cleaned?'1':'2'}</strong><small>Entries accounted for</small></div><div class="c-stat"><strong>${s.cleaned?'1':'2'}</strong><small>Need attention</small></div></div><p class="c-note">Completed · owned by Curator. Processing files stay owned by Runner.</p>${!s.cleaned?`<div class="c-message">Cleanup paused for completed: storage needs verification. ${btn('Inspect storage','inspect-storage','c-text-button')}</div>`:''}<details ${s.storageOpen?'open':''} data-storage><summary>Storage entries (${s.cleaned?'1':'2'})</summary><div class="c-table-wrap"><table><thead><tr><th style="width:31%">Folder</th><th style="width:17%">Owner / size</th><th>Why it remains</th><th style="width:16%">Action</th></tr></thead><tbody>${!s.cleaned?`<tr><td class="c-mono">Heretic.2024.2160p.REMUX</td><td>Curator<small>60.1 GB</small></td><td>Imported; cleanup blocked</td><td>${btn('History','history')}</td></tr>`:''}<tr><td class="c-mono">Good.Trouble.S01.PACK</td><td>Curator<small>12.4 GB</small></td><td>${s.resolved?'Import queued':'Verified media; map two files'}</td><td>${btn('Resolve…','resolve')}</td></tr></tbody></table></div></details></section>`;}
function resolvePanel(){return `<section class="c-panel"><div class="c-between"><h2>Resolve files</h2>${btn('Close','close-resolve')}</div><p class="c-muted">Good Trouble · verified media needs episode mapping. Curator owns these completed files.</p><div class="c-field"><label for="cr-path">Path</label><input id="cr-path" value="/working/monarr/completed/Good.Trouble.S01.PACK" readonly></div><div class="c-tabs" aria-label="Resolution outcome">${['import','retry','delete'].map((x,i)=>btn(['Import / move','Retry / reprocess','Delete'][i],'resolve-'+x,'',`aria-pressed="${s.resolveAction===x}"`)).join('')}</div>${s.resolveAction==='import'?`<div class="c-table-wrap"><table><thead><tr><th style="width:33%">File</th><th>Import as</th><th style="width:16%">Size</th></tr></thead><tbody><tr><td class="c-mono">7c91…mkv</td><td><select aria-label="Map first file"><option>S01E01 · DTLA · primary copy</option><option>S01E02 · The Coterie · primary copy</option></select></td><td>6.1 GB</td></tr><tr><td class="c-mono">81af…mkv</td><td><select aria-label="Map second file"><option>S01E02 · The Coterie · primary copy</option><option>S01E01 · DTLA · primary copy</option></select></td><td>6.3 GB</td></tr></tbody></table></div><p class="c-note">Destination: /20t/tv/Good Trouble (2019)/Season 01. Successfully imported source files are cleaned automatically.</p>`:s.resolveAction==='retry'?'<p>Retry identification using these verified files. The download is not repeated.</p>':'<div class="c-message">Remove only the selected 12.4 GB in completed. Library copies are outside this selection.</div>'}<div class="c-actions">${btn(s.resolveAction==='import'?'Queue import':s.resolveAction==='retry'?'Retry now':'Delete selected files','submit-resolve',s.resolveAction==='delete'?'c-danger':'c-primary')}</div></section>`;}
function activity(){return `<div class="c-head"><h1>Activity</h1>${btn(s.resolve?'Close Resolve':'Resolve files','toggle-resolve')}</div>${s.resolve?resolvePanel():''}${storage()}<div class="c-row" style="margin-bottom:14px"><input aria-label="Filter by release title" placeholder="Filter by release title" style="width:280px"><span class="c-muted" style="font-size:13px">1 active · 1 cleanup pending · 1 finished</span></div><section class="c-panel"><div class="c-table-wrap"><table><thead><tr><th style="width:4%"></th><th style="width:27%">Release</th><th style="width:14%">Quality</th><th style="width:12%">Owner</th><th style="width:23%">Status</th><th style="width:20%">Actions</th></tr></thead><tbody><tr><td colspan="6" class="c-group">${s.cleaned?'Finished':'Cleanup pending'} · 1</td></tr><tr><td>${btn(s.expanded?'▾':'▸','expand','c-text-button',`aria-label="${s.expanded?'Collapse':'Show'} download history" aria-expanded="${s.expanded}"`)}</td><td class="c-mono">Heretic.2024.2160p.REMUX<small>Manual · additional copy</small></td><td>REMUX 2160p</td><td>Curator</td><td>${pill(s.cleaned?'Complete':'Cleanup blocked',s.cleaned?'good':'warn')}<small>Library copy available</small></td><td>${btn('Mark bad…','mark-movie')}</td></tr></tbody></table></div>${s.expanded?`<div class="c-expanded"><div class="c-between"><strong style="font-size:13px">Download history · Runner → Curator</strong><small class="c-muted">Working and waiting time retained per step</small></div>${timeline()}<details><summary>Locations and receipts</summary><dl class="c-paths"><dt>Processing</dt><dd class="c-mono">/processing/Heretic… · removed by Runner</dd><dt>Completed</dt><dd class="c-mono">/working/monarr/completed/Heretic… · ${s.cleaned?'removed':'60.1 GB retained for cleanup'}</dd><dt>Library</dt><dd class="c-mono">/media/movies/Heretic (2024)/Heretic [2160p] [copy-2].mkv</dd></dl></details><label style="margin-top:14px;font-size:13px"><input type="checkbox" data-field="keep" ${s.keep?'checked':''}>Keep files if this download fails</label><small class="c-muted">Applies to this download only; successful cleanup still runs.</small></div>`:''}</section><section class="c-panel c-fold"><span>▸ Finished <small class="c-muted">1</small></span>${btn('Clear finished','unchanged','c-text-button')}</section><section class="c-panel c-fold"><span>▸ Failed <small class="c-muted">0</small></span></section>`;}
function settings(){return `<div class="c-head"><h1>Settings</h1></div><nav class="c-tabs" aria-label="Settings sections">${btn('General','unchanged','',`aria-pressed="true"`)}${btn('Resolve files ↗','resolve-route')}${btn('Dev','unchanged')}</nav><p class="c-note">Indexers section · other General settings omitted from this preview.</p><section class="c-panel"><h2>Indexers</h2><p class="c-muted">Newznab/Torznab endpoints. Request limits are configured independently for each indexer.</p><div class="c-table-wrap"><table><thead><tr><th style="width:22%">Name</th><th style="width:25%">Local limit</th><th style="width:23%">Usage / provider</th><th style="width:30%"></th></tr></thead><tbody>${Object.entries(s.indexes).map(([n,v])=>`<tr><td>${n}<small>${pill('usenet')}</small></td><td>${v.enabled?v.cap+' / rolling 24h':'Off'}<small>${v.enabled?Math.max(0,v.cap-v.used)+' remaining':'No local cap'}</small></td><td>${v.used} requests<small>Provider: available</small></td><td><div class="c-row">${btn('Test','unchanged')}${btn('Request limit','indexer:'+n)}${btn('Remove','unchanged')}</div></td></tr>`).join('')}</tbody></table></div><div class="c-row" style="margin-top:18px"><input aria-label="New indexer name" placeholder="Name" style="width:140px"><input aria-label="New indexer URL" placeholder="URL" style="width:180px"><input aria-label="New indexer API key" placeholder="API key" type="password" style="width:140px"></div><div class="c-row" style="margin-top:12px"><label><input type="checkbox">Enable a local request limit for this new indexer</label></div><div class="c-actions"><select aria-label="New indexer type"><option>usenet</option><option>torrent</option></select>${btn('Test','unchanged','', 'disabled')}${btn('Add indexer','unchanged','c-primary','disabled')}</div></section><section class="c-panel"><h2>Download clients</h2><p class="c-muted">Existing client connections and path mappings remain here.</p><div class="c-table-wrap"><table><tbody><tr><td>nzbd</td><td>${pill('native')}</td><td class="c-mono">http://nzbd:6789</td><td>${pill('live','good')}</td><td>${btn('Test','unchanged')}</td></tr></tbody></table></div></section>`;}
function system(){return `<div class="c-head"><h1>System</h1></div><section class="c-panel"><div class="c-between"><h2>Completed folders</h2>${pill(s.mount?'Verified':'Cleanup paused',s.mount?'good':'warn')}</div><p class="c-mono">/working/monarr/completed</p><div class="c-message ${s.mount?'good':''}">${s.mount?'Expected storage verified. Pending cleanup has resumed.':'The filesystem device number changed from 70 to 69. Verify that the expected completed storage is mounted before resuming cleanup.'}</div><dl class="c-paths"><dt>Last verified</dt><dd>October 12, 2026</dd><dt>Expected</dt><dd>Registered QNAP completed storage</dd><dt>Observed</dt><dd>Device 69 · inode 39714820</dd><dt>Previous</dt><dd>Device 70 · inode 39714820</dd><dt>Affected</dt><dd>Heretic · 60.1 GB awaiting cleanup</dd><dt>Next action</dt><dd>Validate the registered storage and expected mount, then retry cleanup.</dd></dl><div class="c-actions">${btn('Revalidate this storage','revalidate','c-primary')}${btn('View affected download','history')}</div></section>`;}
function library(){return `<div class="c-head"><h1>Good Trouble <span class="c-muted">(2019)</span></h1>${pill('series')}</div><p class="c-note">Library detail · scrolled to Quality copies and Seasons · example pack for replacement review.</p><section class="c-panel"><h2>Quality copies</h2><p class="c-muted">Each copy has its own profile and destination. A manual grab creates an additional copy alongside existing files.</p><div class="c-row"><select aria-label="Copy quality profile"><option>(profile…)</option><option>1080p</option></select><select aria-label="Copy location"><option>Same folder as the main copy</option></select><input placeholder="Name (optional)" aria-label="Copy name" style="width:170px">${btn('Add copy','unchanged','c-primary','disabled')}</div></section><section class="c-panel c-seasons"><h2>▾ Seasons <span class="c-muted">(5)</span></h2><div class="c-between" style="margin:16px 0 8px"><label><input type="checkbox" checked aria-label="Monitor season 1"><strong>▾ Season 1</strong><span class="c-muted">13/13 on disk</span></label>${btn('Search pack','search-pack')}</div><div class="c-table-wrap"><table><thead><tr><th class="c-checkcell"></th><th style="width:10%">#</th><th style="width:30%">Title</th><th style="width:17%">Air date</th><th style="width:16%">File</th><th style="width:23%"></th></tr></thead><tbody>${[['1x01','DTLA','2019-01-08'],['1x02','The Coterie','2019-01-15'],['1x03','Allies','2019-01-22'],['1x04','Playing the Game','2019-01-29'],['1x05','Parental Guidance Suggested','2019-02-05']].map(([n,t,d])=>`<tr><td><input type="checkbox" checked aria-label="Monitor episode ${n}"></td><td>${n}</td><td>${t}</td><td class="c-muted">${d}</td><td>${pill('✓','good')}<small>${n==='1x05'?'720p':'1080p'}</small></td><td><div class="c-row">${btn('Search','search-episode')}${btn('Replace…','replace-episode:'+n)}</div></td></tr>`).join('')}</tbody></table></div><p class="c-note">Showing the first five episodes in this preview. Existing monitor checkboxes keep their monitoring purpose.</p></section><section class="c-panel"><h2>▸ Files <span class="c-muted">(13)</span></h2></section>${s.replaced?'<div class="c-message good">Replacement queued for '+esc(s.episode||'1x05')+'. Good sibling episodes remain in place.</div>':''}`;}
function dialog(){if(!s.dialog)return '';let title='',body='';if(s.dialog==='indexer'){const v=s.indexes[s.indexer];title='Request limit · '+s.indexer;body=`<fieldset><legend>Limit requests locally for this indexer</legend><div class="c-row"><label><input type="radio" name="localcap" value="off" data-field="cap-mode" ${!v.enabled?'checked':''}>Off</label><label><input type="radio" name="localcap" value="on" data-field="cap-mode" ${v.enabled?'checked':''}>On</label></div></fieldset>${v.enabled?`<div class="c-field"><label for="cr-cap">Requests per rolling 24 hours</label><input id="cr-cap" type="number" min="1" data-field="cap-value" value="${v.cap}" style="width:190px"></div>`:'<p>No Curator request cap for this indexer. No fallback of 250.</p>'}<p class="c-muted">${v.used} requests used. Usage stays recorded when this setting changes. RSS, automatic search, and manual search share this indexer’s allowance.</p><p class="c-note">Provider throttling remains separate. Other indexers keep their own settings.</p>${btn('Save request limit','save-cap','c-primary')}`;}else if(s.dialog==='replace'||s.dialog==='movie'){const movie=s.dialog==='movie';title=movie?'Mark bad and replace · Heretic':'Replace episode · Good Trouble '+(s.episode||'1x05');body=`<p><strong>Selected copy:</strong> ${movie?'additional copy':'primary copy'}</p><p class="c-mono">${movie?'Heretic.2024.2160p.REMUX':'Good.Trouble.S01.1080p.WEB-DL.PACK'}</p>${movie?'<p>Remove this bad copy, blacklist this source release, and obtain a replacement for this copy. Other copies remain untouched.</p>':`<fieldset><legend>Why replace it?</legend><label class="c-choice"><input type="radio" name="reason" data-field="reason" value="bad" ${s.reason==='bad'?'checked':''}><span>Bad media<small>Remove the selected bad episode before obtaining a replacement.</small></span></label><label class="c-choice"><input type="radio" name="reason" data-field="reason" value="quality" ${s.reason==='quality'?'checked':''}><span>Different quality<small>Keep this usable episode until its replacement is imported.</small></span></label></fieldset><fieldset><legend>Also blacklist the source pack?</legend><label class="c-choice"><input type="radio" name="blacklist" data-field="blacklist" value="no" ${s.blacklist===false?'checked':''}><span>Replace this episode only<small>The source pack remains eligible for other requests.</small></span></label><label class="c-choice"><input type="radio" name="blacklist" data-field="blacklist" value="yes" ${s.blacklist===true?'checked':''}><span>Replace and blacklist this source pack<small>Exclude this release from future downloads.</small></span></label></fieldset><div class="c-message good">The other 12 episodes stay in place under either choice.</div>`}<div class="c-actions">${btn('Cancel','close-modal')}${btn(movie?'Mark bad and replace':'Replace episode','submit-replace','c-primary',!movie&&s.blacklist===null?'disabled':'')}</div>`;}else if(s.dialog==='search'){title='Manual grab · Good Trouble'+(s.searchPack?' · Season 1':' · S01E05');body=`<div class="c-table-wrap"><table><thead><tr><th>Release</th><th style="width:19%">Quality</th><th style="width:15%">Size</th><th style="width:15%"></th></tr></thead><tbody><tr><td class="c-mono">${s.searchPack?'Good.Trouble.S01.1080p.WEB-DL.PACK':'Good.Trouble.S01E05.1080p.WEB-DL'}<small>${s.searchPack?'Existing season copy is retained':'Existing library copy: 720p'}</small></td><td>WEB-DL 1080p</td><td>${s.searchPack?'24.6':'2.1'} GB</td><td>${btn('Grab','grab','c-primary')}</td></tr></tbody></table></div><p>This grab will add another library copy. The existing library copy stays.</p><label><input type="checkbox" data-field="grabKeep" ${s.grabKeep?'checked':''}>Keep files if this download fails</label>`;}
return `<section class="c-dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="c-dialog-head"><h2>${esc(title)}</h2>${btn('Close','close-modal')}</div><div class="c-dialog-body">${body}</div></section>`;}
let shownDialog=null;
function render(){root.style.colorScheme=s.theme;root.querySelector('nav').innerHTML=['Library','Discover','Wanted','Calendar','Activity','Dashboard','System','Settings','Access'].map(n=>`<button class="cursor-interaction" data-page="${n.toLowerCase()}" ${s.page===n.toLowerCase()?'aria-current="page"':''}>${n}${n==='System'&&!s.cleaned?' <span style="color:var(--c-warn)">●</span>':''}</button>`).join('');main.innerHTML=(toast?`<div class="c-toast" role="status">${esc(toast)}</div>`:'')+({activity,settings,system,library}[s.page]||activity)();overlay.hidden=!s.dialog;overlay.innerHTML=dialog();root.querySelector('.c-layout').inert=!!s.dialog;root.querySelector('.c-app').style.minHeight=s.dialog==='replace'?'860px':'';if(s.dialog&&shownDialog!==s.dialog){overlay.querySelector('.c-dialog').scrollIntoView({block:'start',behavior:'instant'});overlay.querySelector('button')?.focus({preventScroll:true});}shownDialog=s.dialog;}
root.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||el.disabled)return;toast='';if(el.dataset.page){if(['activity','settings','system','library'].includes(el.dataset.page)){s.page=el.dataset.page;s.dialog=null;}else toast='This existing area is unchanged and is not part of the preview.';render();save();return;}const a=el.dataset.action||'';if(a.startsWith('indexer:')){s.indexer=a.slice(8);s.dialog='indexer';s.indexDraft=structuredClone(s.indexes);}
else if(a.startsWith('replace-episode:')){s.episode=a.split(':')[1];s.reason='bad';s.blacklist=null;s.dialog='replace';}
else if(a.startsWith('resolve-')&&a!=='resolve-route'){s.resolveAction=a.slice(8);}
else switch(a){case 'expand':s.expanded=!s.expanded;break;case 'toggle-resolve':s.resolve=!s.resolve;break;case 'resolve':case 'resolve-route':s.page='activity';s.resolve=true;break;case 'close-resolve':s.resolve=false;break;case 'submit-resolve':s.resolved=true;toast='Preview only: '+(s.resolveAction==='import'?'import queued; cleanup follows committed placement.':s.resolveAction==='retry'?'identification retry queued.':'selected completed files marked for disposal.');break;case 'history':s.page='activity';s.expanded=true;break;case 'inspect-storage':s.page='system';break;case 'retry-cleanup':s.retries++;if(s.mount)s.cleaned=true;toast=s.mount?'Preview: completed payload removed; cleanup verified.':'Preview: storage verification is still required. Retry '+s.retries+' recorded; next check in 2m.';break;case 'revalidate':s.mount=true;s.cleaned=true;toast='Preview: expected storage verified and outstanding cleanup completed.';break;case 'scan':toast='Preview: storage inventory refreshed. Every remaining payload has a recorded next action.';break;case 'save-cap':s.indexDraft=null;s.dialog=null;toast='Preview: request limit saved for '+s.indexer+'. Other indexers unchanged.';break;case 'close-modal':if(s.dialog==='indexer'&&s.indexDraft)s.indexes=s.indexDraft;s.dialog=null;s.indexDraft=null;break;case 'submit-replace':if(s.dialog==='replace'&&s.blacklist===null)return;s.replaced=true;s.dialog=null;toast='Preview: scoped replacement queued. Good siblings and other copies remain in place.';break;case 'mark-movie':s.dialog='movie';break;case 'search-episode':case 'search-pack':s.searchPack=a==='search-pack';s.dialog='search';break;case 'grab':s.dialog=null;toast='Preview: additional-copy grab queued. Existing library files remain.';break;case 'appearance':s.theme=s.theme==='dark'?'light':'dark';break;case 'unchanged':toast='This existing control is outside the scope of this preview.';break;}render();save();});
root.addEventListener('input',e=>{if(e.target.dataset.field==='cap-value'){s.indexes={...s.indexes,[s.indexer]:{...s.indexes[s.indexer],cap:Math.max(1,Number(e.target.value)||1)}};}});
root.addEventListener('change',e=>{const f=e.target.dataset.field;if(!f)return;const v=e.target.value;if(f==='cap-mode')s.indexes={...s.indexes,[s.indexer]:{...s.indexes[s.indexer],enabled:v==='on'}};else if(f==='cap-value'){save();return;}else if(f==='blacklist')s.blacklist=v==='yes';else if(f==='reason')s.reason=v;else s[f]=e.target.checked;render();save();});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.dialog){if(s.dialog==='indexer'&&s.indexDraft)s.indexes=s.indexDraft;s.dialog=null;render();save();}});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
render();
})();
</script>
