name: Compat

# The Sonarr/Radarr personality drift gate, as its own badge: the
# fake-consumer conformance suite (Jellyseerr / Prowlarr / Bazarr request
# flows) plus the contract-shape guards run hermetically, and the phase-4
# e2e spec exercises both personalities against the real compiled binary.
# Green badge = consumers can still talk to Monarr as if it were the real
# apps. (The live-fire docker harness in test/conformance stays manual.)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Fake-consumer flows + contract shapes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test ./internal/compat (race, verbose)
        run: go test -race -v -count=1 ./internal/compat/

  e2e:
    name: Personalities against the real binary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            test/e2e/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary with embedded UI
        run: make build

      - name: Install Playwright
        working-directory: test/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run compat e2e chain
        working-directory: test/e2e
        # phase4-compat reads library state the earlier specs build, so the
        # minimal dependency chain runs: setup+add → grab/import → compat.
        run: npx playwright test library.spec.ts phase2.spec.ts phase4-compat.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compat-playwright-report
          path: test/e2e/playwright-report/
          retention-days: 7
