name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Go + web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read-only. This job used to push the coverage badge to main; it does
    # not any more (see "Flag a stale coverage badge" below), and a token
    # that cannot write is a better guarantee of that than a comment.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web install + unit tests + build
        working-directory: web
        run: |
          npm ci
          npm run -s test
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify generated code is up to date (sqlc + oapi-codegen)
        run: |
          make gen
          git diff --exit-code -- internal/infra/sqlite/gen internal/api/gen

      - name: go vet
        run: go vet ./...

      - name: go test (race, coverage; includes architecture rules)
        run: |
          go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
          pct="$(sh scripts/coverage-badge.sh coverage.out coverage.svg coverage-hand.out)"
          echo "COVERAGE_PCT=$pct" >> "$GITHUB_ENV"
          {
            echo "### Go coverage: ${pct}%"
            echo
            echo 'Hand-written packages; generated code excluded (scripts/coverage-badge.sh).'
            echo
            echo '<details><summary>By package, least covered first</summary>'
            echo
            echo '```'
            # -coverpkg emits every block once per test binary that linked the
            # package, so the blocks must be merged before anything is summed —
            # counting them raw divides by the number of test binaries and
            # reports single digits for well-tested packages.
            awk 'NR > 1 { n[$1] = $2; if ($3 > 0) hit[$1] = 1 }
                 END {
                   for (b in n) {
                     split(b, f, ":"); pkg = f[1]; sub(/\/[^/]*$/, "", pkg);
                     stmt[pkg] += n[b]; if (b in hit) cov[pkg] += n[b]
                   }
                   for (p in stmt) printf "%5.1f%%  %s\n", 100 * cov[p] / stmt[p], p
                 }' coverage-hand.out | sort -n
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

          # The floor (./COVERAGE_MIN) is enforced LAST in this step, on
          # purpose: it fails the job that measured the number, but only after
          # the per-package breakdown above has been written. A gate that
          # aborts before the summary tells you that you dropped coverage and
          # not where, which is the half of the message that costs time.
          sh scripts/coverage-gate.sh coverage.out

      # The badge is a tracked file on main, linked from the README with a
      # RELATIVE path — the only form GitHub serves with the viewer's session,
      # and therefore the only one that renders on a private repository.
      #
      # CI does NOT commit it. It used to, and that lasted exactly one run:
      # the bot commit landed on main, every human clone was instantly one
      # commit behind, and `git push` started failing with a non-fast-forward
      # for work that had nothing to do with coverage. This repository is
      # synced between machines by git bundle, and a bundle is built against a
      # known base — a tip that moves on its own breaks every handoff, not
      # just the next push. A picture is not worth that.
      #
      # So the badge is refreshed by whoever changes coverage, in the same
      # commit, and CI only says when the committed one has gone stale. The
      # floor below is what actually protects the number on every push; the
      # badge is a readout, and a readout nobody can trust to be current is
      # still better than a repository nobody can push to.
      - name: Flag a stale coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -eu
          if git diff --quiet -- coverage.svg; then
            echo "coverage.svg is current at ${COVERAGE_PCT}%"
            exit 0
          fi
          committed="$(git show HEAD:coverage.svg | sed -n 's/.*aria-label="coverage: \([^"]*\)".*/\1/p')"
          echo "::warning file=coverage.svg::badge says ${committed:-unknown}, measured ${COVERAGE_PCT}% — run 'make coverage' and commit coverage.svg"

      - name: go build
        run: make go-build

  e2e:
    name: End-to-end (real binary + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            test/e2e/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary with embedded UI
        run: make build

      - name: Install Playwright
        working-directory: test/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: test/e2e
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/e2e/playwright-report/
          retention-days: 7

  mobile:
    name: Mobile (iOS + Android bundles)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install, test, and validate Expo configuration
        working-directory: mobile
        run: |
          npm ci
          npm run check
          npm run doctor

      - name: Produce iOS and Android application bundles
        working-directory: mobile
        run: npm run export
