name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Go + web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Write access is for one thing: pushing the coverage badge to the orphan
    # `badges` branch on main. Pull requests never reach that step.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web install + unit tests + build
        working-directory: web
        run: |
          npm ci
          npm run -s test
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify generated code is up to date (sqlc + oapi-codegen)
        run: |
          make gen
          git diff --exit-code -- internal/infra/sqlite/gen internal/api/gen

      - name: go vet
        run: go vet ./...

      - name: go test (race, coverage; includes architecture rules)
        run: |
          go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
          pct="$(sh scripts/coverage-badge.sh coverage.out coverage.svg coverage-hand.out)"
          echo "COVERAGE_PCT=$pct" >> "$GITHUB_ENV"
          {
            echo "### Go coverage: ${pct}%"
            echo
            echo 'Hand-written packages; generated code excluded (scripts/coverage-badge.sh).'
            echo
            echo '<details><summary>By package, least covered first</summary>'
            echo
            echo '```'
            # -coverpkg emits every block once per test binary that linked the
            # package, so the blocks must be merged before anything is summed —
            # counting them raw divides by the number of test binaries and
            # reports single digits for well-tested packages.
            awk 'NR > 1 { n[$1] = $2; if ($3 > 0) hit[$1] = 1 }
                 END {
                   for (b in n) {
                     split(b, f, ":"); pkg = f[1]; sub(/\/[^/]*$/, "", pkg);
                     stmt[pkg] += n[b]; if (b in hit) cov[pkg] += n[b]
                   }
                   for (p in stmt) printf "%5.1f%%  %s\n", 100 * cov[p] / stmt[p], p
                 }' coverage-hand.out | sort -n
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

          # The floor (./COVERAGE_MIN) is enforced LAST in this step, on
          # purpose: it fails the job that measured the number, but only after
          # the per-package breakdown above has been written. A gate that
          # aborts before the summary tells you that you dropped coverage and
          # not where, which is the half of the message that costs time.
          sh scripts/coverage-gate.sh coverage.out

      # The badge is a tracked file on main, linked from the README with a
      # RELATIVE path. It used to live on an orphan `badges` branch behind an
      # absolute raw.githubusercontent.com URL, which keeps bot commits out of
      # main's history — but GitHub fetches an absolute image URL through its
      # proxy, anonymously, so on a private repository it 404s and the badge is
      # simply broken. A relative path is served by github.com itself and
      # honours the viewer's session, so it renders private *and* public.
      #
      # The cost is a bot commit whenever the number moves, which is why this
      # exits early when the blob has not changed. Nothing external is in the
      # loop: the number is measured by the step above, the SVG is rendered by
      # a script in this repo, and the push uses the token GitHub already
      # gives the job.
      - name: Publish the coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GIT_AUTHOR_NAME: monarr-ci
          GIT_AUTHOR_EMAIL: ci@monarr.invalid
          GIT_COMMITTER_NAME: monarr-ci
          GIT_COMMITTER_EMAIL: ci@monarr.invalid
        run: |
          set -eu
          blob="$(git hash-object -w coverage.svg)"
          # Plumbing against a scratch index, so the working tree and the rest
          # of this job are untouched. It must be a path that does NOT exist:
          # git reads the index before writing it, and an empty file from
          # plain `mktemp` fails with "index file smaller than expected".
          scratch="$(mktemp -d)"
          GIT_INDEX_FILE="$scratch/index"
          export GIT_INDEX_FILE
          trap 'rm -rf "$scratch"' EXIT

          # main is a moving target: it can gain a real commit between this job
          # starting and this push landing. Each attempt re-reads the current
          # tip and rebuilds on top of it, so the badge can never revert
          # somebody else's work — and a persistent race warns rather than
          # failing a build over a picture.
          for attempt in 1 2 3; do
            git fetch --quiet --depth=1 origin main
            base="$(git rev-parse FETCH_HEAD)"
            if [ "$(git rev-parse --verify -q "$base:coverage.svg" || true)" = "$blob" ]; then
              echo "badge unchanged at ${COVERAGE_PCT}%"
              exit 0
            fi
            git read-tree "$base"
            git update-index --add --cacheinfo "100644,$blob,coverage.svg"
            tree="$(git write-tree)"
            # [skip ci] is belt and braces: a push made with the default
            # GITHUB_TOKEN does not trigger workflows, so this cannot loop.
            commit="$(git commit-tree "$tree" -p "$base" \
              -m "coverage: ${COVERAGE_PCT}% (${GITHUB_SHA}) [skip ci]")"
            if git push origin "$commit:refs/heads/main"; then
              echo "badge published at ${COVERAGE_PCT}%"
              exit 0
            fi
            echo "main moved under attempt ${attempt}; retrying"
            sleep 5
          done
          echo "::warning::coverage badge not published after 3 attempts (main kept moving)"

      - name: go build
        run: make go-build

  e2e:
    name: End-to-end (real binary + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            test/e2e/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary with embedded UI
        run: make build

      - name: Install Playwright
        working-directory: test/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: test/e2e
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/e2e/playwright-report/
          retention-days: 7
