name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    # Public publication requires a GitHub-hosted Ubuntu runner and only
    # approved Actions in this job. Never run pull-request code here.
    if: github.repository == 'pjunod/curator'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Analyze repository practices and publish score
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Preserve scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 14
          if-no-files-found: error
      - name: Upload code scanning findings
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: scorecard.sarif
          category: openssf-scorecard
