version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The Expo SDK fixes react and react-native (bundledNativeModules), and
    # react-test-renderer and @types/react must match react; Expo Doctor in
    # CI rejects mismatches. They move only with an Expo SDK upgrade via
    # `npx expo install --fix`. Because these ignores list only update-types,
    # they skip version updates but not security updates.
    ignore:
      - dependency-name: react
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-native
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-test-renderer
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # @types/react-test-renderer tracks react's major.
      - dependency-name: "@types/react-test-renderer"
        update-types:
          - version-update:semver-major
      # `expo` is the SDK itself: its minors and patches stay within SDK 58,
      # and a major is an SDK upgrade done with `npx expo install --fix`.
      - dependency-name: expo
        update-types:
          - version-update:semver-major
      # These direct dependencies have ~ ranges in the expo package's
      # bundledNativeModules.json, so only patches stay valid for Expo
      # Doctor. When `npx expo install` adds a bundled module, list it here
      # too. (A wildcard `expo-*` would also freeze expo-doctor, which is not
      # SDK-pinned.)
      - dependency-name: expo-build-properties
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: expo-camera
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: expo-constants
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: expo-crypto
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: expo-network
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: expo-secure-store
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: expo-splash-screen
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: expo-status-bar
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-native-safe-area-context
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      # bundledNativeModules.json couples an `expo` release to the module
      # patches it expects, so they land in one PR. This group comes before
      # mobile-patches because a dependency joins only the first group it
      # matches.
      expo-sdk:
        applies-to: version-updates
        patterns:
          - expo
          - "expo-*"
          - react-native-safe-area-context
        exclude-patterns:
          - expo-doctor
        update-types:
          - patch
          - minor
      mobile-patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
  - package-ecosystem: npm
    directory: /test/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      e2e-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
  - package-ecosystem: cargo
    directory: /tools/curator-embed
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      embed-rust-patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      deployment-image-patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
  - package-ecosystem: docker
    directory: /tools/nfs-qual
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nfs-image-patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
  - package-ecosystem: pip
    directory: /tools/curator-embed
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      embed-python-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
