version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The Expo SDK fixes react and react-native (bundledNativeModules), and
    # react-test-renderer and @types/react must match react; Expo Doctor in
    # CI rejects mismatches. They move only with an Expo SDK upgrade via
    # `npx expo install --fix`. Because these ignores list only update-types,
    # they skip version updates but not security updates.
    ignore:
      - dependency-name: react
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-native
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-test-renderer
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      mobile-patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
  - package-ecosystem: npm
    directory: /test/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      e2e-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
  - package-ecosystem: cargo
    directory: /tools/curator-embed
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      embed-rust-patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      deployment-image-patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
  - package-ecosystem: docker
    directory: /tools/nfs-qual
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nfs-image-patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
  - package-ecosystem: pip
    directory: /tools/curator-embed
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      embed-python-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
